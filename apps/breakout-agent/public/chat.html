<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>DataQuant Chat — the alert pool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --bg:#111827; --panel:#1f2937; --line:#374151; --fg:#f3f4f6; --muted:#9ca3af; --green:#34d399; --red:#f87171; --amber:#fbbf24; --blue:#60a5fa; }
    body { background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="h-screen flex flex-col">
  <header class="h-12 flex-shrink-0 flex items-center gap-3 px-3 sm:px-5 border-b border-gray-800 bg-gray-950/95">
    <a href="/dashboard" class="flex items-center gap-2" title="Screener">
      <span class="w-6 h-6 rounded-md bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-[11px] font-bold">DQ</span>
      <span class="font-semibold tracking-tight hidden sm:inline">Data Quant</span>
    </a>
    <span class="text-gray-600">/</span>
    <span class="font-semibold">Chat</span>
    <span class="text-xs text-gray-500 hidden md:inline">the screen's alert pool, in conversation</span>
    <div class="ml-auto flex items-center gap-2 sm:gap-3 text-xs">
      <button id="pool-toggle" class="md:hidden px-2.5 py-1 rounded ring-1 ring-gray-700 text-gray-300" onclick="ui.togglePool()">Pool</button>
      <select id="region" class="bg-gray-900 text-gray-300 rounded px-2 py-1 ring-1 ring-gray-800" onchange="ui.setRegion(this.value)" title="Market">
        <option value="us">US</option><option value="in">India</option>
      </select>
      <a href="/dashboard" class="text-gray-400 hover:text-white">Screener</a>
      <a href="/pulse" class="text-gray-400 hover:text-white hidden sm:inline">Pulse</a>
    </div>
  </header>

  <div id="chat-root" class="flex-1 min-h-0 flex"></div>

  <script src="/chat-widget.js"></script>
  <script>
    // The page is the widget in "page" mode; `ui` stays global for the tests
    // and the header controls.
    window.ui = DQChat.mount(document.getElementById('chat-root'), {
      region: location.pathname.startsWith('/in') ? 'in' : 'us',
      compact: false,
    });
    document.getElementById('region').value = ui.region;
  </script>
</body>
</html>
