                    <span class="${signal.pctGainFromEntry !== null && signal.pctGainFromEntry >= 0 ? 'text-green-400' : 'text-red-400'} font-mono font-bold">
                      ${signal.pctGainFromEntry !== null ? (signal.pctGainFromEntry >= 0 ? '+' : '') + signal.pctGainFromEntry.toFixed(2) + '%' : '—'}
                    </span>
                  </div>
                  <div class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-2.5 py-1.5 flex justify-between text-[13px]">
                    <span class="text-gray-400">Days in Extension</span>
                    <span class="text-blue-400">${signal.daysSinceBreakout !== null ? signal.daysSinceBreakout.toFixed(1) + ' days' : '—'}</span>
                  </div>
                  <div class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-2.5 py-1.5 flex justify-between text-[13px]">
                    <span class="text-gray-400">First Green Date</span>
                    <span class="text-gray-300">${signal.firstGreenAt ? new Date(signal.firstGreenAt).toLocaleDateString() + ' ' + new Date(signal.firstGreenAt).toLocaleTimeString() : '—'}</span>
                  </div>
                  <div class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-2.5 py-1.5 flex justify-between text-[13px]">
                    <span class="text-gray-400">Still Above Entry</span>
                    <span class="${signal.pctGainFromEntry !== null && signal.pctGainFromEntry >= -1 ? 'text-green-400' : 'text-red-400'}">
                      ${signal.pctGainFromEntry !== null ? (signal.pctGainFromEntry >= -1 ? '✓ Yes' : '✗ No — below entry') : '—'}
                    </span>
                  </div>
                </div>
              </div>
              ` : ''}

              <!-- Setup Metrics -->
              ${signal.signalType === 'setup' ? `
              <div class="border-t border-gray-700/60 pt-4">
                <h3 class="font-semibold text-gray-200 mb-3 flex items-center gap-2">
                  <span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
                  <span data-tip="Type 2 setup — the stock is consolidating with a bullish MA stack and low relative volume, right below resistance. No breakout has fired yet — this is a watch-list candidate.">Pre-Breakout Setup</span>
                </h3>
                <div class="bg-blue-500/10 ring-1 ring-blue-500/30 rounded-lg px-3 py-2.5 mb-3">
                  <p class="text-blue-300 text-sm font-medium"><span class="font-bold">${(signal.setupType || 'base').toUpperCase()}</span> · Ready to move</p>
                </div>
                <div class="space-y-2 text-sm">
                  <div class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-2.5 py-1.5 flex justify-between text-[13px]">
                    <span class="text-gray-400">Setup Type</span>
                    <span class="text-blue-400 font-semibold">${(signal.setupType || 'base').toUpperCase()}</span>
                  </div>
                  <div class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-2.5 py-1.5 flex justify-between text-[13px]">
                    <span class="text-gray-400">Distance from MA20</span>
                    <span class="text-green-400">${this.safeNum(signal.distanceFromMA20, 1)}%</span>
                  </div>
                  <div class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-2.5 py-1.5 flex justify-between text-[13px]">
                    <span class="text-gray-400">Consolidation Range</span>
                    <span class="text-yellow-400">${signal.consolidationRange?.toFixed(1) || 'N/A'}%</span>
                  </div>
                  <div class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-2.5 py-1.5 flex justify-between text-[13px]">
                    <span class="text-gray-400">Volume Indecision</span>
                    <span class="text-yellow-400">${signal.consolidationVolume?.toFixed(0) || 'N/A'}% of avg</span>
                  </div>
                  <div class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-2.5 py-1.5 flex justify-between text-[13px]">
                    <span class="text-gray-400">MA Alignment</span>
                    <span class="text-green-400">✓ Bullish Turning</span>
                  </div>
                </div>
              </div>
              ` : ''}

              <!-- Agent Decision -->
              <div class="border-t border-gray-700/60 pt-4">
                <h3 class="font-semibold text-gray-200 mb-2 flex items-center gap-2">
                  <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
                  Agent Analysis
                </h3>
                <div class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-3 py-2.5 text-[13px] text-gray-300 whitespace-pre-wrap break-words max-h-48 overflow-y-auto leading-relaxed">
                  ${signal.agentDecision || 'No analysis available'}
                </div>
              </div>

              <!-- Earnings Transcript Analysis (loaded lazily) -->
              ${signal.assetType === 'etf' ? '' : /\.(NS|BO)$/i.test(signal.asset) ? `
              <div class="border-t border-gray-700/60 pt-4">
                <h3 class="font-semibold text-gray-200 flex items-center gap-2 mb-2">
                  <span class="w-1.5 h-1.5 rounded-full bg-gray-500"></span>
                  Earnings Call Analysis
                </h3>
                <div class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-3 py-2.5 text-[12px] text-gray-500 leading-relaxed">
                  Not available for NSE/BSE listings — earnings transcripts are US-only in our data source.
                </div>
              </div>
              ` : `
              <div id="transcript-section" class="border-t border-gray-700/60 pt-4">
                <div class="flex items-center justify-between mb-2">
                  <h3 class="font-semibold text-gray-200 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    Earnings Call Analysis
                  </h3>
                  <button
                    id="transcript-analyze-btn"
                    onclick="dashboard.analyzeTranscript('${assetEscaped}', event);"
                    class="text-[11px] uppercase tracking-wider font-semibold px-2.5 py-1 rounded bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 ring-1 ring-blue-500/40 transition"
                  >
                    Analyze
                  </button>
                </div>
                <div id="transcript-content" class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-3 py-2.5 text-[13px] text-gray-300 leading-relaxed">
                  <span class="text-gray-500">Loading…</span>
                </div>
              </div>
              `}

              <!-- Export / Share -->
              <div class="border-t border-gray-700/60 pt-4">
                <button
                  onclick="dashboard.exportSignal('${assetEscaped}', event);"
                  class="w-full px-3 py-2 rounded-md text-sm font-semibold transition bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 ring-1 ring-blue-500/40"
                >
                  ⤴ Export / Share (PDF · HTML)
                </button>
              </div>

              <!-- Shortlist & Remove -->
              <div class="pt-3 grid grid-cols-2 gap-2">
                <button
                  onclick="dashboard.toggleShortlist('${assetEscaped}', event);"
                  class="px-3 py-2 rounded-md text-sm font-semibold transition ring-1 ${
                    inShortlist
                      ? 'bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-300 ring-yellow-500/40'
                      : 'bg-gray-800/60 hover:bg-gray-700/60 text-gray-300 ring-gray-700/60'
                  }"
                >
                  ${inShortlist ? '★ Shortlisted' : '☆ Shortlist'}
                </button>
                <button
                  onclick="dashboard.removeAsset('${assetEscaped}', event); event.preventDefault();"
                  class="px-3 py-2 rounded-md text-sm font-semibold transition bg-red-500/10 hover:bg-red-500/20 text-red-300 ring-1 ring-red-500/30"
                >
                  Hide
                </button>
              </div>

              <!-- Timestamp -->
              <div class="border-t border-gray-700/60 pt-3 text-[11px] text-gray-500 font-mono">
                Updated ${new Date(signal.createdAt).toLocaleString()}
              </div>
            </div>
          </div>
        `;

        // Lazy load earnings transcript analysis for US stocks only (FMP has no
        // NSE/BSE transcripts — skip the fetch, the section shows an N/A note).
        if (signal.assetType !== 'etf' && !/\.(NS|BO)$/i.test(signal.asset)) {
          fetch('/api/transcript/' + encodeURIComponent(signal.asset))
            .then(r => r.ok ? r.json() : null)
            .then(ta => this.renderTranscript(ta))
            .catch(() => {
              const el = document.getElementById('transcript-content');
              if (el) el.innerHTML = '<span class="text-gray-500">Failed to load analysis.</span>';
            });
        }

        const chartToken = ++this._chartToken;
        fetch('/api/candles/' + encodeURIComponent(signal.asset))
          .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then(bars => {
            if (chartToken !== this._chartToken) return; // drawer navigated away
            if (!bars || !bars.length) {
              const el = document.getElementById('chart-container');
              if (el) el.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400">No price data available</div>';
              return;
            }
            const el = document.getElementById('chart-container');
            if (!el) return;
            el.innerHTML = ''; // Clear placeholder
            const chart = this._drawerChart = LightweightCharts.createChart(el, {
              autoSize: true,
              height: 260,
              layout: { background: { color: '#111827' }, textColor: '#9ca3af' },
              grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
              crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
              rightPriceScale: {
                borderColor: '#374151',
                // breathing room above/below so price lines don't crowd the candles
                scaleMargins: { top: 0.12, bottom: 0.12 },
              },
              // rightOffset adds blank bars on the right so the latest candle isn't covered by R/S price-line labels
              timeScale: { borderColor: '#374151', timeVisible: false, rightOffset: 10 },
            });
            const series = chart.addCandlestickSeries({
              upColor: '#10b981',
              downColor: '#ef4444',
              borderVisible: false,
              wickUpColor: '#10b981',
              wickDownColor: '#ef4444',
            });
            series.setData(bars);
            // Show ~6 months of daily data (≈126 trading bars). Use a LOGICAL
            // range extended ~10 bars PAST the last candle: setVisibleRange(to=
            // lastBar) pins the latest candle to the right edge, so the R/Entry
            // price-line labels cover it. The +10 keeps that blank margin.
            if (bars.length > 0) {
              const barsToShow = Math.min(126, bars.length);
              const startIdx = Math.max(0, bars.length - barsToShow);
              chart.timeScale().setVisibleLogicalRange({ from: startIdx, to: bars.length - 1 + 10 });
            } else {
              chart.timeScale().fitContent();
            }

            // Breakout: show resistance/support
            if (signal.signalType === 'breakout') {
              if (signal.resistance) {
                series.createPriceLine({ price: signal.resistance, color: '#ef4444', lineWidth: 1, lineStyle: 2, title: 'R' });
              }
              if (signal.support) {
                series.createPriceLine({ price: signal.support, color: '#10b981', lineWidth: 1, lineStyle: 2, title: 'S' });
              }
            }
            // Extension: show entry resistance (yellow) + current resistance (red)
            else if (signal.signalType === 'extension' && signal.entryResistance) {
              series.createPriceLine({ price: signal.entryResistance, color: '#eab308', lineWidth: 2, lineStyle: 2, title: 'Entry' });
              if (signal.resistance && signal.resistance !== signal.entryResistance) {
                series.createPriceLine({ price: signal.resistance, color: '#ef4444', lineWidth: 1, lineStyle: 2, title: 'R' });
              }
            }
            // Setup: show MA20
            else if (signal.signalType === 'setup' && signal.ma20) {
              series.createPriceLine({ price: signal.ma20, color: '#3b82f6', lineWidth: 1, lineStyle: 2, title: 'MA20' });
            }
          })
          .catch(err => {
            const el = document.getElementById('chart-container');
            if (el) el.innerHTML = `<div class="flex items-center justify-center h-full text-gray-400 text-sm">Chart failed to load</div>`;
            console.error('Chart error:', err);
          });
      }

      isInShortlist(asset) {
        return this.shortlist.some(item => item.asset === asset);
      }

      // Build a self-contained, light-theme, shareable HTML report of the open
      // drawer's signal (works as-is via email, or Save-as-PDF from the button).
      // ponytail: browser print → PDF; no server route / OG card. Add a public
      // /share/:asset route with OG meta if social preview cards are needed.
      async exportSignal(asset, event) {
        if (event) event.stopPropagation();
        const s = this.selectedAsset;
        if (!s) return;
        // Open the window synchronously (inside the click gesture) so pop-up
        // blockers allow it; we fill it in after the async transcript fetch.
        const w = window.open('', '_blank');
        if (!w) { this.toast('Pop-up blocked — allow pop-ups to export', { kind: 'warn' }); return; }
        w.document.write('<!doctype html><title>Generating…</title><body style="font:15px -apple-system,sans-serif;color:#64748b;padding:40px">Generating report…</body>');

        const esc = (v) => { const d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; };
        const n = (v, d = 2) => this.safeNum(v, d);

        // Earnings call summary is loaded lazily (not on the signal) — fetch it
        // for stocks so the shared report carries it. ETFs have no transcript.
        let ta = null;
        if (s.assetType !== 'etf') {
          try { const r = await fetch('/api/transcript/' + encodeURIComponent(asset)); if (r.ok) ta = await r.json(); } catch (_) {}
        }

        // Live chart snapshot → embeddable PNG (may be absent if chart still loading)
        let chartImg = '';
        try {
          if (this._drawerChart && this._drawerChart.takeScreenshot) {
            chartImg = `<img src="${this._drawerChart.takeScreenshot().toDataURL('image/png')}" alt="${esc(asset)} price chart" style="width:100%;border-radius:8px;border:1px solid #e5e7eb"/>`;
          }
        } catch (_) {}

        const buyLabel = s.signalType === 'breakout' ? 'Buy Point' : s.signalType === 'extension' ? 'Entry' : s.signalType === 'setup' ? 'MA20' : 'Level';

        // Flag badges (replaces the signal-type label): which lists this name is
        // in — Beat & Raise, Unusual Volume — plus whether it has earnings analysis.
        const lists = this.listsFor(asset);
        const inList = (k) => lists.some(l => l.key === k);
        const flagBadges = [
          inList('beat-raise') ? '<span class="badge" style="background:#f3e8ff;color:#7e22ce">Beat &amp; Raise</span>' : '',
          inList('unusual-volume') ? '<span class="badge" style="background:#ffedd5;color:#c2410c">Unusual Volume</span>' : '',
          ta ? '<span class="badge" style="background:#dcfce7;color:#166534">Earnings</span>' : '',
          s.stoppedOut ? '<span class="badge" style="background:#fef2f2;color:#dc2626">Stopped out</span>' : '',
        ].join('');
        const buyVal = s.signalType === 'setup' ? s.ma20 : s.entryPrice;

        const tile = (label, val, color) => `<div style="flex:1;min-width:110px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;font-weight:600">${label}</div>
          <div style="font-size:20px;font-weight:700;color:${color || '#0f172a'};font-variant-numeric:tabular-nums;margin-top:2px">${val}</div></div>`;

        const row = (k, v) => `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f1f5f9"><span style="color:#64748b">${k}</span><span style="font-weight:600;color:#0f172a;font-variant-numeric:tabular-nums">${v}</span></div>`;
        let levels = '';
        if (s.signalType === 'breakout') {
          levels = row('Resistance (R)', CUR + n(s.resistance)) + row('Support (S)', CUR + n(s.support));
        } else if (s.signalType === 'extension') {
          levels = row('Entry / breakout level', s.entryResistance != null ? CUR + n(s.entryResistance) : '—')
            + row('% gain from entry', s.pctGainFromEntry != null ? (s.pctGainFromEntry >= 0 ? '+' : '') + n(s.pctGainFromEntry) + '%' : '—')
            + row('Days in extension', s.daysSinceBreakout != null ? n(s.daysSinceBreakout, 1) + ' days' : '—');
        } else if (s.signalType === 'setup') {
          levels = row('Setup type', (s.setupType || 'base').toUpperCase())
            + row('Distance from MA20', n(s.distanceFromMA20, 1) + '%')
            + row('Consolidation range', s.consolidationRange != null ? n(s.consolidationRange, 1) + '%' : 'N/A');
        }

        // Earnings Call section (replaces Agent Analysis in the shared report).
        let earnings = '';
        if (ta) {
          const toneC = ta.tone === 'bullish' ? '#16a34a' : ta.tone === 'bearish' ? '#dc2626' : '#ca8a04';
          const guidC = ta.guidanceDirection === 'raised' ? '#16a34a' : ta.guidanceDirection === 'lowered' ? '#dc2626' : '#64748b';
          const chips = (arr, bg, fg, pre) => (arr || []).map(x => `<span style="display:inline-block;padding:2px 8px;border-radius:6px;background:${bg};color:${fg};font-size:12px;margin:0 4px 4px 0">${pre}${esc(x)}</span>`).join('');
          const hi = chips(ta.highlights, '#dcfce7', '#166534', '+ ');
          const rk = chips(ta.riskFlags, '#fee2e2', '#991b1b', '⚠ ');
          earnings = `<div class="sec"><h3>Earnings Call — Q${esc(ta.quarter)} ${esc(ta.year)}</h3>
            <div style="display:flex;gap:16px;font-size:13px;margin-bottom:8px;flex-wrap:wrap">
              <span>Tone: <b style="color:${toneC}">${esc(ta.tone)}${ta.toneScore != null ? ' (' + ta.toneScore.toFixed(2) + ')' : ''}</b></span>
              <span>Guidance: <b style="color:${guidC}">${esc(ta.guidanceDirection)}</b></span>
            </div>
            <div class="analysis">${esc(ta.summary)}</div>
            ${hi ? `<div style="margin-top:8px">${hi}</div>` : ''}
            ${rk ? `<div style="margin-top:4px">${rk}</div>` : ''}
            ${ta.modelUsed ? `<div style="font-size:11px;color:#94a3b8;margin-top:8px">Model: ${esc(ta.modelUsed)}${ta.createdAt ? ' · ' + esc(new Date(ta.createdAt).toLocaleDateString()) : ''}</div>` : ''}
          </div>`;
        } else if (s.assetType !== 'etf') {
          earnings = `<div class="sec"><h3>Earnings Call</h3><div class="analysis" style="color:#94a3b8">No earnings call analysis available yet.</div></div>`;
        }

        const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(asset)} — Signal Forge</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f7;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:640px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .hd{padding:20px 24px;border-bottom:1px solid #eef2f7}
  .ticker{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eff6ff;color:#2563eb;margin-left:8px;vertical-align:middle}
  .sec{padding:16px 24px}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin:0 0 8px}
  .tiles{display:flex;flex-wrap:wrap;gap:8px}
  .analysis{background:#f8fafc;border:1px solid #eef2f7;border-radius:8px;padding:12px 14px;font-size:14px;color:#334155;white-space:pre-wrap;word-break:break-word}
  .ft{padding:14px 24px;border-top:1px solid #eef2f7;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  a{color:#2563eb;text-decoration:none}
  .bar{max-width:640px;margin:16px auto 0;padding:0 16px;display:flex;gap:8px}
  .bar button{flex:1;padding:11px;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:#2563eb;color:#fff}
  .bar button.alt{background:#e2e8f0;color:#0f172a}
  @media print{.bar{display:none}body{background:#fff}.wrap{margin:0}.card{border:0;box-shadow:none}}
</style></head><body>
<div class="bar">
  <button onclick="window.print()">Save as PDF / Print</button>
  <button class="alt" onclick="const b=new Blob([document.documentElement.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='${esc(asset)}-signal.html';a.click()">Download HTML</button>
</div>
<div class="wrap"><div class="card">
  <div class="hd">
    <div><span class="ticker">${esc(asset)}</span>${flagBadges}</div>
    <div style="color:#64748b;font-size:14px;margin-top:4px">${esc(s.sector || 'Unknown')}${s.industry && s.industry !== 'Unknown' ? ' · ' + esc(s.industry) : ''}</div>
  </div>
  <div class="sec"><div class="tiles">
    ${tile('Price', CUR + n(s.currentPrice), '#0f172a')}
    ${tile(buyLabel, buyVal != null ? CUR + n(buyVal) : '—', '#b45309')}
    ${tile('Stop', s.stopLoss != null ? CUR + n(s.stopLoss) : '—', '#dc2626')}
    ${tile('Confidence', s.confidence + '%', s.confidence >= 90 ? '#16a34a' : s.confidence >= 80 ? '#ca8a04' : '#ea580c')}
  </div></div>
  ${chartImg ? `<div class="sec"><h3>6 months · Daily</h3>${chartImg}</div>` : ''}
  ${levels ? `<div class="sec"><h3>Levels</h3>${levels}</div>` : ''}
  ${earnings}
  <div class="ft">
    <span>Signal Forge · ${s.createdAt ? esc(new Date(s.createdAt).toLocaleDateString()) : ''}</span>
    <a href="${this.getTradingViewUrl(asset)}" target="_blank" rel="noopener">View on TradingView ↗</a>
  </div>
</div></div>
</body></html>`;

        w.document.open();
        w.document.write(html);
        w.document.close();
      }

      async runScan() {
        this.scanning = true;
        this.render();
        try {
          const res = await fetch('/api/scan', { method: 'POST' });
          const data = await res.json();
          console.log('Scan started:', data);
          setTimeout(() => this.fetchSignals(), 2000);
        } catch (error) {
          console.error('Failed to start scan:', error);
        } finally {
          this.scanning = false;
          this.render();
        }
      }

      getSignalColor(signal) {
        // Fresh breakout at 99% = solid green
        if (signal.signalType === 'breakout' && signal.pineScriptGreen && signal.confidence === 99) {
          return { emoji: '🟢', label: 'fresh-breakout', bgClass: 'bg-green-700' };
        }
        // 99% green cone (any type)
        if (signal.confidence === 99) {
          return { emoji: '🟢', label: 'green', bgClass: 'bg-green-700' };
        }
        // 95-98%: high confidence
        if (signal.confidence >= 95) {
          return { emoji: '🟢', label: 'bright-green', bgClass: 'bg-green-600' };
        }
        // 90-94%: green fade
        if (signal.confidence >= 90) {
          return { emoji: '🟢', label: 'green-fade', bgClass: 'bg-green-500' };
        }
        // 85-89%: orange
        if (signal.confidence >= 85) {
          return { emoji: '🟠', label: 'orange', bgClass: 'bg-orange-600' };
        }
        // Extensions below 85%
        if (signal.signalType === 'extension') {
          return { emoji: '🟡', label: 'extension', bgClass: 'bg-yellow-600' };
        }
        // Below 85% = filtered out
        return { emoji: '⚪', label: 'neutral', bgClass: 'bg-gray-600' };
      }

      getTradingViewUrl(asset) {
        // TradingView needs an exchange prefix for Indian tickers; FMP's .NS/.BO
        // suffix doesn't resolve. Map .NS→NSE:, .BO→BSE:; US passes through.
        let sym = asset;
        if (/\.NS$/i.test(asset)) sym = 'NSE:' + asset.replace(/\.NS$/i, '');
        else if (/\.BO$/i.test(asset)) sym = 'BSE:' + asset.replace(/\.BO$/i, '');
        return `https://www.tradingview.com/chart/?symbol=${encodeURIComponent(sym)}`;
      }

      async copyTvList() {
        const list = this.shortlist.map(i => i.asset).join(',');
        try {
          await navigator.clipboard.writeText(list);
          this.toast(`Copied ${this.shortlist.length} tickers — paste into TradingView`, { kind: 'success' });
        } catch {
          this.toast('Copy failed', { kind: 'warn' });
        }
      }

      updateSearch(value) {
        clearTimeout(this._searchDebounceTimer);
        this._searchDebounceTimer = setTimeout(() => {
          this.filtering = value;
          this.render();
        }, 500);
      }

      // Source of truth for keyboard nav (space, ← →). When the shortlist view
      // is open, walking should stay within the shortlist; otherwise the main
      // filtered table. Returns full signal objects so openDrawer() gets all data.
      getNavList() {
        if (this.showShortlist) {
          const byAsset = new Map(this.signals.map(s => [s.asset, s]));
          return this.shortlist
            .map(item => byAsset.get(item.asset) || { asset: item.asset, assetType: 'stock' })
            .filter(Boolean);
        }
        return this.getFilteredSignals();
      }

      getFilteredSignals() {
        // "Stopped" is a cross-type view: show every stopped-out name regardless
        // of signal type or the min-confidence slider.
        const stoppedView = this.signalTypeFilter === 'stopped';
        let filtered = stoppedView
          ? this.signals.filter(s => s.stoppedOut)
          : this.signals.filter(s => s.confidence >= this.minConfidence);

        // Asset type filter (stocks, etfs, all)
        if (this.assetTypeFilter !== 'all') {
          filtered = filtered.filter(s => s.assetType === this.assetTypeFilter);
        }

        // Signal type filter
        if (this.signalTypeFilter !== 'all' && !stoppedView) {
          filtered = filtered.filter(s => s.signalType === this.signalTypeFilter);
        }

        // Sector filter
        if (this.sectorFilter !== 'all') {
          filtered = filtered.filter(s => s.sector === this.sectorFilter);
        }

        if (this.filtering) {
          filtered = filtered.filter(s => s.asset.toLowerCase().includes(this.filtering.toLowerCase()));
        }

        // Sort — stopped-out names always sink below live signals, whatever the sort key.
        filtered.sort((a, b) => {
          if (!!a.stoppedOut !== !!b.stoppedOut) return a.stoppedOut ? 1 : -1;
          let compareVal = 0;
          if (this.sortBy === 'confidence') {
            compareVal = b.confidence - a.confidence;
          } else if (this.sortBy === 'asset') {
            compareVal = a.asset.localeCompare(b.asset);
          } else if (this.sortBy === 'earnings') {
            const av = a.earningsSortScore;
            const bv = b.earningsSortScore;
            if (av == null && bv == null) compareVal = 0;
            else if (av == null) compareVal = 1;   // nulls last
            else if (bv == null) compareVal = -1;
            else compareVal = bv - av;
          }
          return this.sortDirection === 'asc' ? -compareVal : compareVal;
        });

        return filtered;
      }

      toggleSort(field) {
        if (this.sortBy === field) {
          this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          this.sortBy = field;
          this.sortDirection = 'desc';
        }
        this.savePrefs();
        this.render();
      }

      setFilter(kind, value) {
        this[kind] = value;
        this.savePrefs();
        if (kind === 'assetTypeFilter') this.fetchSignals();
        else this.render();
      }

      // Lookback widens the server-side window, so it must refetch.
      setLookback(v) {
        this.lookbackDays = Math.min(90, Math.max(1, parseInt(v, 10) || 3));
        this.savePrefs();
        this.fetchSignals();
      }

      resetFilters() {
        this.filtering = '';
        this.minConfidence = 85;
        this.signalTypeFilter = 'breakout';
        this.assetTypeFilter = 'all';
        this.sectorFilter = 'all';
        this.savePrefs();
        this.fetchSignals();
        this.toast('Filters reset', { kind: 'info' });

        const sectors = new Set();
        this.signals.forEach(s => {
          if (s.sector && s.sector !== 'Unknown') {

          }
        });
        return Array.from(sectors).sort();
      }

      renderMarketStatus() {
        // Region-aware: US = NYSE 9:30-16:00 ET, IN = NSE 9:15-15:30 IST.
        const isIN = REGION === 'in';
        const tz = isIN ? 'Asia/Kolkata' : 'America/New_York';
        const sfx = isIN ? 'IST' : 'ET';
        const now = new Date();
        const fmt = new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
        const parts = Object.fromEntries(fmt.formatToParts(now).map(p => [p.type, p.value]));
        const wd = parts.weekday;
        const h = parseInt(parts.hour, 10);
        const m = parseInt(parts.minute, 10);
        const mins = h * 60 + m;
        const isWeekday = ['Mon','Tue','Wed','Thu','Fri'].includes(wd);
        const open = isIN ? 9 * 60 + 15 : 9 * 60 + 30;
        const close = isIN ? 15 * 60 + 30 : 16 * 60;
        const openLabel = isIN ? `9:15 AM ${sfx}` : `10:00 AM ${sfx}`;
        const cronStart = isIN ? open : 10 * 60;  // US first scan 10 AM ET; IN from open
        const cronEnd = close - 15;               // last intraday scan ~15m before close

        let dot, label, nextScan;
        if (isWeekday && mins >= open && mins < close) {
          dot = 'bg-green-500';
          label = 'Market open';
          if (mins < cronStart) nextScan = `Next scan: ${openLabel}`;
          else if (mins < cronEnd) {
            const nextHour = h + 1;
            nextScan = `Next scan: ${nextHour}:00 ${sfx}`;
          } else nextScan = 'Last intraday scan complete';
        } else {
          dot = 'bg-gray-500';
          label = isWeekday && mins < open ? 'Pre-market' : 'Market closed';
          nextScan = isWeekday && mins < open ? `Next scan: ${openLabel} today` : `Next scan: Mon ${openLabel}`;
        }
        return `
          <div class="flex items-center gap-2 justify-end">
            <span class="inline-block w-2 h-2 rounded-full ${dot}"></span>
            <span class="text-gray-300 font-medium">${label}</span>
          </div>
          <div class="text-gray-500 mt-0.5">${nextScan} · live refresh ${new Date().toLocaleTimeString()}</div>
        `;
      }

      formatRelative(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        const diffMs = Date.now() - d.getTime();
        const min = Math.floor(diffMs / 60000);
        if (min < 1) return 'just now';
        if (min < 60) return min + 'm ago';
        const hr = Math.floor(min / 60);
        if (hr < 24) return hr + 'h ago';
        const day = Math.floor(hr / 24);
        if (day < 7) return day + 'd ago';
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      formatAlertDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      // Calendar date of the actual breakout: scan date minus N trading bars.
      // ponytail: business-day subtraction ignores market holidays, so it can be
      // off by one across a holiday. Fine for the 1-5 bar extension window.
      breakoutDateFromDays(scanIso, daysSinceBreakout) {
        if (!scanIso || daysSinceBreakout === null || daysSinceBreakout === undefined) return '';
        const d = new Date(scanIso);
        let bars = Math.ceil(daysSinceBreakout);
        while (bars > 0) {
          d.setDate(d.getDate() - 1);
          const wd = d.getDay();
          if (wd !== 0 && wd !== 6) bars--;
        }
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

                                  ${signal.assetType === 'etf' ? 'ETF' : 'Stock'}
                                </span>
                                ${signal.stoppedOut ? '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide ring-1 bg-red-500/15 text-red-400 ring-red-500/30" title="Price closed at/below the stop — stopped out">Stopped</span>' : ''}
                                ${signal.politicianBuy ? `<a href="${signal.politicianBuy.link || '#'}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide ring-1 bg-purple-500/15 text-purple-300 ring-purple-500/30 hover:bg-purple-500/25 transition" title="Politician purchase — ${signal.politicianBuy.name} (${signal.politicianBuy.transactionDate || '?'}) · ${signal.politicianBuy.amount || ''}">🏛 ${signal.politicianBuy.name.split(' ').slice(-1)[0]}</a>` : ''}
                                ${signal.winnerTier ? `<button onclick="dashboard.jumpToWinner('${assetEscaped}'); event.stopPropagation();" class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide ring-1 transition ${signal.winnerTier === 'A' ? 'bg-green-500/15 text-green-400 ring-green-500/30 hover:bg-green-500/25' : signal.winnerTier === 'B' ? 'bg-yellow-500/15 text-yellow-400 ring-yellow-500/30 hover:bg-yellow-500/25' : 'bg-gray-500/15 text-gray-300 ring-gray-500/30 hover:bg-gray-500/25'}" title="Also passes Winners fundamentals gate (tier ${signal.winnerTier}) — click to open Winners filtered to ${signal.asset}">W·${signal.winnerTier} ↗</button>` : ''}
                                ${this.crossRefPills(signal.asset, 'dashboard', 'winners')}
                                <button onclick="dashboard.removeAsset('${assetEscaped}', event);" class="delete-btn text-xs text-gray-500 hover:text-red-400 px-1.5 py-0.5 rounded hover:bg-red-900/40 ml-auto transition" title="Hide">
                                  ✕
                                </button>
                              </div>
                            </td>
                            <td data-label="Confidence" class="px-3 py-2.5 whitespace-nowrap">
                              <div class="flex flex-col gap-0.5 w-[70px]">
                                <div class="flex items-baseline gap-1">
                                  <span class="text-lg font-bold ${confTextColor} tabular-nums leading-none">${signal.confidence}</span>
                                  <span class="text-[10px] text-gray-500 font-medium">%</span>
                                </div>
                                <div class="conf-bar ${confTextColor}" style="--pct: ${signal.confidence}%;"></div>
                              </div>
                            </td>
                            <td data-label="Trend" class="px-3 py-2.5 whitespace-nowrap">${this.renderSparkline(signal.asset)}</td>
                            <td data-label="Earnings" class="px-3 py-2.5 text-xs whitespace-nowrap">${earnings}</td>
                            <td data-label="Sector" class="px-3 py-2.5 text-xs text-gray-400 whitespace-nowrap">${signal.sector || '<span class="text-gray-600">—</span>'}</td>
                            <td data-label="Signal" class="px-3 py-2.5 whitespace-nowrap">${signalLabel}</td>
                            <td data-label="Price" class="px-3 py-2.5 text-sm font-mono text-white whitespace-nowrap tabular-nums">${price}</td>
                            <td data-label="Levels" class="px-3 py-2.5 text-xs font-mono whitespace-nowrap tabular-nums">${levels}</td>
                            <td data-label="Detail" class="px-3 py-2.5 text-xs whitespace-nowrap tabular-nums">${detail}</td>
                            <td data-label="Updated" class="px-3 py-2.5 text-[11px] text-gray-500 font-mono whitespace-nowrap">${this.formatRelative(signal.createdAt)}</td>
                          </tr>
                        `;
                      }).join('')}
                    </tbody>
                  </table>
                </div>
              `}

              <!-- Footer removed — status now lives in the header -->

            </div>
          </div>
        `;
      }
    }

    const dashboard = new Dashboard();
  </script>
</body>
</html>
