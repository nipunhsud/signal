                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          </div>
        `;
      }

      // One signals-table <tr>. sourceExpr is the JS expression (as a string)
      // the row's onclick resolves its backing list from — main-table rows use
      // the filtered list, the Tracking section uses dashboard.trackingSignals.
      renderSignalRow(signal, idx, sourceExpr) {
                        const color = this.getSignalColor(signal);
                        const tvUrl = this.getTradingViewUrl(signal.asset);
                        const inShortlist = this.isInShortlist(signal.asset);
                        const assetEscaped = signal.asset.replace(/'/g, "\\'");
                        const signalLabel = signal.signalType === 'breakout'
                          ? (signal.weakVolume
                              ? '<span class="badge bg-orange-500/15 text-orange-300 ring-1 ring-orange-500/30" title="Clean breakout pattern but volume <1.2x avg — not alerted"><span class="badge-dot"></span>Breakout · weak vol</span>'
                              : signal.isVcp
                                ? '<span class="badge bg-purple-500/15 text-purple-300 ring-1 ring-purple-500/30" title="Volatility Contraction Pattern: tight base (ATR<2.5%), volatility contracting into the pivot, breakout bar expanding upward"><span class="badge-dot"></span>VCP</span>'
                                : '<span class="badge bg-green-500/15 text-green-400 ring-1 ring-green-500/30"><span class="badge-dot"></span>Actionable</span>')
                          : signal.signalType === 'extension'
                            ? (signal.extensionPhase === 'retest'
                                ? `<span class="badge bg-teal-500/15 text-teal-300 ring-1 ring-teal-500/30" title="Pulled back to/below entry while holding the breakout structure — the second-chance zone. Stop discipline unchanged."><span class="badge-dot"></span>Retest${signal.daysSinceBreakout !== null ? ' · ' + signal.daysSinceBreakout.toFixed(0) + 'd' : ''}</span>`
                                : `<span class="badge bg-yellow-500/15 text-yellow-400 ring-1 ring-yellow-500/30"><span class="badge-dot"></span>Extension${signal.daysSinceBreakout !== null ? ' · ' + signal.daysSinceBreakout.toFixed(0) + 'd' : ''}</span>`)
                            : signal.signalType === 'ep'
                            ? '<span class="badge bg-fuchsia-500/15 text-fuchsia-300 ring-1 ring-fuchsia-500/30" title="Episodic Pivot — catalyst-class repricing on huge volume; stop = event day low, wider risk"><span class="badge-dot"></span>⚡ EP</span>'
                            : '<span class="badge bg-blue-500/15 text-blue-400 ring-1 ring-blue-500/30"><span class="badge-dot"></span>Setup</span>';
                        const price = CUR + this.safeNum(signal.currentPrice, 2);
                        const levels = signal.signalType === 'breakout'
                          ? `<span class="text-gray-400" data-tip="Resistance — breakout level to clear.">R</span> <span class="text-red-400">${CUR}${this.safeNum(signal.resistance, 2)}</span> <span class="text-gray-600">·</span> <span class="text-gray-400" data-tip="Support — recent low, used to set stop loss.">S</span> <span class="text-green-400">${CUR}${this.safeNum(signal.support, 2)}</span>`
                          : signal.signalType === 'extension'
                            ? (signal.entryResistance != null
                                ? `<span class="text-gray-400" data-tip="Entry — the original breakout resistance level, when the fresh breakout fired.">entry</span> <span class="text-yellow-400">${CUR}${signal.entryResistance.toFixed(2)}</span>`
                                : '<span class="text-gray-500">—</span>')
                            : `<span class="text-gray-400" data-tip="20-day moving average — the setup pivots around this level.">MA20</span> <span class="text-blue-400">${CUR}${this.safeNum(signal.ma20, 2)}</span>`;
                        const detail = signal.signalType === 'breakout'
                          ? (() => {
                              // Frozen entryPrice is the actual breakout level; signal.resistance
                              // rolls with the 20-bar window and drifts once the breakout bar enters it.
                              const bo = signal.entryPrice != null ? signal.entryPrice : signal.resistance;
                              if (!(bo > 0) || !(signal.currentPrice > 0)) return '<span class="text-gray-500">—</span>';
                              const pct = (signal.currentPrice - bo) / bo * 100;
                              const color = signal.currentPrice >= bo ? 'text-green-400' : 'text-red-400';
                              const sign = pct >= 0 ? '+' : '';
                              return `<span class="text-gray-400">BO</span> <span class="text-yellow-400 font-mono">${CUR}${this.safeNum(bo, 2)}</span> <span class="text-gray-600">·</span> <span class="${color}">${sign}${pct.toFixed(1)}%</span>`;
                            })()
                          : signal.signalType === 'extension'
                            ? (signal.pctGainFromEntry != null
                                ? `<span class="${signal.pctGainFromEntry >= 0 ? 'text-green-400' : 'text-red-400'}">${signal.pctGainFromEntry >= 0 ? '+' : ''}${signal.pctGainFromEntry.toFixed(1)}%</span> <span class="text-gray-400">from entry</span>`
                                : '<span class="text-gray-400">below entry</span>')
                            : `<span class="text-gray-200 font-semibold" data-tip="${signal.setupType === 'handle' ? 'Handle — tight late-stage consolidation right at the pivot, just before the breakout.' : 'Base — broader flat consolidation zone forming below resistance.'}">${(signal.setupType || 'base').toUpperCase()}</span> <span class="text-gray-600">·</span> <span class="text-gray-400">${this.safeNum(signal.distanceFromMA20, 1)}% from MA20</span>`;
                        const earnings = (() => {
                          if (signal.earningsTone == null) {
                            return '<span class="text-gray-600 text-xs">—</span>';
                          }
                          const toneRing = signal.earningsTone === 'bullish' ? 'ring-green-500/40 text-green-400 bg-green-500/10'
                            : signal.earningsTone === 'bearish' ? 'ring-red-500/40 text-red-400 bg-red-500/10'
                            : 'ring-gray-500/40 text-gray-400 bg-gray-500/10';
                          const toneEmoji = signal.earningsTone === 'bullish' ? '▲'
                            : signal.earningsTone === 'bearish' ? '▼'
                            : '·';
                          const guidance = signal.earningsGuidance === 'raised'
                            ? '<span class="text-green-400 font-bold" title="Guidance raised">↑</span>'
                            : signal.earningsGuidance === 'lowered'
                              ? '<span class="text-red-400 font-bold" title="Guidance lowered">↓</span>'
                              : signal.earningsGuidance === 'maintained'
                                ? '<span class="text-gray-500" title="Guidance maintained">=</span>'
                                : '';
                          const qLabel = signal.earningsQuarter && signal.earningsYear
                            ? `<span class="text-gray-500 text-[10px] font-mono">Q${signal.earningsQuarter}'${String(signal.earningsYear).slice(-2)}</span>`
                            : '';
                          const score = signal.earningsToneScore != null
                            ? `<span class="badge ${toneRing} ring-1 font-mono">${toneEmoji}${signal.earningsToneScore.toFixed(2)}</span>`
                            : '';
                          return `<div class="flex items-center gap-1.5">${score}${guidance}${qLabel}</div>`;
                        })();
                        const confTextColor = signal.confidence >= 95 ? 'text-green-400'
                          : signal.confidence >= 85 ? 'text-yellow-400'
                          : signal.confidence >= 75 ? 'text-orange-400'
                          : 'text-red-400';
                        const tierClass = signal.confidence >= 99 ? 'tier-elite'
                          : signal.confidence >= 95 ? 'tier-strong'
                          : '';
                        return `
                          <tr
                            class="signal-row ${tierClass} ${idx % 2 === 0 ? 'bg-gray-800/60' : 'bg-gray-800/30'} border-b border-gray-700/50 cursor-pointer ${signal.stoppedOut ? 'opacity-50 border-l-2 border-red-500/70' : signal.signalType === 'extension' ? 'border-l-2 border-yellow-500/70' : ''}"
                            data-signal-index="${idx}"
                            onclick="if (!event.target.closest('button') && !event.target.closest('a')) dashboard.openDrawer((${sourceExpr})[parseInt(this.dataset.signalIndex)])"
                          >
                            <td class="card-header px-3 py-2.5 whitespace-nowrap">
                              <div class="flex items-center gap-2">
                                <button onclick="dashboard.toggleShortlist('${assetEscaped}', event);" class="hover:scale-125 transition flex-shrink-0 ${inShortlist ? 'text-yellow-400' : 'text-gray-500 hover:text-yellow-400'}" title="Shortlist">
                                  ${inShortlist ? '★' : '☆'}
                                </button>
                                <a href="${tvUrl}" target="_blank" rel="noopener noreferrer" class="row-asset text-blue-400 hover:text-blue-300 font-bold text-base tracking-tight" title="Open on TradingView">
                                  ${signal.asset}
                                </a>
                                <button onclick="dashboard.openChartView('${assetEscaped}'); event.stopPropagation();" class="text-gray-500 hover:text-blue-300 transition flex-shrink-0" title="Open full chart with base X-ray">⤢</button>
                                <span class="text-[9px] font-semibold px-1.5 py-0.5 rounded uppercase tracking-wide ${signal.assetType === 'etf' ? 'bg-amber-900/60 text-amber-300 ring-1 ring-amber-700/40' : 'bg-gray-700/60 text-gray-300 ring-1 ring-gray-600/40'}">
                                  ${signal.assetType === 'etf' ? 'ETF' : 'Stock'}
                                </span>
                                ${signal.stoppedOut ? '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide ring-1 bg-red-500/15 text-red-400 ring-red-500/30" title="Price closed at/below the stop — stopped out">Stopped</span>' : ''}
                                ${signal.politicianBuy ? `<a href="${signal.politicianBuy.link || '#'}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide ring-1 bg-purple-500/15 text-purple-300 ring-purple-500/30 hover:bg-purple-500/25 transition" title="Politician purchase — ${signal.politicianBuy.name} (${signal.politicianBuy.transactionDate || '?'}) · ${signal.politicianBuy.amount || ''}">🏛 ${signal.politicianBuy.name.split(' ').slice(-1)[0]}</a>` : ''}
                                ${signal.winnerTier ? `<button onclick="dashboard.jumpToWinner('${assetEscaped}'); event.stopPropagation();" class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide ring-1 transition ${signal.winnerTier === 'A' ? 'bg-green-500/15 text-green-400 ring-green-500/30 hover:bg-green-500/25' : signal.winnerTier === 'B' ? 'bg-yellow-500/15 text-yellow-400 ring-yellow-500/30 hover:bg-yellow-500/25' : 'bg-gray-500/15 text-gray-300 ring-gray-500/30 hover:bg-gray-500/25'}" title="Also passes Winners fundamentals gate (tier ${signal.winnerTier}) — click to open Winners filtered to ${signal.asset}">W·${signal.winnerTier} ↗</button>` : ''}
                                ${this.crossRefPills(signal.asset, 'dashboard', 'winners')}
                                <button onclick="dashboard.removeAsset('${assetEscaped}', event);" class="delete-btn text-xs text-gray-500 hover:text-red-400 px-1.5 py-0.5 rounded hover:bg-red-900/40 ml-auto transition" title="Hide">
                                  ✕
                                </button>
                              </div>
                            </td>
                            <td data-label="Confidence" class="px-3 py-2.5 whitespace-nowrap">
                              <div class="flex flex-col gap-0.5 w-[70px]">
                                <div class="flex items-baseline gap-1">
                                  <span class="text-lg font-bold ${confTextColor} tabular-nums leading-none">${signal.confidence}</span>
                                  <span class="text-[10px] text-gray-500 font-medium">%</span>
                                </div>
                                <div class="conf-bar ${confTextColor}" style="--pct: ${signal.confidence}%;"></div>
                              </div>
                            </td>
                            <td data-label="RS" class="px-3 py-2.5 whitespace-nowrap">${signal.rsRating != null ? `<span class="text-sm font-mono font-semibold tabular-nums ${signal.rsRating >= 80 ? 'text-green-400' : signal.rsRating >= 50 ? 'text-gray-300' : 'text-red-400'}" data-tip="Relative strength: outperforming ${signal.rsRating}% of scanned stocks (trailing returns percentile, per market)">${signal.rsRating}</span>` : '<span class="text-gray-600">—</span>'}</td>
                            <td data-label="Trend" class="px-3 py-2.5 whitespace-nowrap">${this.renderSparkline(signal.asset)}</td>
                            <td data-label="Earnings" class="px-3 py-2.5 text-xs whitespace-nowrap">${earnings}</td>
                            <td data-label="Sector" class="px-3 py-2.5 text-xs text-gray-400 whitespace-nowrap">${signal.sector || '<span class="text-gray-600">—</span>'}</td>
                            <td data-label="Signal" class="px-3 py-2.5 whitespace-nowrap">${signalLabel}${signal.signalType === 'breakout' && signal.isBlueSky ? ' <span class="badge bg-sky-500/15 text-sky-300 ring-1 ring-sky-500/30" data-tip="Base sits at the 52-week high — no trapped sellers overhead"><span class="badge-dot"></span>Blue Sky</span>' : ''}</td>
                            <td data-label="Price" class="px-3 py-2.5 text-sm font-mono text-white whitespace-nowrap tabular-nums">${price}</td>
                            <td data-label="Levels" class="px-3 py-2.5 text-xs font-mono whitespace-nowrap tabular-nums">${levels}</td>
                            <td data-label="Detail" class="px-3 py-2.5 text-xs whitespace-nowrap tabular-nums">${detail}</td>
                            <td data-label="Updated" class="px-3 py-2.5 text-[11px] text-gray-500 font-mono whitespace-nowrap">${this.formatRelative(signal.createdAt)}</td>
                          </tr>
                        `;
      }

      renderMainDashboard() {
        const filtered = this.getFilteredSignals();
        const validSignals = this.signals.filter(s => s.confidence >= this.minConfidence);
        const greenCount = validSignals.filter(s => s.pineScriptGreen || s.confidence === 99).length;
        const brightCount = validSignals.filter(s => !s.pineScriptGreen && s.confidence >= 95 && s.confidence < 99).length;
        const orangeCount = validSignals.filter(s => s.confidence >= 85 && s.confidence < 95).length;
        const yellowCount = validSignals.filter(s => s.confidence >= 75 && s.confidence < 85).length;
        const extensionCount = validSignals.filter(s => s.signalType === 'extension').length;

        document.getElementById('app').innerHTML = `
          <div class="flex-1 overflow-auto p-8 bg-gray-900" data-keep-scroll="main-y">
            <div class="max-w-7xl mx-auto">
              <!-- Header -->
              <div class="mb-6 flex items-end justify-between flex-wrap gap-3">
                <div>
                  <div class="flex items-center gap-3 flex-wrap">
                    <h1 class="text-2xl font-bold tracking-tight">Signals</h1>
                    ${this.marketHealthPill()}
                    ${this.fmpTogglePill()}
                    ${this.rulebookPill()}
                  </div>
                  <p class="text-gray-500 text-sm">${filtered.length} of ${validSignals.length} after filters</p>
                </div>
                <div class="flex items-center gap-3">
                  <button onclick="dashboard.setView('backtest')"
                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold bg-purple-500/15 hover:bg-purple-500/25 text-purple-300 ring-1 ring-purple-500/30 transition"
                    title="View backtest / historical accuracy">
                    <span>⌘</span> Backtest
                  </button>
                  <div class="flex flex-col items-end gap-1 text-xs">
                    ${this.freshnessDot()}
                    ${this.renderMarketStatus()}
                  </div>
                </div>
              </div>

              <!-- Stats strip: clickable, doubles as quick filter -->
              ${(() => {
                const breakoutCount = validSignals.filter(s => s.signalType === 'breakout').length;
                const setupCount = validSignals.filter(s => s.signalType === 'setup').length;
                const extCount = validSignals.filter(s => s.signalType === 'extension').length;
                const stoppedCount = this.signals.filter(s => s.stoppedOut).length; // all stopped, ignore conf slider
                const stats = [
                  { key: 'breakout',  label: 'Actionable', count: breakoutCount, accent: 'border-green-500',  glow: 'shadow-green-500/10',  text: 'text-green-400' },
                  { key: 'setup',     label: 'Handles',    count: setupCount,    accent: 'border-blue-500',   glow: 'shadow-blue-500/10',   text: 'text-blue-400' },
                  { key: 'extension', label: 'Extension',  count: extCount,      accent: 'border-yellow-500', glow: 'shadow-yellow-500/10', text: 'text-yellow-400' },
                  { key: 'stopped',   label: 'Stopped',    count: stoppedCount,  accent: 'border-red-500',    glow: 'shadow-red-500/10',    text: 'text-red-400' },
                ];
                return `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                  ${stats.map(s => {
                    const isActive = this.signalTypeFilter === s.key;
                    const isEmpty = s.count === 0;
                    return `
                    <button onclick="dashboard.setFilter('signalTypeFilter', '${s.key}');"
                      class="group relative bg-gray-800 hover:bg-gray-750 px-4 py-3 rounded-lg border-l-4 text-left transition-all
                        ${isActive ? s.accent + ' ring-1 ring-gray-600 ' + s.glow + ' shadow-lg' : 'border-gray-700 hover:' + s.accent}
                        ${isEmpty ? 'opacity-60' : ''}">
                      <div class="flex items-baseline justify-between gap-2">
                        <p class="text-[11px] uppercase tracking-wider text-gray-400 font-medium">${s.label}</p>
                        ${isActive ? `<span class="text-[9px] uppercase tracking-wider ${s.text} font-bold">Active</span>` : ''}
                      </div>
                      <p class="text-2xl font-bold ${isEmpty ? 'text-gray-500' : 'text-white'} tabular-nums leading-tight mt-0.5">${s.count.toLocaleString()}</p>
                    </button>
                  `; }).join('')}
                  <button onclick="dashboard.setView('shortlist')"
                    class="bg-gray-800 hover:bg-gray-700 px-4 py-3 rounded-lg border-l-4 border-yellow-500 text-left transition-all ${this.shortlist.length === 0 ? 'opacity-60' : ''}">
                    <p class="text-[11px] uppercase tracking-wider text-yellow-400/80 font-medium">★ Shortlist</p>
                    <p class="text-2xl font-bold ${this.shortlist.length > 0 ? 'text-yellow-400' : 'text-gray-500'} tabular-nums leading-tight mt-0.5">${this.shortlist.length}</p>
                  </button>
                </div>
                `;
              })()}

              <!-- Market breadth: aggregate count of loose setup-base candidates
                   from the most recent scan. Not tradable per-stock but a
                   useful accumulation/distribution gauge across the universe. -->
              ${(() => {
                const b = this.breadth || {};
                if (!b.stocks && !b.etfs) return '';
                const fmt = (row, label) => {
                  if (!row) return '';
                  const pct = row.totalScanned > 0
                    ? Math.round((row.baseCount / row.totalScanned) * 100)
                    : 0;
                  return `<span class="mr-4"><span class="text-gray-400">${label}:</span> <span class="text-gray-200 tabular-nums">${row.baseCount.toLocaleString()}</span> <span class="text-gray-500">(${pct}% of ${row.totalScanned.toLocaleString()})</span></span>`;
                };
                return `
                <div class="mb-5 -mt-2 px-1 text-[11px] uppercase tracking-wider">
                  <span class="text-gray-500 font-medium mr-2">Market breadth (bases)</span>
                  ${fmt(b.stocks, 'Stocks')}
                  ${fmt(b.etfs, 'ETFs')}
                </div>
                `;
              })()}

              <!-- Sticky toolbar: search · asset type · signal type · sector · min conf · scan -->
              <div class="sticky top-0 z-30 -mx-8 px-8 py-3 mb-4 bg-gray-900/95 backdrop-blur border-b border-gray-700">
                <div class="flex items-center gap-2 flex-wrap">
                  <input
                    type="text"
                    id="search-input"
                    placeholder="Search assets…  ( / )"
                    value="${(this.filtering || '').replace(/"/g, '&quot;')}"
                    onkeyup="dashboard.updateSearch(this.value);"
                    class="flex-1 min-w-[180px] px-3 py-1.5 bg-gray-800 border border-gray-700 rounded text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 text-sm"
                  />

                  <!-- Asset Type pills -->
                  <div class="flex gap-0.5 bg-gray-800 p-0.5 rounded">
                    ${[
                      { key: 'all', label: 'All' },
                      { key: 'stock', label: '📈' },
                      { key: 'etf', label: '📊' },
                    ].map(tab => `<button onclick="dashboard.setFilter('assetTypeFilter', '${tab.key}');"
                      title="${tab.key === 'stock' ? 'Stocks only' : tab.key === 'etf' ? 'ETFs only' : 'All assets'}"
                      class="px-2.5 py-1 rounded text-xs font-medium transition ${this.assetTypeFilter === tab.key ? 'bg-purple-600 text-white' : 'text-gray-400 hover:text-white'}">
                      ${tab.label}
                    </button>`).join('')}
                  </div>

                  <!-- Signal Type pills -->
                  <div class="flex gap-0.5 bg-gray-800 p-0.5 rounded">
                    ${[
                      { key: 'breakout',  label: 'Breakout',  color: 'bg-green-600',  shortcut: '1' },
                      { key: 'setup',     label: 'Setup',     color: 'bg-blue-600',   shortcut: '2' },
                      { key: 'extension', label: 'Extension', color: 'bg-yellow-600', shortcut: '3' },
                      { key: 'stopped',   label: 'Stopped',   color: 'bg-red-600',    shortcut: '4' },
                    ].map(tab => `<button onclick="dashboard.setFilter('signalTypeFilter', '${tab.key}');"
                      title="Press ${tab.shortcut} to toggle"
                      class="px-2.5 py-1 rounded text-xs font-medium transition ${this.signalTypeFilter === tab.key ? tab.color + ' text-white' : 'text-gray-400 hover:text-white'}">
                      ${tab.label}
                    </button>`).join('')}
                  </div>

                  <!-- Sector dropdown (was 15+ tabs) -->
                  <select
                    onchange="dashboard.setFilter('sectorFilter', this.value);"
                    class="px-2.5 py-1 bg-gray-800 border border-gray-700 rounded text-xs text-white focus:outline-none focus:border-blue-500 max-w-[160px]">
                    <option value="all" ${this.sectorFilter === 'all' ? 'selected' : ''}>All sectors</option>
                    ${this.getSectors().map(sec => `<option value="${sec}" ${this.sectorFilter === sec ? 'selected' : ''}>${sec}</option>`).join('')}
                  </select>

                  <!-- Min confidence inline slider -->
                  <label class="flex items-center gap-2 text-xs text-gray-400 whitespace-nowrap">
                    Min
                    <input
                      type="range"
                      id="confidence-slider"
                      min="0"
                      max="100"
                      value="${this.minConfidence}"
                      oninput="document.getElementById('confidence-label').textContent = this.value + '%';"
                      onchange="dashboard.setFilter('minConfidence', parseInt(this.value));"
                      class="w-24 accent-blue-500"
                    />
                    <span id="confidence-label" class="w-10 text-right font-mono text-gray-300">${this.minConfidence}%</span>
                  </label>

                  <!-- Lookback window slider — surfaces older breakout alerts -->
                  ${this.signalTypeFilter === 'breakout' ? `
                  <label class="flex items-center gap-2 text-xs text-gray-400 whitespace-nowrap" title="How far back to pull breakout alerts (default 3 days)">
                    Lookback
                    <input
                      type="range"
                      id="lookback-slider"
                      min="1"
                      max="30"
                      value="${this.lookbackDays}"
                      oninput="document.getElementById('lookback-label').textContent = this.value + 'd';"
                      onchange="dashboard.setLookback(this.value);"
                      class="w-24 accent-green-500"
                    />
                    <span id="lookback-label" class="w-8 text-right font-mono text-gray-300">${this.lookbackDays}d</span>
                  </label>
                  ` : ''}

                  <!-- Quality filters: each active chip is a hard requirement -->
                  <div class="flex items-center gap-1.5">
                    <button onclick="dashboard.toggleQualityFilter('vcp')" data-tip="Only VCP breakouts: tight base, volatility contracting into the pivot, breakout bar expanding upward — Minervini's volatility contraction pattern."
                      class="px-2.5 py-1 rounded text-xs font-semibold transition ring-1 ${this.qualityFilters?.vcp ? 'bg-purple-500/20 text-purple-300 ring-purple-500/40' : 'text-gray-400 hover:text-white bg-gray-800 ring-gray-700/60'}">VCP</button>
                    <button onclick="dashboard.toggleQualityFilter('blueSky')" data-tip="Only blue-sky bases: the pivot sits at the 52-week high, so a breakout clears every holder from the past year — no trapped sellers overhead."
                      class="px-2.5 py-1 rounded text-xs font-semibold transition ring-1 ${this.qualityFilters?.blueSky ? 'bg-sky-500/20 text-sky-300 ring-sky-500/40' : 'text-gray-400 hover:text-white bg-gray-800 ring-gray-700/60'}">Blue Sky</button>
                    <button onclick="dashboard.toggleQualityFilter('leaders')" data-tip="Only leaders: relative strength 70+, i.e. outperforming at least 70% of the scanned market — O'Neil and Minervini's minimum bar. Hides signals whose RS isn't computed yet."
                      class="px-2.5 py-1 rounded text-xs font-semibold transition ring-1 ${this.qualityFilters?.leaders ? 'bg-green-500/20 text-green-300 ring-green-500/40' : 'text-gray-400 hover:text-white bg-gray-800 ring-gray-700/60'}">RS ≥ 70</button>
                  </div>

                </div>
                <div class="text-[10px] text-gray-500 mt-1.5 font-mono">
                  shortcuts: <kbd class="px-1 bg-gray-800 rounded">/</kbd> search · <kbd class="px-1 bg-gray-800 rounded">1</kbd>/<kbd class="px-1 bg-gray-800 rounded">2</kbd>/<kbd class="px-1 bg-gray-800 rounded">3</kbd> breakout/setup/ext · <kbd class="px-1 bg-gray-800 rounded">←</kbd>/<kbd class="px-1 bg-gray-800 rounded">→</kbd> nav · <kbd class="px-1 bg-gray-800 rounded">space</kbd> next · <kbd class="px-1 bg-gray-800 rounded">esc</kbd> close
                </div>
              </div>

              <!-- Active filter chips -->
              ${(() => {
                const chips = [];
                if (this.filtering) chips.push({ label: `Search: "${this.filtering}"`, clear: `dashboard.filtering=''; dashboard.render();` });
                if (this.assetTypeFilter !== 'all') chips.push({ label: `Type: ${this.assetTypeFilter === 'stock' ? 'Stocks' : 'ETFs'}`, clear: `dashboard.setFilter('assetTypeFilter', 'all')` });
                if (this.sectorFilter !== 'all') chips.push({ label: `Sector: ${this.sectorFilter}`, clear: `dashboard.setFilter('sectorFilter', 'all')` });
                if (this.minConfidence !== 85) chips.push({ label: `Min: ${this.minConfidence}%`, clear: `dashboard.setFilter('minConfidence', 85)` });
                if (this.signalTypeFilter === 'breakout' && this.lookbackDays !== 3) chips.push({ label: `Lookback: ${this.lookbackDays}d`, clear: `dashboard.setLookback(3)` });
                if (this.qualityFilters?.vcp) chips.push({ label: 'VCP only', clear: `dashboard.toggleQualityFilter('vcp')` });
                if (this.qualityFilters?.blueSky) chips.push({ label: 'Blue Sky only', clear: `dashboard.toggleQualityFilter('blueSky')` });
                if (this.qualityFilters?.leaders) chips.push({ label: 'RS ≥ 70', clear: `dashboard.toggleQualityFilter('leaders')` });
                if (chips.length === 0) return '';
                return `
                <div class="flex flex-wrap items-center gap-1.5 mb-3 -mt-1">
                  <span class="text-[10px] uppercase tracking-wider text-gray-500 font-medium mr-1">Filters:</span>
                  ${chips.map(c => `
                    <button onclick="${c.clear}" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] bg-blue-500/10 text-blue-300 ring-1 ring-blue-500/30 hover:bg-blue-500/20 transition">
                      ${c.label} <span class="text-blue-400 font-bold">×</span>
                    </button>
                  `).join('')}
                  <button onclick="dashboard.resetFilters()" class="text-[10px] uppercase tracking-wider text-gray-500 hover:text-gray-300 font-medium ml-1">
                    Reset all
                  </button>
                </div>`;
              })()}

              <!-- Table -->
              ${this.loading ? `
                <div class="bg-gray-800 rounded-lg overflow-hidden ring-1 ring-gray-700/60">
                  <div class="border-b border-gray-600 px-3 py-2.5 flex gap-4">
                    ${['80px','100px','40px','60px','100px','80px','90px','60px','120px','120px','60px'].map(w => `<div class="skeleton" style="width:${w};height:12px;"></div>`).join('')}
                  </div>
                  ${Array.from({ length: 8 }).map((_, i) => `
                    <div class="border-b border-gray-700/50 px-3 py-3 flex gap-4 items-center ${i % 2 === 0 ? 'bg-gray-800/60' : 'bg-gray-800/30'}">
                      <div class="skeleton" style="width:80px;height:14px;"></div>
                      <div class="skeleton" style="width:60px;height:18px;"></div>
                      <div class="skeleton" style="width:56px;height:18px;"></div>
                      <div class="skeleton" style="width:90px;height:14px;"></div>
                      <div class="skeleton" style="width:80px;height:14px;"></div>
                      <div class="skeleton" style="width:80px;height:18px;border-radius:999px;"></div>
                      <div class="skeleton" style="width:60px;height:14px;"></div>
                      <div class="skeleton" style="width:120px;height:14px;"></div>
                      <div class="skeleton" style="width:120px;height:14px;"></div>
                      <div class="skeleton" style="width:50px;height:12px;margin-left:auto;"></div>
                    </div>
                  `).join('')}
                </div>
              ` : filtered.length === 0 ? `
                <div class="bg-gray-800/60 ring-1 ring-gray-700/60 rounded-lg text-center py-16 px-6">
                  <div class="text-4xl mb-3 opacity-40">◎</div>
                  <h3 class="text-lg font-semibold text-gray-200 mb-1">No signals match your filters</h3>
                  <p class="text-sm text-gray-500 mb-5">
                    ${validSignals.length > 0
                      ? `${validSignals.length} signals were fetched but none pass the current filter set.`
                      : 'Nothing in the last 72 hours. Waiting for the next scan.'}
                  </p>
                  <button onclick="dashboard.resetFilters()" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-md bg-blue-500/20 hover:bg-blue-500/30 text-blue-300 ring-1 ring-blue-500/40 text-sm font-medium transition">
                    Reset filters
                  </button>
                </div>
              ` : `
                <div class="bg-gray-800 rounded-lg overflow-x-auto ring-1 ring-gray-700/60" data-keep-scroll="signals-x">
                  <table class="w-full signals-responsive" style="min-width:1140px;">
                    <thead class="sticky-head">
                      <tr class="border-b border-gray-600">
                        <th style="min-width:180px;" title="Click to sort · shift-click to add a secondary sort" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300 cursor-pointer hover:text-white transition select-none" onclick="dashboard.toggleSort('asset', event.shiftKey);">
                          Asset ${this.sortIndicator('asset')}
                        </th>
                        <th style="min-width:110px;" title="Click to sort · shift-click to add a secondary sort" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300 cursor-pointer hover:text-white transition select-none" onclick="dashboard.toggleSort('confidence', event.shiftKey);">
                          <span data-tip="Model confidence in the setup (0-99%). Combines technical structure, volume, and earnings-call tone.">Confidence</span> ${this.sortIndicator('confidence')}
                        </th>
                        <th style="min-width:60px;" title="Click to sort · shift-click to add a secondary sort" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300 cursor-pointer hover:text-white transition select-none" onclick="dashboard.toggleSort('rs', event.shiftKey);">
                          <span data-tip="Relative strength 1-99: percentile rank of trailing returns vs the scanned universe (per market). 80+ = leader, below 50 = laggard.">RS</span> ${this.sortIndicator('rs')}
                        </th>
                        <th style="min-width:80px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">
                          <span data-tip="Last 30 daily closes. Green = closed higher over the window, red = closed lower.">Trend</span>
                        </th>
                        <th style="min-width:160px;" title="Click to sort · shift-click to add a secondary sort" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300 cursor-pointer hover:text-white transition select-none" onclick="dashboard.toggleSort('earnings', event.shiftKey);">
                          <span data-tip="Last earnings-call tone score and guidance direction. Boosts confidence on bullish + raised.">Earnings</span> ${this.sortIndicator('earnings')}
                        </th>
                        <th style="min-width:140px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Sector</th>
                        <th style="min-width:120px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">
                          <span data-tip="Actionable = fresh breakout from a clean base. Setup = pre-breakout consolidation. Extension = continuation of a recent breakout.">Signal</span>
                        </th>
                        <th style="min-width:90px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Price</th>
                        <th style="min-width:150px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">
                          <span data-tip="R = Resistance (breakout level). S = Support (recent low). Entry = original breakout resistance for extensions.">Levels</span>
                        </th>
                        <th style="min-width:170px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">
                          <span data-tip="Handle = tight late-stage consolidation before breakout. Base = broader flat consolidation zone. 'from MA20' = % distance from 20-day moving average.">Detail</span>
                        </th>
                        <th style="min-width:80px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Updated</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${filtered.map((signal, idx) => this.renderSignalRow(signal, idx, 'dashboard.getFilteredSignals()')).join('')}
                    </tbody>
                  </table>
                </div>
              `}

              ${(() => {
                // Tracking: stale extensions the server moved out of the
                // confidence buckets. Null-safe — old cached API responses
                // without the field just render nothing.
                const tr = this.trackingSignals || [];
                if (!tr.length) return '';
                return `
                <div class="mt-6">
                  <button onclick="dashboard._showTracking = !dashboard._showTracking; dashboard.render();" class="w-full flex items-center justify-between bg-gray-800/60 hover:bg-gray-800 ring-1 ring-gray-700/60 rounded-lg px-4 py-3 transition text-left">
                    <span class="text-sm font-semibold text-gray-300">Tracking · ${tr.length} post-breakout extension${tr.length === 1 ? '' : 's'} past the entry window</span>
                    <svg class="text-gray-500 transition-transform ${this._showTracking ? 'rotate-180' : ''}" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>
                  </button>
                  ${this._showTracking ? `
                    <p class="mt-2 mb-3 text-xs text-gray-500">More than 5 days past their breakout — monitoring for holders, not entry candidates. This is where most stopped-out signals come from.</p>
                    <div class="bg-gray-800 rounded-lg overflow-x-auto ring-1 ring-gray-700/60" data-keep-scroll="tracking-x">
                      <table class="w-full signals-responsive" style="min-width:1140px;">
                        <thead class="sticky-head">
                          <tr class="border-b border-gray-600">
                            <th style="min-width:180px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Asset</th>
                            <th style="min-width:110px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Confidence</th>
                            <th style="min-width:60px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">RS</th>
                            <th style="min-width:80px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Trend</th>
                            <th style="min-width:160px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Earnings</th>
                            <th style="min-width:140px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Sector</th>
                            <th style="min-width:120px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Signal</th>
                            <th style="min-width:90px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Price</th>
                            <th style="min-width:150px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Levels</th>
                            <th style="min-width:170px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Detail</th>
                            <th style="min-width:80px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Updated</th>
                          </tr>
                        </thead>
                        <tbody>
                          ${tr.map((signal, idx) => this.renderSignalRow(signal, idx, 'dashboard.trackingSignals')).join('')}
                        </tbody>
                      </table>
                    </div>
                  ` : ''}
                </div>`;
              })()}

              <!-- Footer removed — status now lives in the header -->

            </div>
          </div>
        `;
      }
    }

    const dashboard = new Dashboard();
  </script>
</body>
</html>
