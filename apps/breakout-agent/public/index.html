<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Forge - Breakout Signals Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body.resizing {
      user-select: none;
      cursor: col-resize !important;
    }
    #app.drawer-open .max-w-7xl {
      max-width: 100% !important;
    }
    #app.drawer-open .p-8 {
      padding-right: 2rem !important;
    }
    .signal-row {
      transition: all 0.2s ease;
      position: relative;
    }
    .signal-row:hover {
      background-color: rgba(239, 68, 68, 0.1) !important;
    }
    .signal-row.removing {
      opacity: 0.5;
      animation: slideOut 0.3s ease forwards;
    }
    @keyframes slideOut {
      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }
    .delete-btn {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .signal-row:hover .delete-btn {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-gray-900 text-white m-0 p-0">
  <div id="container" class="flex h-screen w-screen bg-gray-900">
    <div id="app" class="flex-1 overflow-auto"></div>
    <div id="drawer" class="relative bg-gray-800 border-l border-gray-700 shadow-lg" style="width: 0px; overflow: hidden; transition: width 0.2s ease;"></div>
  </div>

  <script>
    class Dashboard {
      constructor() {
        this.signals = [];
        this.shortlist = [];
        this.loading = true;
        this.scanning = false;
        this.filtering = '';
        this.minConfidence = 85; // Only show high-confidence signals by default
        this.sortBy = 'confidence';
        this.sortDirection = 'desc';
        this.selectedAsset = null;
        this.currentAssetIndex = 0;
        this._chartToken = 0;
        this.drawerWidth = localStorage.getItem('drawerWidth') ? parseInt(localStorage.getItem('drawerWidth')) : 384;
        this._isResizing = false;
        this.signalTypeFilter = 'all';
        this.sectorFilter = 'all';
        this.assetTypeFilter = 'all'; // stocks, etfs, or all
        this._searchDebounceTimer = null;
        this.showShortlist = false;
        this.init();
      }

      async init() {
        this.fetchSignals();
        this.fetchShortlist();
        setInterval(() => this.fetchSignals(), 5000);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
          const filtered = this.getFilteredSignals();
          if (!filtered.length) return;

          if (e.code === 'Space') {
            e.preventDefault();
            this.currentAssetIndex = (this.currentAssetIndex + 1) % filtered.length;
            this.openDrawer(filtered[this.currentAssetIndex]);
          } else if (e.code === 'ArrowLeft') {
            this.currentAssetIndex = (this.currentAssetIndex - 1 + filtered.length) % filtered.length;
            this.openDrawer(filtered[this.currentAssetIndex]);
          } else if (e.code === 'ArrowRight') {
            this.currentAssetIndex = (this.currentAssetIndex + 1) % filtered.length;
            this.openDrawer(filtered[this.currentAssetIndex]);
          } else if (e.code === 'Escape') {
            this.closeDrawer();
          }
        });

        // Drawer resize handling
        document.addEventListener('mousedown', (e) => {
          if (e.target.id === 'drawer-resize-handle') {
            this._isResizing = true;
            document.body.classList.add('resizing');
            e.preventDefault();
          }
        });

        document.addEventListener('mousemove', (e) => {
          if (!this._isResizing) return;
          const newWidth = Math.max(300, Math.min(900, window.innerWidth - e.clientX));
          this.drawerWidth = newWidth;
          localStorage.setItem('drawerWidth', newWidth);
          const drawer = document.getElementById('drawer');
          if (drawer) drawer.style.width = newWidth + 'px';
        });

        document.addEventListener('mouseup', () => {
          if (this._isResizing) {
            this._isResizing = false;
            document.body.classList.remove('resizing');
          }
        });

        this.render();
      }

      async fetchSignals() {
        try {
          const url = `/api/signals?type=${this.assetTypeFilter}`;
          const res = await fetch(url);
          const data = await res.json();

          if (data.highConfidence && data.mediumConfidence) {
            this.signals = [...data.highConfidence, ...data.mediumConfidence];
          } else {
            this.signals = Array.isArray(data) ? data : [];
          }

          this.loading = false;
          this.render();
        } catch (error) {
          console.error('Failed to fetch signals:', error);
        }
      }

      async fetchShortlist() {
        try {
          const res = await fetch('/api/shortlist');
          this.shortlist = await res.json();
          this.render();
        } catch (error) {
          console.error('Failed to fetch shortlist:', error);
        }
      }

      async toggleShortlist(asset, e) {
        e.stopPropagation();
        const isInList = this.shortlist.some(item => item.asset === asset);
        try {
          if (isInList) {
            await fetch(`/api/shortlist/${encodeURIComponent(asset)}`, { method: 'DELETE' });
          } else {
            await fetch('/api/shortlist', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ asset }),
            });
          }
          await this.fetchShortlist();
        } catch (error) {
          console.error('Failed to update shortlist:', error);
        }
      }

      async removeAsset(asset, e) {
        if (e) e.stopPropagation();
        const row = e?.target?.closest('tr');
        try {
          if (row) row.classList.add('removing');
          await fetch('/api/removed-assets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ asset }),
          });
          await new Promise(resolve => setTimeout(resolve, 300)); // Wait for animation
          this.closeDrawer();
          await this.fetchSignals();
        } catch (error) {
          console.error('Failed to remove asset:', error);
          if (row) row.classList.remove('removing');
        }
      }

      openDrawer(signal) {
        this.selectedAsset = signal;
        this.renderDrawer();
      }

      closeDrawer() {
        this.selectedAsset = null;
        this.renderDrawer();
      }

      renderDrawer() {
        const drawer = document.getElementById('drawer');
        const app = document.getElementById('app');
        if (!this.selectedAsset) {
          drawer.style.width = '0px';
          drawer.innerHTML = '';
          app.classList.remove('drawer-open');
          return;
        }
        drawer.style.width = this.drawerWidth + 'px';
        app.classList.add('drawer-open');

        const signal = this.selectedAsset;
        const inShortlist = this.shortlist.some(item => item.asset === signal.asset);

        const filtered = this.getFilteredSignals();
        const currentIndex = filtered.findIndex(s => s.asset === signal.asset);
        const assetPosition = currentIndex >= 0 ? `${currentIndex + 1}/${filtered.length}` : '';

        const assetEscaped = signal.asset.replace(/'/g, "\\'");
        drawer.innerHTML = `
          <div id="drawer-resize-handle" class="absolute left-0 top-0 bottom-0 w-1 bg-gray-600 hover:bg-blue-500 cursor-col-resize transition z-50"></div>
          <div class="h-screen overflow-y-auto pl-1">
            <div class="sticky top-0 bg-gray-800 p-6 border-b border-gray-700">
              <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-2">
                  <h2 class="text-2xl font-bold">${signal.asset}</h2>
                  <span class="text-sm font-semibold px-2 py-1 rounded ${signal.assetType === 'etf' ? 'bg-yellow-900 text-yellow-300' : 'bg-green-900 text-green-300'}">
                    ${signal.assetType === 'etf' ? '📊 ETF' : '📈 STOCK'}
                  </span>
                  <a href="${this.getTradingViewUrl(signal.asset)}" target="_blank" rel="noopener noreferrer" class="text-lg text-blue-400 hover:text-blue-300 transition" title="Open on TradingView (set to Daily timeframe)">📈</a>
                </div>
                <button onclick="dashboard.closeDrawer();" class="text-2xl hover:text-gray-400">✕</button>
              </div>
              <div class="text-xs text-gray-400 flex justify-between">
                <span>${assetPosition}</span>
                <span class="text-right">SPACE: next | ← →: nav | ESC: close</span>
              </div>
            </div>

            <div class="p-6 space-y-6">
              <!-- Chart -->
              <div>
                <div class="text-sm text-gray-400 mb-2 flex justify-between">
                  <span>📊 3-Month Daily Chart</span>
                  <span class="text-xs text-gray-500">Daily | ${signal.asset}</span>
                </div>
                <div id="chart-container" style="height:240px;" class="w-full rounded overflow-hidden bg-gray-900"></div>
              </div>

              <!-- Quick Stats -->
              <div class="space-y-3">
                <div class="flex justify-between items-center">
                  <span class="text-gray-400">Confidence</span>
                  <div class="bg-green-600 px-3 py-1 rounded font-bold">${signal.confidence}%</div>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-gray-400">Signal Type</span>
                  <span class="text-lg">${signal.signalType === 'green' ? '🟢 Green' : signal.signalType === 'orange' ? '🟠 Orange' : '🟡 Yellow'}</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-gray-400">Alert Status</span>
                  <span>${signal.shouldAlert ? '⚠️ Active' : '✓ Tracked'}</span>
                </div>
              </div>

              <!-- ETF Info (if applicable) -->
              ${signal.assetType === 'etf' ? `
              <div class="border-t border-gray-700 pt-4 mt-4">
                <h3 class="font-semibold text-gray-300 mb-3">📊 ETF Details</h3>
                <div class="space-y-2">
                  ${signal.expenseRatio ? `
                    <div class="bg-gray-700 p-2 rounded flex justify-between">
                      <span class="text-gray-400">Expense Ratio</span>
                      <span class="text-yellow-400 font-mono">${signal.expenseRatio}%</span>
                    </div>
                  ` : ''}
                  ${signal.etfCategory ? `
                    <div class="bg-gray-700 p-2 rounded flex justify-between">
                      <span class="text-gray-400">Category</span>
                      <span class="text-blue-400">${signal.etfCategory}</span>
                    </div>
                  ` : ''}
                </div>
              </div>
              ` : ''}

              <!-- Price & MA Levels -->
              <div class="border-t border-gray-700 pt-4 space-y-3">
                <h3 class="font-semibold text-gray-300">📈 ${signal.signalType === 'breakout' ? 'Price Levels' : signal.signalType === 'extension' ? 'Extension Levels' : 'Setup Levels'}</h3>
                <div class="space-y-2">
                  <div class="flex justify-between items-center">
                    <span class="text-gray-400">Current Price</span>
                    <span class="font-mono text-lg font-bold">$${signal.currentPrice.toFixed(2)}</span>
                  </div>
                  ${signal.signalType === 'breakout' ? `
                    <div class="flex justify-between items-center">
                      <span class="text-gray-400">Resistance (R)</span>
                      <span class="font-mono text-red-400 text-lg">$${signal.resistance.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between items-center">
                      <span class="text-gray-400">Support (S)</span>
                      <span class="font-mono text-green-400 text-lg">$${signal.support.toFixed(2)}</span>
                    </div>
                    <div class="bg-gray-700 p-2 rounded text-sm mt-2">
                      <div class="flex justify-between text-gray-300 mb-1">
                        <span>Distance to Resistance</span>
                        <span>${((signal.resistance - signal.currentPrice) / signal.currentPrice * 100).toFixed(1)}%</span>
                      </div>
                      <div class="flex justify-between text-gray-300">
                        <span>Distance to Support</span>
                        <span>${((signal.currentPrice - signal.support) / signal.currentPrice * 100).toFixed(1)}%</span>
                      </div>
                    </div>
                  ` : signal.signalType === 'extension' ? `
                    <div class="flex justify-between items-center">
                      <span class="text-gray-400">Entry / Breakout Level</span>
                      <span class="font-mono text-yellow-400 text-lg">$${signal.entryResistance !== null ? signal.entryResistance.toFixed(2) : '—'}</span>
                    </div>
                    <div class="flex justify-between items-center">
                      <span class="text-gray-400">Current Resistance</span>
                      <span class="font-mono text-red-400 text-lg">$${signal.resistance.toFixed(2)}</span>
                    </div>
                  ` : `
                    <div class="flex justify-between items-center">
                      <span class="text-gray-400">20-Day MA</span>
                      <span class="font-mono text-blue-400 text-lg">$${signal.ma20.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between items-center">
                      <span class="text-gray-400">Distance from MA20</span>
                      <span class="font-mono text-green-400 text-lg">${signal.distanceFromMA20.toFixed(1)}%</span>
                    </div>
                    <div class="flex justify-between items-center">
                      <span class="text-gray-400">Setup Type</span>
                      <span class="font-mono text-yellow-400 text-lg uppercase">${signal.setupType}</span>
                    </div>
                    <div class="bg-gray-700 p-2 rounded text-sm mt-2">
                      <div class="flex justify-between text-gray-300 mb-1">
                        <span>Consolidation Range</span>
                        <span>${signal.consolidationRange?.toFixed(1) || 'N/A'}%</span>
                      </div>
                      <div class="flex justify-between text-gray-300">
                        <span>Volume Indecision</span>
                        <span>${signal.consolidationVolume?.toFixed(0) || 'N/A'}%</span>
                      </div>
                    </div>
                  `}
                </div>
              </div>

              <!-- Type 1: Breakout Metrics (ONLY show when Pine Script Green) -->
              ${signal.signalType === 'breakout' && signal.pineScriptGreen ? `
              <div class="border-t border-gray-700 pt-4">
                <h3 class="font-semibold text-gray-300 mb-3">🎯 📊 Pine Script Green Cone</h3>
                <div class="bg-green-900 p-3 rounded-lg border border-green-700 mb-3">
                  <p class="text-green-200 font-semibold">✓ All conditions met: 99% confidence</p>
                </div>
                <div class="space-y-2 text-sm">
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Signal Mode</span>
                    <span class="text-yellow-400">Early (On Touch)</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Structure Quality</span>
                    <span class="text-green-400">✓ Good</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Volume Confirmation</span>
                    <span class="text-green-400">✓ OK</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Consolidation Bars</span>
                    <span class="text-blue-400">${signal.barsInRange || '5+'}</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Bullish Candle</span>
                    <span class="text-green-400">✓ Close > Open</span>
                  </div>
                </div>
              </div>
              ` : ''}

              <!-- Type 3: Extension Metrics (ONLY show for extension signals) -->
              ${signal.signalType === 'extension' ? `
              <div class="border-t border-gray-700 pt-4">
                <h3 class="font-semibold text-gray-300 mb-3">🟡 Extension Phase</h3>
                <div class="bg-yellow-900 p-3 rounded-lg border border-yellow-700 mb-3">
                  <p class="text-yellow-200 font-semibold">
                    ✓ Holding above breakout — Day ${signal.daysSinceBreakout !== null ? Math.ceil(signal.daysSinceBreakout) : '?'} of extension
                  </p>
                </div>
                <div class="space-y-2 text-sm">
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Entry Price (orig. resistance)</span>
                    <span class="text-yellow-400 font-mono">\$${signal.entryResistance !== null ? signal.entryResistance.toFixed(2) : '—'}</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Current Price</span>
                    <span class="text-white font-mono font-bold">\$${signal.currentPrice.toFixed(2)}</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">% Gain from Entry</span>
                    <span class="${signal.pctGainFromEntry !== null && signal.pctGainFromEntry >= 0 ? 'text-green-400' : 'text-red-400'} font-mono font-bold">
                      ${signal.pctGainFromEntry !== null ? (signal.pctGainFromEntry >= 0 ? '+' : '') + signal.pctGainFromEntry.toFixed(2) + '%' : '—'}
                    </span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Days in Extension</span>
                    <span class="text-blue-400">${signal.daysSinceBreakout !== null ? signal.daysSinceBreakout.toFixed(1) + ' days' : '—'}</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">First Green Date</span>
                    <span class="text-gray-300">${signal.firstGreenAt ? new Date(signal.firstGreenAt).toLocaleDateString() + ' ' + new Date(signal.firstGreenAt).toLocaleTimeString() : '—'}</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Still Above Entry</span>
                    <span class="${signal.pctGainFromEntry !== null && signal.pctGainFromEntry >= -1 ? 'text-green-400' : 'text-red-400'}">
                      ${signal.pctGainFromEntry !== null ? (signal.pctGainFromEntry >= -1 ? '✓ Yes' : '✗ No — below entry') : '—'}
                    </span>
                  </div>
                </div>
              </div>
              ` : ''}

              <!-- Type 2: Setup Metrics (ONLY show for setup signals) -->
              ${signal.signalType === 'setup' ? `
              <div class="border-t border-gray-700 pt-4">
                <h3 class="font-semibold text-gray-300 mb-3">🔵 Pre-Breakout Setup</h3>
                <div class="bg-blue-900 p-3 rounded-lg border border-blue-700 mb-3">
                  <p class="text-blue-200 font-semibold">✓ ${(signal.setupType || 'base').toUpperCase()}: Ready to move</p>
                </div>
                <div class="space-y-2 text-sm">
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Setup Type</span>
                    <span class="text-blue-400 font-semibold">${(signal.setupType || 'base').toUpperCase()}</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Distance from MA20</span>
                    <span class="text-green-400">${signal.distanceFromMA20.toFixed(1)}%</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Consolidation Range</span>
                    <span class="text-yellow-400">${signal.consolidationRange?.toFixed(1) || 'N/A'}%</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">Volume Indecision</span>
                    <span class="text-yellow-400">${signal.consolidationVolume?.toFixed(0) || 'N/A'}% of avg</span>
                  </div>
                  <div class="bg-gray-700 p-2 rounded flex justify-between">
                    <span class="text-gray-400">MA Alignment</span>
                    <span class="text-green-400">✓ Bullish Turning</span>
                  </div>
                </div>
              </div>
              ` : ''}

              <!-- Agent Decision -->
              <div class="border-t border-gray-700 pt-4">
                <h3 class="font-semibold text-gray-300 mb-2">💡 Agent Analysis</h3>
                <div class="bg-gray-700 p-3 rounded text-sm text-gray-300 whitespace-pre-wrap break-words max-h-48 overflow-y-auto">
                  ${signal.agentDecision || 'No analysis available'}
                </div>
              </div>

              <!-- Earnings Transcript Analysis (loaded lazily) -->
              ${signal.assetType !== 'etf' ? `
              <div id="transcript-section" class="border-t border-gray-700 pt-4">
                <h3 class="font-semibold text-gray-300 mb-2">🎙️ Earnings Call Analysis</h3>
                <div id="transcript-content" class="bg-gray-700 p-3 rounded text-sm text-gray-300">
                  <span class="text-gray-500">Loading…</span>
                </div>
              </div>
              ` : ''}

              <!-- Shortlist & Remove -->
              <div class="border-t border-gray-700 pt-4 space-y-3">
                <button
                  onclick="dashboard.toggleShortlist('${assetEscaped}', event);"
                  class="w-full px-4 py-2 rounded-lg font-semibold transition ${
                    inShortlist
                      ? 'bg-yellow-600 hover:bg-yellow-700 text-white'
                      : 'bg-gray-700 hover:bg-gray-600 text-gray-200'
                  }"
                >
                  ${inShortlist ? '⭐ Remove from Shortlist' : '☆ Add to Shortlist'}
                </button>
                <button
                  onclick="dashboard.removeAsset('${assetEscaped}', event); event.preventDefault();"
                  class="w-full px-4 py-2 rounded-lg font-semibold transition bg-red-900 hover:bg-red-800 text-red-100 border border-red-700"
                >
                  Hide from Dashboard
                </button>
              </div>

              <!-- Timestamp -->
              <div class="border-t border-gray-700 pt-4 text-xs text-gray-500">
                <p>Updated: ${new Date(signal.createdAt).toLocaleString()}</p>
              </div>
            </div>
          </div>
        `;

        // Lazy load earnings transcript analysis for stocks
        if (signal.assetType !== 'etf') {
          fetch('/api/transcript/' + encodeURIComponent(signal.asset))
            .then(r => r.ok ? r.json() : null)
            .then(ta => {
              const el = document.getElementById('transcript-content');
              if (!el) return;
              if (!ta) {
                el.innerHTML = '<span class="text-gray-500">No earnings call analysis yet. Triggered automatically for signals at 90%+ confidence.</span>';
                return;
              }
              const toneColor = ta.tone === 'bullish' ? 'text-green-400' : ta.tone === 'bearish' ? 'text-red-400' : 'text-yellow-400';
              const guidanceColor = ta.guidanceDirection === 'raised' ? 'text-green-400' : ta.guidanceDirection === 'lowered' ? 'text-red-400' : 'text-gray-300';
              const risks = (ta.riskFlags || []).map(r => `<span class="inline-block px-2 py-0.5 rounded bg-red-900 text-red-200 text-xs mr-1 mb-1">⚠ ${r}</span>`).join('');
              const highlights = (ta.highlights || []).map(h => `<span class="inline-block px-2 py-0.5 rounded bg-green-900 text-green-200 text-xs mr-1 mb-1">+ ${h}</span>`).join('');
              el.innerHTML = `
                <div class="flex flex-wrap justify-between items-center mb-2 gap-2">
                  <div class="text-xs text-gray-400">Q${ta.quarter} ${ta.year}</div>
                  <div class="flex gap-3 text-xs">
                    <span>Tone: <span class="${toneColor} font-semibold">${ta.tone} (${ta.toneScore.toFixed(2)})</span></span>
                    <span>Guidance: <span class="${guidanceColor} font-semibold">${ta.guidanceDirection}</span></span>
                  </div>
                </div>
                <div class="mb-3 whitespace-pre-wrap break-words text-gray-200">${ta.summary}</div>
                ${highlights ? `<div class="mb-1">${highlights}</div>` : ''}
                ${risks ? `<div class="mb-1">${risks}</div>` : ''}
                <div class="text-xs text-gray-500 mt-2">Model: ${ta.modelUsed} · ${new Date(ta.createdAt).toLocaleDateString()}</div>
              `;
            })
            .catch(() => {
              const el = document.getElementById('transcript-content');
              if (el) el.innerHTML = '<span class="text-gray-500">Failed to load analysis.</span>';
            });
        }

        const chartToken = ++this._chartToken;
        fetch('/api/candles/' + encodeURIComponent(signal.asset))
          .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then(bars => {
            if (chartToken !== this._chartToken) return; // drawer navigated away
            if (!bars || !bars.length) {
              const el = document.getElementById('chart-container');
              if (el) el.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400">No price data available</div>';
              return;
            }
            const el = document.getElementById('chart-container');
            if (!el) return;
            el.innerHTML = ''; // Clear placeholder
            const chart = LightweightCharts.createChart(el, {
              autoSize: true,
              height: 240,
              layout: { background: { color: '#111827' }, textColor: '#9ca3af' },
              grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
              crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
              rightPriceScale: { borderColor: '#374151' },
              timeScale: { borderColor: '#374151', timeVisible: false },
            });
            const series = chart.addCandlestickSeries({
              upColor: '#10b981',
              downColor: '#ef4444',
              borderVisible: false,
              wickUpColor: '#10b981',
              wickDownColor: '#ef4444',
            });
            series.setData(bars);
            // Set chart to show ~3 months of daily data (60-65 trading days)
            if (bars.length > 0) {
              const barsToShow = Math.min(65, bars.length);
              const startIdx = Math.max(0, bars.length - barsToShow);
              const firstBar = bars[startIdx];
              const lastBar = bars[bars.length - 1];
              // Convert date string to Unix timestamp (in seconds)
              const fromTime = Math.floor(new Date(firstBar.time).getTime() / 1000);
              const toTime = Math.floor(new Date(lastBar.time).getTime() / 1000);
              chart.timeScale().setVisibleRange({ from: fromTime, to: toTime });
            } else {
              chart.timeScale().fitContent();
            }

            // Type 1: Show resistance/support
            if (signal.signalType === 'breakout') {
              if (signal.resistance) {
                series.createPriceLine({ price: signal.resistance, color: '#ef4444', lineWidth: 1, lineStyle: 2, title: 'R' });
              }
              if (signal.support) {
                series.createPriceLine({ price: signal.support, color: '#10b981', lineWidth: 1, lineStyle: 2, title: 'S' });
              }
            }
            // Type 3: Show entry resistance (yellow dashed) + current resistance (red dashed)
            else if (signal.signalType === 'extension' && signal.entryResistance) {
              series.createPriceLine({ price: signal.entryResistance, color: '#eab308', lineWidth: 2, lineStyle: 2, title: 'Entry' });
              if (signal.resistance && signal.resistance !== signal.entryResistance) {
                series.createPriceLine({ price: signal.resistance, color: '#ef4444', lineWidth: 1, lineStyle: 2, title: 'R' });
              }
            }
            // Type 2: Show MA20
            else if (signal.signalType === 'setup' && signal.ma20) {
              series.createPriceLine({ price: signal.ma20, color: '#3b82f6', lineWidth: 1, lineStyle: 2, title: 'MA20' });
            }
          })
          .catch(err => {
            const el = document.getElementById('chart-container');
            if (el) el.innerHTML = `<div class="flex items-center justify-center h-full text-gray-400 text-sm">Chart failed to load</div>`;
            console.error('Chart error:', err);
          });
      }

      isInShortlist(asset) {
        return this.shortlist.some(item => item.asset === asset);
      }

      async runScan() {
        this.scanning = true;
        this.render();
        try {
          const res = await fetch('/api/scan', { method: 'POST' });
          const data = await res.json();
          console.log('Scan started:', data);
          setTimeout(() => this.fetchSignals(), 2000);
        } catch (error) {
          console.error('Failed to start scan:', error);
        } finally {
          this.scanning = false;
          this.render();
        }
      }

      getSignalColor(signal) {
        // Type 1: Fresh breakout at 99% = Green with badge
        if (signal.signalType === 'breakout' && signal.pineScriptGreen && signal.confidence === 99) {
          return { emoji: '🟢', label: 'green-type1', bgClass: 'bg-green-700', badge: 'TYPE 1' };
        }
        // 99% Green Cone (Type 2/3)
        if (signal.confidence === 99) {
          return { emoji: '🟢', label: 'green', bgClass: 'bg-green-700' };
        }
        // 95-98%: High confidence, bright green
        if (signal.confidence >= 95) {
          return { emoji: '🟢', label: 'bright-green', bgClass: 'bg-green-600' };
        }
        // 90-94%: Green gradient down
        if (signal.confidence >= 90) {
          return { emoji: '🟢', label: 'green-fade', bgClass: 'bg-green-500' };
        }
        // 85-89%: Orange
        if (signal.confidence >= 85) {
          return { emoji: '🟠', label: 'orange', bgClass: 'bg-orange-600' };
        }
        // Type 3 Extensions below 85%
        if (signal.signalType === 'extension') {
          return { emoji: '🟡', label: 'extension', bgClass: 'bg-yellow-600' };
        }
        // Below 85% = filtered out
        return { emoji: '⚪', label: 'neutral', bgClass: 'bg-gray-600' };
      }

      getTradingViewUrl(asset) {
        return `https://www.tradingview.com/chart/?symbol=${encodeURIComponent(asset)}`;
      }

      updateSearch(value) {
        clearTimeout(this._searchDebounceTimer);
        this._searchDebounceTimer = setTimeout(() => {
          this.filtering = value;
          this.render();
        }, 500);
      }

      getFilteredSignals() {
        let filtered = this.signals.filter(s => s.confidence >= this.minConfidence);

        // Asset type filter (stocks, etfs, all)
        if (this.assetTypeFilter !== 'all') {
          filtered = filtered.filter(s => s.assetType === this.assetTypeFilter);
        }

        // Signal type filter
        if (this.signalTypeFilter !== 'all') {
          filtered = filtered.filter(s => s.signalType === this.signalTypeFilter);
        }

        // Sector filter
        if (this.sectorFilter !== 'all') {
          filtered = filtered.filter(s => s.sector === this.sectorFilter);
        }

        if (this.filtering) {
          filtered = filtered.filter(s => s.asset.toLowerCase().includes(this.filtering.toLowerCase()));
        }

        // Sort
        filtered.sort((a, b) => {
          let compareVal = 0;
          if (this.sortBy === 'confidence') {
            compareVal = b.confidence - a.confidence;
          } else if (this.sortBy === 'asset') {
            compareVal = a.asset.localeCompare(b.asset);
          }
          return this.sortDirection === 'asc' ? -compareVal : compareVal;
        });

        return filtered;
      }

      toggleSort(field) {
        if (this.sortBy === field) {
          this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          this.sortBy = field;
          this.sortDirection = 'desc';
        }
        this.render();
      }

      getSectors() {
        const sectors = new Set();
        this.signals.forEach(s => {
          if (s.sector && s.sector !== 'Unknown') {
            sectors.add(s.sector);
          }
        });
        return Array.from(sectors).sort();
      }

      renderShortlistPanel() {

            signal,

              ${items.length === 0 ? `

                </div>

                <div class="bg-gray-800 rounded-lg overflow-hidden">

                        <th class="px-6 py-3 text-left text-sm font-semibold">Action</th>
                      </tr>
                    </thead>

                      ${items.map((item, idx) => `
                        <tr class="${idx % 2 === 0 ? 'bg-gray-800' : 'bg-gray-750'} border-b border-gray-700 hover:bg-gray-700 transition">
                          <td class="px-6 py-4 font-bold text-lg">

                                : item.signal.signalType === 'extension'
                                ? '<span class="text-yellow-400">🟡 Extension</span>'
                                : '<span class="text-blue-400">🔵 Setup</span>'
                              : '<span class="text-gray-500">—</span>'
                            }
                          </td>
                          <td class="px-6 py-4 font-mono">
                            ${item.price ? '$' + item.price.toFixed(2) : '—'}
                          </td>
                          <td class="px-6 py-4">
                            ${item.confidence ? `<span class="bg-blue-700 px-2 py-1 rounded text-white text-sm">${item.confidence}%</span>` : '—'}
                          </td>
                          <td class="px-6 py-4">
                            <button onclick="dashboard.toggleShortlist('${item.asset.replace(/'/g, "\\'")}', event);" class="px-3 py-1 bg-red-900 hover:bg-red-800 text-red-100 rounded text-sm font-semibold transition">
                              Remove
                            </button>
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          </div>
        `;
      }

      render() {
        if (this.showShortlist) {
          this.renderShortlistPanel();
        } else {
          this.renderMainDashboard();
        }
      }

                            <td class="px-6 py-4 text-gray-400 whitespace-nowrap">
                              <div class="text-sm font-mono">${dateStr}</div>
                              <div class="text-xs text-gray-500 font-mono">${timeStr}</div>
                            </td>
                          </tr>
                        `;
                      }).join('')}
                    </tbody>
                  </table>
                </div>
              `}

              <!-- Footer -->
              <div class="mt-8 text-center text-gray-500 text-sm">
                <p>Auto-refreshes every 5 seconds • Last update: ${new Date().toLocaleTimeString()}</p>
              </div>
            </div>
          </div>
        `;
      }
    }

    const dashboard = new Dashboard();
  </script>
</body>
</html>
