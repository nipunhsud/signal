      // Admin: preview the composed earnings thread, confirm, then post to X.
      // Admin: tweet a breakout card for one ticker (preview → edit → publish).
      async tweetBreakout(asset, e) {
        e?.stopPropagation();
        try {
          const pv = await fetch('/api/admin/tweet-breakout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ asset }),
          });
          if (!pv.ok) throw new Error((await pv.json()).error || 'HTTP ' + pv.status);
          const { tweets } = await pv.json();
          this.openTweetEditor('/api/admin/tweet-breakout', asset, tweets, 'breakout');
        } catch (err) {
          this.toast('Tweet failed: ' + err.message, { kind: 'warn' });
        }
      }

      // Editable preview overlay for admin tweets: textareas with live char
      // counts, publish sends the edited text. DOM built with value assignment
      // (never innerHTML for tweet text) so $/quotes/emoji can't break markup.
      openTweetEditor(endpoint, asset, tweets, label) {
        document.getElementById('tweet-editor-overlay')?.remove();
        const ov = document.createElement('div');
        ov.id = 'tweet-editor-overlay';
        ov.className = 'fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4';
        ov.addEventListener('click', (ev) => { if (ev.target === ov) ov.remove(); });

        const card = document.createElement('div');
        card.className = 'bg-gray-800 ring-1 ring-gray-600/80 rounded-lg shadow-xl w-full max-w-xl p-5 max-h-[85vh] overflow-y-auto';
        card.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <div class="font-bold text-white">Tweet $${asset} ${label}</div>
            <button class="text-gray-500 hover:text-white transition" data-x="close">✕</button>
          </div>
          <div class="text-[12px] text-gray-500 mb-3">Edit before publishing. Links count as 23 chars on X regardless of length.</div>
          <div data-x="fields" class="space-y-3"></div>
          <div class="mt-4 flex justify-end gap-2 items-center">
            <span data-x="err" class="text-xs text-red-400 mr-auto"></span>
            <button data-x="cancel" class="px-3 py-1.5 rounded text-xs font-semibold bg-gray-700 hover:bg-gray-600 text-gray-300 transition">Cancel</button>
            <button data-x="post" class="px-3 py-1.5 rounded text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white transition">🐦 Publish to X</button>
          </div>`;
        ov.appendChild(card);

        const fields = card.querySelector('[data-x="fields"]');
        const areas = tweets.map((t, i) => {
          const wrap = document.createElement('div');
          const ta = document.createElement('textarea');
          ta.className = 'w-full bg-gray-900 text-gray-200 text-[13px] leading-relaxed rounded ring-1 ring-gray-700 focus:ring-sky-500 outline-none p-3 font-mono';
          ta.rows = Math.max(4, t.split('\n').length + 1);
          ta.value = t;
          const count = document.createElement('div');
          count.className = 'text-right text-[11px] mt-0.5';
          const upd = () => {
            const n = ta.value.length;
            count.textContent = `${n}/280`;
            count.className = 'text-right text-[11px] mt-0.5 ' + (n > 280 ? 'text-red-400 font-bold' : n > 260 ? 'text-amber-400' : 'text-gray-500');
          };
          ta.addEventListener('input', upd);
          upd();
          if (tweets.length > 1) {
            const lbl = document.createElement('div');
            lbl.className = 'text-[11px] text-gray-500 mb-1';
            lbl.textContent = `Tweet ${i + 1} of ${tweets.length}`;
            wrap.appendChild(lbl);
          }
          wrap.appendChild(ta);
          wrap.appendChild(count);
          fields.appendChild(wrap);
          return ta;
        });

        const close = () => ov.remove();
        card.querySelector('[data-x="close"]').addEventListener('click', close);
        card.querySelector('[data-x="cancel"]').addEventListener('click', close);
        card.querySelector('[data-x="post"]').addEventListener('click', async () => {
          const errEl = card.querySelector('[data-x="err"]');
          const edited = areas.map((a) => a.value.trim()).filter((t) => t.length);
          if (!edited.length) { errEl.textContent = 'Nothing to post.'; return; }
          const over = edited.findIndex((t) => t.length > 280);
          if (over >= 0) { errEl.textContent = `Tweet ${over + 1} is over 280 characters.`; return; }
          const btn = card.querySelector('[data-x="post"]');
          btn.disabled = true; btn.textContent = 'Posting…';
          try {
            const r = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ asset, confirm: true, tweets: edited }),
            });
            if (!r.ok) throw new Error((await r.json()).error || 'HTTP ' + r.status);
            close();
            this.toast(`Tweeted $${asset} ${label}`, { kind: 'success' });
          } catch (err) {
            btn.disabled = false; btn.textContent = '🐦 Publish to X';
            errEl.textContent = err.message;
          }
        });

        document.body.appendChild(ov);
        areas[0]?.focus();
      }

          }

      async analyzeTranscript(asset, e) {
        if (e) e.stopPropagation();
        const btn = document.getElementById('transcript-analyze-btn');
        const content = document.getElementById('transcript-content');
        if (btn) { btn.disabled = true; btn.textContent = 'Analyzing…'; btn.classList.add('opacity-60', 'cursor-not-allowed'); }
        if (content) content.innerHTML = '<span class="text-gray-500">Fetching transcript and running Claude analysis…</span>';
        try {
          const res = await fetch('/api/transcript/' + encodeURIComponent(asset) + '/analyze', { method: 'POST' });
          if (!res.ok) {
            const err = await res.json().catch(() => ({ error: 'Analysis failed' }));
            if (content) content.innerHTML = `<span class="text-red-400">${err.error || 'Analysis failed'}</span>`;
            return;
          }
          const ta = await res.json();
          this.renderTranscript(ta);
        } catch (err) {
          if (content) content.innerHTML = '<span class="text-red-400">Analysis failed. See console.</span>';
          console.error('analyzeTranscript failed', err);
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = 'Analyze'; btn.classList.remove('opacity-60', 'cursor-not-allowed'); }
        }
      }

          timestamp: new Date(b.time + 'T00:00:00Z').getTime(),
          open: b.open, high: b.high, low: b.low, close: b.close,
          volume: b.volume || 0,

      _ensureKlineOverlays() {

        klinecharts.registerOverlay({
          name: 'dqLevel',
          totalStep: 2,
          lock: true,
          createPointFigures: ({ coordinates, bounding, overlay }) => {
            if (!coordinates.length) return [];
            const y = coordinates[0].y;
            const d = overlay.extendData || {};
            const figures = [{
              type: 'line',
              attrs: { coordinates: [{ x: 0, y }, { x: bounding.width, y }] },
              styles: { style: 'dashed', color: d.color || '#9ca3af', size: d.size || 1, dashedValue: [4, 4] },
              ignoreEvent: true,
            }];
            if (d.label) {
              figures.push({
                type: 'text',
                attrs: { x: bounding.width - 4, y: y - 3, text: d.label, align: 'right', baseline: 'bottom' },
                styles: { color: d.color || '#9ca3af', size: 10, family: 'ui-monospace, monospace', backgroundColor: 'rgba(17,24,39,0.75)', paddingLeft: 3, paddingRight: 3, paddingTop: 1, paddingBottom: 1 },
                ignoreEvent: true,
              });
            }
            return figures;
          },
        });
        klinecharts.registerOverlay({
          name: 'dqBaseBox',
          totalStep: 3,
          lock: true,
          createPointFigures: ({ coordinates, overlay }) => {
            if (coordinates.length < 2 || coordinates.some(c => !c || !Number.isFinite(c.x) || !Number.isFinite(c.y))) return [];
            const [a, b] = coordinates;
            const d = overlay.extendData || {};
            const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
            const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
            const borderColor = d.borderColor || 'rgba(148,163,184,0.35)';
            const figures = [{
              type: 'rect',
              attrs: { x, y, width: w, height: h },
              styles: { style: 'stroke_fill', color: d.color || 'rgba(148,163,184,0.08)', borderColor, borderStyle: 'dashed', borderSize: 1, borderDashedValue: [4, 4] },
              ignoreEvent: true,
            }];
            if (d.label) {
              figures.push({
                type: 'text',
                attrs: { x: x + 3, y: y + 3, text: d.label, align: 'left', baseline: 'top' },
                styles: { color: d.labelColor || '#9ca3af', size: 9, family: 'ui-monospace, monospace', backgroundColor: 'rgba(17,24,39,0.6)', paddingLeft: 2, paddingRight: 2, paddingTop: 1, paddingBottom: 1 },
                ignoreEvent: true,
              });
            }
            if (d.pivotTag) {
              // Short dashed amber tail off the box's top-right + price label —
              // the "live pivot" marker on the forming base.
              figures.push({
                type: 'line',
                attrs: { coordinates: [{ x: x + w, y }, { x: x + w + 56, y }] },
                styles: { style: 'dashed', color: 'rgba(245,158,11,0.8)', size: 1, dashedValue: [3, 3] },
                ignoreEvent: true,
              });
              figures.push({
                type: 'text',
                attrs: { x: x + w + 58, y, text: d.pivotTag, align: 'left', baseline: 'middle' },
                styles: { color: '#f59e0b', size: 10, family: 'ui-monospace, monospace', backgroundColor: 'rgba(17,24,39,0.75)', paddingLeft: 3, paddingRight: 3, paddingTop: 1, paddingBottom: 1 },
                ignoreEvent: true,
              });
            }
            return figures;
          },
        });
        klinecharts.registerOverlay({
          name: 'dqMark',
          totalStep: 2,
          lock: true,
          createPointFigures: ({ coordinates, overlay }) => {
            if (!coordinates.length) return [];
            const d = overlay.extendData || {};
            return [{
              type: 'text',
              attrs: { x: coordinates[0].x, y: coordinates[0].y + (d.dy || 0), text: d.text || '', align: 'center', baseline: d.baseline || 'bottom' },
              styles: { color: d.color || '#e5e7eb', size: d.size || 10, family: 'ui-monospace, monospace', backgroundColor: 'transparent' },
              ignoreEvent: true,
            }];
          },
        });
        window.__dqKlineOverlaysReady = true;
      }

      _initKline(el) {
        if (!window.klinecharts) return null;
        this._ensureKlineOverlays();
        const chart = klinecharts.init(el);
        if (!chart) return null;
        chart.setStyles({
          grid: {
            horizontal: { color: 'rgba(148,163,184,0.08)' },
            vertical: { color: 'rgba(148,163,184,0.08)' },
          },
          candle: {
            bar: {
              upColor: '#10b981', downColor: '#ef4444',
              upBorderColor: '#10b981', downBorderColor: '#ef4444',
              upWickColor: '#10b981', downWickColor: '#ef4444',
              noChangeColor: '#9ca3af', noChangeBorderColor: '#9ca3af', noChangeWickColor: '#9ca3af',
            },
            priceMark: {
              last: { upColor: '#10b981', downColor: '#ef4444', noChangeColor: '#9ca3af' },
              high: { color: '#9ca3af' },
              low: { color: '#9ca3af' },
            },
            tooltip: {
              text: { color: '#d1d5db' },
              // Default legend plus a colored per-bar % change (vs the prior
              // bar's close — daily on D, weekly on W). Function form so the
              // change value can carry its own green/red color.
              custom: ({ prev, current }) => {
                const prevClose = prev?.close ?? current?.close;
                const chg = prevClose ? ((current.close - prevClose) / prevClose) * 100 : 0;
                const chgColor = chg > 0 ? '#10b981' : chg < 0 ? '#ef4444' : '#9ca3af';
                return [
                  { title: 'time', value: '{time}' },
                  { title: 'open', value: '{open}' },
                  { title: 'high', value: '{high}' },
                  { title: 'low', value: '{low}' },
                  { title: 'close', value: '{close}' },
                  { title: { text: 'Chg: ', color: '#9ca3af' }, value: { text: `${chg > 0 ? '+' : ''}${chg.toFixed(2)}%`, color: chgColor } },
                  { title: 'volume', value: '{volume}' },
                ];
              },
            },
          },
          indicator: {
            tooltip: { text: { color: '#9ca3af' } },
            lines: [
              { color: '#3b82f6' },
              { color: '#f59e0b' },
              { color: '#a855f7' },
            ],
          },
          xAxis: { axisLine: { color: '#374151' }, tickText: { color: '#9ca3af' }, tickLine: { color: '#374151' } },
          yAxis: { axisLine: { color: '#374151' }, tickText: { color: '#9ca3af' }, tickLine: { color: '#374151' } },
          crosshair: {
            horizontal: { line: { color: '#6b7280' }, text: { backgroundColor: '#374151' } },
            vertical: { line: { color: '#6b7280' }, text: { backgroundColor: '#374151' } },
          },
          separator: { color: '#374151' },
        });
        return chart;
      }

      // Draw signal context onto a chart: labeled levels always; base box, poke
      // ✗ marks and breakout ▲ only on daily bars (weekly window semantics differ).
      _applySignalOverlays(chart, signal, bars, opts = {}) {
        if (!chart || !signal) return;
        const daily = opts.daily !== false;
        const ts = (t) => new Date(t + 'T00:00:00Z').getTime();
        // Every point needs an x anchor even for horizontal lines — use the last bar.
        const anchorTs = bars && bars.length ? ts(bars[bars.length - 1].time) : Date.now();
        const level = (value, color, label, size) => {
          if (value == null || !(value > 0)) return;
          chart.createOverlay({ name: 'dqLevel', lock: true, points: [{ timestamp: anchorTs, value }], extendData: { color, label, size } });
        };

        if (signal.signalType === 'breakout') {
          if (signal.resistance) level(signal.resistance, '#ef4444', 'R');
          if (signal.support) level(signal.support, '#10b981', 'S');
          // Frozen entry — skip when it coincides with R (labels would collide)
          if (signal.entryPrice != null && (!signal.resistance || Math.abs(signal.entryPrice - signal.resistance) / signal.resistance > 0.001)) {
            level(signal.entryPrice, '#eab308', 'entry');
          }
        } else if (signal.signalType === 'extension' && signal.entryResistance) {
          level(signal.entryResistance, '#eab308', 'Entry', 2);
          if (signal.resistance && signal.resistance !== signal.entryResistance) {
            level(signal.resistance, '#ef4444', 'R');
          }
        } else if (signal.signalType === 'setup' && signal.ma20) {
          level(signal.ma20, '#3b82f6', 'MA20');
        }
        if ((signal.signalType === 'breakout' || signal.signalType === 'extension') && signal.stopLoss != null) {
          level(signal.stopLoss, '#ef4444', 'stop');
        }

        if (!daily || !bars || bars.length < 22) return;

        // Base box: the barsInRange consolidation before the breakout candle.
        // skipBaseBox: the chart page draws every detected base from /api/bases
        // instead, so the single signal-window box would just double-stroke it.
        const nBase = signal.barsInRange || 0;
        if (!opts.skipBaseBox && signal.signalType === 'breakout' && nBase >= 3 && signal.resistance && signal.support && bars.length > nBase + 1) {
          const startBar = bars[bars.length - 1 - nBase];
          const endBar = bars[bars.length - 2]; // last bar before the breakout candle
          chart.createOverlay({
            name: 'dqBaseBox',
            lock: true,
            points: [
              { timestamp: ts(startBar.time), value: signal.resistance },
              { timestamp: ts(endBar.time), value: signal.support },
            ],
          });
        }

        // Failed pokes: same rule the backend uses — last 20 bars excluding the
        // latest; wicked within 0.5% of the window pivot, closed >1% below it.
        const win = bars.slice(-21, -1);
        if (win.length) {
          const pivot = Math.max(...win.map(b => b.high));
          win.forEach(b => {
            if (b.high >= pivot * 0.995 && b.close <= pivot * 0.99) {
              chart.createOverlay({
                name: 'dqMark', lock: true,
                points: [{ timestamp: ts(b.time), value: b.high }],
                extendData: { text: '✗', color: '#ef4444', baseline: 'bottom', dy: -2, size: 10 },
              });
            }
          });
        }

        // Breakout ▲ under the bar the signal fired on
        const sd = signal.signalDate ? String(signal.signalDate).slice(0, 10) : null;
        if (sd) {
          const bar = bars.find(b => b.time === sd);
          if (bar) {
            chart.createOverlay({
              name: 'dqMark', lock: true,
              points: [{ timestamp: ts(bar.time), value: bar.low }],
              extendData: { text: '▲', color: '#eab308', baseline: 'top', dy: 4, size: 10 },
            });
          }
        }
      }

      // ── Full chart page (this.view === 'chart') ──

      openChartView(asset) {
        if (!asset) return;
        if (this.view !== 'chart') this._chartReturnView = this.view;
        if (this.chartAsset !== asset) this._showAllBases = false;
        this.chartAsset = asset;
        this.view = 'chart';
        this._chartKey = null; // force rebuild
        this.closeDrawer();
        this.render();
      }

      backFromChart() {
        this._disposePageChart();
        this._chartKey = null;
        const valid = ['dashboard', 'backtest', 'shortlist', 'winners', 'beat-raise', 'unusual-volume'];
        this.view = valid.includes(this._chartReturnView) ? this._chartReturnView : 'dashboard';
        this.render();
      }

      setChartRange(r) {
        this.chartRange = r;
        try { localStorage.setItem('dq-chart-range', r); } catch (e) {}
        this._chartKey = null;
        this.render();
      }

      setChartTf(tf) {
        this.chartTf = tf;
        try { localStorage.setItem('dq-chart-tf', tf); } catch (e) {}
        this._chartKey = null;
        this.render();
      }

      toggleChartMA(which) {
        if (which === 50) this.chartMA50 = !this.chartMA50;
        else this.chartMA200 = !this.chartMA200;
        this._chartKey = null;
        this.render();
      }

      // Marker legend shown under every chart — hover any term for the plain-
      // English meaning. Same data-tip mechanism as the rest of the dashboard.
      chartLegend() {
        const item = (glyph, glyphCls, label, tip) =>
          `<span class="inline-flex items-center gap-1 cursor-help" data-tip="${tip}"><span class="${glyphCls}">${glyph}</span><span>${label}</span></span>`;
        return `<div class="mt-1.5 flex flex-wrap gap-x-3.5 gap-y-1 text-[10px] text-gray-500 font-mono select-none">
          ${item('▦', 'text-gray-400', 'base', 'Dashed box: a detected consolidation base — the quiet range price built before a move. Amber = still forming.')}
          ${item('╌╌', 'text-yellow-500', 'entry / stop', 'Dashed lines: yellow = entry (the breakout level), red = stop or resistance R, green = support S, blue = 20-day MA on setups.')}
          ${item('✗', 'text-red-400', 'failed poke', 'Price wicked up to the pivot but closed well below it — sellers defended the level. 2+ inside a base means supply overhead.')}
          ${item('▲', 'text-yellow-500', 'breakout bar', 'The session that cleared the pivot and fired the signal.')}
          ${item('↳', 'text-gray-400', 'hi·lo in view', 'Chart furniture: the highest and lowest prices currently visible. Moves as you pan or zoom.')}
          ${item('E', 'text-purple-300', 'earnings', 'Earnings report dates — the purple E under a bar marks the session the company reported (or is scheduled to).')}
        </div>`;
      }

      renderChartPanel() {
        // Auto-refresh guard: fetchSignals() re-renders every 5s — leave the live
        // chart DOM alone unless asset/range/tf/MA state actually changed.
        const key = [this.chartAsset, this.chartRange, this.chartTf, this.chartMA50, this.chartMA200].join('|');
        if (key === this._chartKey && document.getElementById('chart-page-container')) return;
        this._chartKey = key;

        const sig = (this.signals || []).find(s => s.asset === this.chartAsset) || null;
        const price = sig && sig.currentPrice ? CUR + this.safeNum(sig.currentPrice, 2) : '';
        const pill = (active) => active
          ? 'bg-blue-500/20 text-blue-300 ring-1 ring-blue-500/40'
          : 'bg-gray-800 text-gray-400 ring-1 ring-gray-700/60 hover:bg-gray-700/60';

        document.getElementById('app').innerHTML = `
          <div class="flex-1 overflow-auto p-4 md:p-8 bg-gray-900">
            <div class="max-w-7xl mx-auto">
              <div class="mb-4 flex items-center justify-between flex-wrap gap-3">
                <div class="flex items-center gap-3 flex-wrap min-w-0">
                  <button onclick="dashboard.backFromChart()" class="px-3 py-1.5 rounded-md text-sm font-semibold bg-gray-800 hover:bg-gray-700 text-gray-300 ring-1 ring-gray-700/60 transition">← Signals</button>
                  <h1 class="text-2xl font-bold font-mono tracking-tight text-white">${this.chartAsset}</h1>
                  ${price ? `<span class="font-mono text-lg text-gray-300 tabular-nums">${price}</span>` : ''}
                  <a href="${this.getTradingViewUrl(this.chartAsset)}" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-400 hover:text-blue-300 transition" title="Open on TradingView">TradingView ↗</a>
                  <!-- Any-ticker search: works for symbols the agent never flagged
                       (chart/bases are Yahoo-backed) — those just render without
                       signal levels. Datalist suggests known signals + shortlist. -->
                  <div class="relative">
                    <input id="chart-ticker-search" placeholder="Any ticker…"
                      autocomplete="off" spellcheck="false"
                      oninput="dashboard.chartSearchInput()"
                      onkeydown="dashboard.chartSearchKey(event)"
                      onblur="setTimeout(() => dashboard.closeChartSearch(), 150)"
                      class="w-36 bg-gray-800 text-gray-200 text-xs font-mono uppercase rounded px-2.5 py-1.5 ring-1 ring-gray-700/60 focus:ring-blue-500 outline-none placeholder:normal-case placeholder:font-sans" />
                    <div id="chart-search-dd" class="absolute left-0 top-full mt-1 z-40 w-64 hidden bg-gray-800 ring-1 ring-gray-600/80 rounded-lg shadow-xl overflow-hidden"></div>
                  </div>
                </div>
                <div class="flex items-center gap-1.5 flex-wrap">
                  ${['3m', '6m', '1y', '2y'].map(r => `<button onclick="dashboard.setChartRange('${r}')" class="px-2.5 py-1 rounded text-xs font-semibold transition ${pill(this.chartRange === r)}">${r.toUpperCase()}</button>`).join('')}
                  <span class="w-px h-4 bg-gray-700 mx-1"></span>
                  <button onclick="dashboard.setChartTf('d')" class="px-2.5 py-1 rounded text-xs font-semibold transition ${pill(this.chartTf === 'd')}">D</button>
                  <button onclick="dashboard.setChartTf('w')" class="px-2.5 py-1 rounded text-xs font-semibold transition ${pill(this.chartTf === 'w')}">W</button>
                  <span class="w-px h-4 bg-gray-700 mx-1"></span>
                  <button onclick="dashboard.toggleChartMA(50)" class="px-2.5 py-1 rounded text-xs font-semibold transition ${pill(this.chartMA50)}">MA50</button>
                  <button onclick="dashboard.toggleChartMA(200)" class="px-2.5 py-1 rounded text-xs font-semibold transition ${pill(this.chartMA200)}">MA200</button>
                </div>
              </div>
              <div id="chart-page-container" class="w-full rounded-lg overflow-hidden bg-gray-900 ring-1 ring-gray-700/60" style="height:max(60vh,400px);min-height:50vh;"></div>
              <div class="mt-2 text-[11px] text-gray-500 font-mono flex justify-between flex-wrap gap-2"><span>${this.chartTf === 'w' ? 'Weekly' : 'Daily'} · ${this.chartRange.toUpperCase()}${sig ? ' · signal levels overlaid' : ''}${this.chartTf === 'w' ? '' : ' · base boxes from 2y detection'}<span id="next-earnings" class="text-purple-300"></span></span><span>space next · ← → nav · esc back</span></div>
              ${this.chartLegend()}
              <div id="base-xray" class="mt-6"></div>
            </div>
          </div>
        `;
        this._buildPageChart(sig);
        this._renderBaseXray(); // paints immediately when this asset's bases are cached
      }

      _buildPageChart(sig) {
        const token = ++this._pageChartToken;
        this._disposePageChart();
        fetch(`/api/candles/${encodeURIComponent(this.chartAsset)}?range=${this.chartRange}&tf=${this.chartTf}`)
          .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then(bars => {
            if (token !== this._pageChartToken || this.view !== 'chart') return;
            const el = document.getElementById('chart-page-container');
            if (!el) return;
            if (!bars || !bars.length) {
              el.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400">No price data available</div>';
              return;
            }
            const chart = this._initKline(el);
            if (!chart) {
              el.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400 text-sm">Chart failed to load</div>';
              return;
            }
            this._pageKline = chart;
            this._pageKlineEl = el;
            chart.applyNewData(this._toKlineBars(bars));
            chart.setOffsetRightDistance(80);
            const maParams = [this.chartMA50 ? 50 : null, this.chartMA200 ? 200 : null].filter(Boolean);
            if (maParams.length) {
              chart.createIndicator({ name: 'MA', calcParams: maParams }, true, { id: 'candle_pane' });
            }
            chart.createIndicator('VOL', false, { height: 90 });
            this._applySignalOverlays(chart, sig, bars, { daily: this.chartTf !== 'w', skipBaseBox: true });
            this._ensureBases(chart, token);
            this._addEarningsMarkers(chart, bars, token);
          })
          .catch(err => {
            const el = document.getElementById('chart-page-container');
            if (el) el.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400 text-sm">Chart failed to load</div>';
            console.error('Chart error:', err);
          });
      }

      // Earnings-date markers: purple E under each report-day bar (daily tf),
      // and "next earnings" in the caption. Absent when FMP is paused.
      async _addEarningsMarkers(chart, bars, token) {
        try {
          let ed = this._earnDatesCache;
          if (!ed || ed.asset !== this.chartAsset) {
            const r = await fetch(`/api/earnings-dates/${encodeURIComponent(this.chartAsset)}`);
            ed = { asset: this.chartAsset, dates: r.ok ? ((await r.json()).dates || []) : [] };
            this._earnDatesCache = ed;
          }
          const nextEl = document.getElementById('next-earnings');
          if (nextEl) {
            const today = new Date().toISOString().slice(0, 10);
            const next = ed.dates.find((d) => d.date >= today);
            nextEl.textContent = next ? ` · 📅 next earnings ${next.date}` : '';
          }
          if (token !== this._pageChartToken || this.view !== 'chart' || this.chartTf === 'w') return;
          const byTime = new Map(bars.map((b) => [b.time, b]));
          for (const d of ed.dates) {
            const bar = byTime.get(d.date);
            if (!bar) continue;
            chart.createOverlay({
              name: 'dqMark', lock: true,
              points: [{ timestamp: new Date(bar.time + 'T00:00:00Z').getTime(), value: bar.low }],
              extendData: { text: 'E', color: '#a855f7', baseline: 'top', dy: 14, size: 10 },
            });
          }
        } catch (e) { /* markers are decoration — never break the chart */ }
      }

      // ── Base X-ray (/api/bases) ──

      // Fetch bases once per asset; cache survives range/tf/MA rebuilds and the
      // 5s render tick (renderChartPanel's key guard means this only runs on a
      // real rebuild, and a cache hit costs no network).
      _ensureBases(chart, token) {
        const asset = this.chartAsset;
        const apply = (data) => {
          if (token !== this._pageChartToken || this.view !== 'chart') return;
          this._renderBaseXray();
          if (this.chartTf !== 'w' && chart && data && Array.isArray(data.bases)) {
            this._applyBaseOverlays(chart, data.bases);
          }
        };
        if (this._basesCache && this._basesCache.asset === asset) {
          apply(this._basesCache.data);
          return;
        }
        fetch('/api/bases/' + encodeURIComponent(asset))
          .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(data => {
            this._basesCache = { asset, data };
            apply(data);
          })
          .catch(() => {
            this._basesCache = { asset, data: null }; // remembered as unavailable
            apply(null);
          });
      }

      _applyBaseOverlays(chart, bases) {
        const ts = (t) => new Date(t + 'T00:00:00Z').getTime();
        bases.forEach((b) => {
          if (!b || !b.start || !b.end || !(b.pivot > 0) || !(b.low > 0)) return;
          const forming = b.status === 'forming';
          chart.createOverlay({
            name: 'dqBaseBox',
            lock: true,
            points: [
              { timestamp: ts(b.start), value: b.pivot },
              { timestamp: ts(b.end), value: b.low },
            ],
            extendData: forming
              ? { label: b.weeks + ' wks', color: 'rgba(245,158,11,0.06)', borderColor: 'rgba(245,158,11,0.5)', labelColor: '#f59e0b', pivotTag: 'pivot ' + CUR + b.pivot }
              : { label: b.weeks + ' wks' },
          });
        });
      }

      zoomToBase(idx) {
        const data = this._basesCache && this._basesCache.data;
        const b = data && Array.isArray(data.bases) ? data.bases[idx] : null;
        if (!b || !this._pageKline || typeof this._pageKline.scrollToTimestamp !== 'function') return;
        // scrollToTimestamp puts the target at the RIGHT edge of the view, so
        // aiming at the base's START showed only what came before it (i.e. the
        // previous base). Aim a week past its END so the whole base is on screen.
        const endStr = (b.breakout && b.breakout.date) || b.end || b.start;
        const target = new Date(endStr + 'T00:00:00Z').getTime() + 7 * 24 * 3600 * 1000;
        try { this._pageKline.scrollToTimestamp(target, 200); } catch (e) {}
      }

      toggleAllBases() {
        this._showAllBases = !this._showAllBases;
        this._renderBaseXray();
      }

      _renderBaseXray() {
        const el = document.getElementById('base-xray');
        if (!el) return;
        const cache = this._basesCache;
        if (!cache || cache.asset !== this.chartAsset) {
          el.innerHTML = '<div class="text-xs text-gray-600">Detecting bases…</div>';
          return;
        }
        const data = cache.data;
        if (!data || !Array.isArray(data.bases)) {
          el.innerHTML = '<div class="text-xs text-gray-600">Base detection unavailable</div>';
          return;
        }
        if (!data.bases.length) {
          el.innerHTML = '<div class="text-xs text-gray-600">No bases detected in the last 2 years</div>';
          return;
        }

        const newest = data.bases.slice().reverse();
        const shown = this._showAllBases ? newest : newest.slice(0, 4);
        const fmt = (v, d = 2) => (v == null || !Number.isFinite(Number(v)) || Number(v) <= 0) ? null : Number(v).toFixed(d);
        const dash = '<span class="text-gray-600">—</span>';
        const row = (label, tip, html) => `
          <div class="bg-gray-800/40 ring-1 ring-gray-700/50 rounded px-2.5 py-1.5 flex justify-between gap-3 text-[13px]">
            <span class="text-gray-400" data-tip="${tip}">${label}</span>
            ${html}
          </div>`;

        const card = (b) => {
          const origIdx = data.bases.indexOf(b);
          const forming = b.status === 'forming';
          const coil = fmt(b.coilRatio);
          const dry = fmt(b.volumeDryUp);
          const udv = fmt(b.upDownVolumeRatio, 1);
          const coilHtml = coil == null ? dash : (Number(coil) < 0.9
            ? `<span class="font-mono tabular-nums text-green-400">${coil}x · tightening</span>`
            : `<span class="font-mono tabular-nums text-gray-300">${coil}x</span>`);
          const dryHtml = dry == null ? dash : (Number(dry) < 0.9
            ? `<span class="font-mono tabular-nums text-green-400">${dry}x · quiet</span>`
            : `<span class="font-mono tabular-nums text-gray-300">${dry}x</span>`);
          const udvHtml = udv == null ? dash : (Number(udv) >= 1.5
            ? `<span class="font-mono tabular-nums text-green-400">${udv}x · accumulation</span>`
            : `<span class="font-mono tabular-nums text-gray-300">${udv}x</span>`);
          const fp = b.failedPokes || 0;
          const fpHtml = fp === 0
            ? '<span class="font-mono tabular-nums text-gray-300">0 · untested</span>'
            : fp <= 2
              ? `<span class="font-mono tabular-nums text-green-400">${fp} · defended</span>`
              : `<span class="font-mono tabular-nums text-orange-400">${fp} · heavy supply</span>`;
          const boVol = b.breakout ? fmt(b.breakout.volumeRatio) : null;
          const boVolHtml = boVol == null ? dash : (Number(boVol) >= 1.5
            ? `<span class="font-mono tabular-nums text-green-400">${boVol}x avg</span>`
            : `<span class="font-mono tabular-nums text-gray-300">${boVol}x avg</span>`);

          const run = b.breakout && b.breakout.runPct != null ? b.breakout.runPct : null;
          const badges = [
            forming ? '<span class="badge bg-amber-500/15 text-amber-300 ring-1 ring-amber-500/30"><span class="badge-dot"></span>forming now</span>' : '',
            (!forming && b.breakout) ? `<span class="text-[11px] px-2 py-0.5 rounded bg-gray-700/50 text-gray-400 ring-1 ring-gray-600/40">broke out ${b.breakout.date} — ran <span class="${run >= 0 ? 'text-green-400' : 'text-red-400'} font-semibold">${run >= 0 ? '+' : ''}${run}%</span></span>` : '',
            b.isBlueSky ? '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded uppercase tracking-wide bg-sky-500/15 text-sky-300 ring-1 ring-sky-500/30" data-tip="This base sits at the highest price of the period — no trapped sellers overhead.">Blue Sky</span>' : '',
            b.isVcpShape ? '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded uppercase tracking-wide bg-purple-500/15 text-purple-300 ring-1 ring-purple-500/30" data-tip="Tightening coil on drying volume — the volatility-contraction shape.">VCP shape</span>' : '',
            b.isStaircase ? '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded uppercase tracking-wide bg-indigo-500/15 text-indigo-300 ring-1 ring-indigo-500/30" data-tip="Progressive contraction: each third of the base tighter than the last — the classic staircase, and the strongest stratifier inside the VCP cohort.">Staircase</span>' : '',
          ].filter(Boolean).join(' ');

          return `
            <div class="bg-gray-800 rounded-lg ring-1 ring-gray-700/60 p-4 cursor-pointer hover:ring-gray-500/60 transition" onclick="dashboard.zoomToBase(${origIdx})" title="Show this base on the chart">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <span class="font-semibold text-white">Base · ${b.weeks} wks · ${b.depthPct}% deep · ${CUR}${b.pivot}</span>
              </div>
              <div class="mt-1.5 flex items-center flex-wrap gap-1.5">${badges}</div>
              <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${row('Coil', 'Range of the base&#39;s second half vs its first half. Below 1.0x the swings are tightening into the pivot.', coilHtml)}
                ${row('Volume dry-up', 'Average volume inside the base vs the 50 bars before it. Below 1.0x means sellers were running out while the base formed.', dryHtml)}
                ${row('Up ÷ down volume', 'Volume on up-days divided by down-days inside the base. Above 1.5x means buyers were quietly absorbing shares.', udvHtml)}
                ${row('Failed pokes', 'Times price wicked to the pivot but closed well below it. 0 is clean; 2+ means sellers defended the level.', fpHtml)}
                ${b.breakout ? row('Breakout volume', 'Volume on the breakout bar vs the base average. Real breakouts come on a surge — 1.5x or more.', boVolHtml) : ''}
              </div>
            </div>`;
        };

        el.innerHTML = `
          <div class="mb-3">
            <h2 class="text-lg font-bold text-white">Previous bases</h2>
            <p class="text-xs text-gray-500">Every base in the last 2 years — forming and resolved. Click a card to locate it on the chart.</p>
          </div>
          <div class="space-y-3">${shown.map(card).join('')}</div>
          ${newest.length > 4 ? `
            <button onclick="dashboard.toggleAllBases()" class="mt-3 w-full py-2 rounded-lg border border-dashed border-gray-700 text-sm text-gray-400 hover:text-gray-200 hover:border-gray-500 transition">
              ${this._showAllBases ? 'Show fewer' : `Show all bases (${newest.length})`}
            </button>` : ''}
        `;
      }

      isInShortlist(asset) {
        return this.shortlist.some(item => item.asset === asset);
      }

      // Build a self-contained, light-theme, shareable HTML report of the open
      // drawer's signal (works as-is via email, or Save-as-PDF from the button).
      // ponytail: browser print → PDF; no server route / OG card. Add a public
      // /share/:asset route with OG meta if social preview cards are needed.
      async exportSignal(asset, event) {
        if (event) event.stopPropagation();
        const s = this.selectedAsset;
        if (!s) return;
        // Open the window synchronously (inside the click gesture) so pop-up
        // blockers allow it; we fill it in after the async transcript fetch.
        const w = window.open('', '_blank');
        if (!w) { this.toast('Pop-up blocked — allow pop-ups to export', { kind: 'warn' }); return; }
        w.document.write('<!doctype html><title>Generating…</title><body style="font:15px -apple-system,sans-serif;color:#64748b;padding:40px">Generating report…</body>');

        const esc = (v) => { const d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; };
        const n = (v, d = 2) => this.safeNum(v, d);

        // Earnings call summary is loaded lazily (not on the signal) — fetch it
        // for stocks so the shared report carries it. ETFs have no transcript.
        let ta = null;
        if (s.assetType !== 'etf') {
          try { const r = await fetch('/api/transcript/' + encodeURIComponent(asset)); if (r.ok) ta = await r.json(); } catch (_) {}
        }

        // Live chart snapshot → embeddable PNG (may be absent if chart still loading)
        let chartImg = '';
        try {
          if (this._drawerKline && this._drawerKline.getConvertPictureUrl) {
            chartImg = `<img src="${this._drawerKline.getConvertPictureUrl(true, 'png', '#111827')}" alt="${esc(asset)} price chart" style="width:100%;border-radius:8px;border:1px solid #e5e7eb"/>`;
          }
        } catch (_) {}

        const buyLabel = s.signalType === 'breakout' ? 'Buy Point' : s.signalType === 'extension' ? 'Entry' : s.signalType === 'setup' ? 'MA20' : 'Level';

        // Flag badges (replaces the signal-type label): which lists this name is
        // in — Beat & Raise, Unusual Volume — plus whether it has earnings analysis.
        const lists = this.listsFor(asset);
        const inList = (k) => lists.some(l => l.key === k);
        const flagBadges = [
          inList('beat-raise') ? '<span class="badge" style="background:#f3e8ff;color:#7e22ce">Beat &amp; Raise</span>' : '',
          inList('unusual-volume') ? '<span class="badge" style="background:#ffedd5;color:#c2410c">Unusual Volume</span>' : '',
          ta ? '<span class="badge" style="background:#dcfce7;color:#166534">Earnings</span>' : '',
          s.stoppedOut ? '<span class="badge" style="background:#fef2f2;color:#dc2626">Stopped out</span>' : '',
        ].join('');
        const buyVal = s.signalType === 'setup' ? s.ma20 : s.entryPrice;

        const tile = (label, val, color) => `<div style="flex:1;min-width:110px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;font-weight:600">${label}</div>
          <div style="font-size:20px;font-weight:700;color:${color || '#0f172a'};font-variant-numeric:tabular-nums;margin-top:2px">${val}</div></div>`;

        const row = (k, v) => `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f1f5f9"><span style="color:#64748b">${k}</span><span style="font-weight:600;color:#0f172a;font-variant-numeric:tabular-nums">${v}</span></div>`;
        let levels = '';
        if (s.signalType === 'breakout') {
          levels = row('Resistance (R)', CUR + n(s.resistance)) + row('Support (S)', CUR + n(s.support));
        } else if (s.signalType === 'extension') {
          levels = row('Entry / breakout level', s.entryResistance != null ? CUR + n(s.entryResistance) : '—')
            + row('% gain from entry', s.pctGainFromEntry != null ? (s.pctGainFromEntry >= 0 ? '+' : '') + n(s.pctGainFromEntry) + '%' : '—')
            + row('Days in extension', s.daysSinceBreakout != null ? n(s.daysSinceBreakout, 1) + ' days' : '—');
        } else if (s.signalType === 'setup') {
          levels = row('Setup type', (s.setupType || 'base').toUpperCase())
            + row('Distance from MA20', n(s.distanceFromMA20, 1) + '%')
            + row('Consolidation range', s.consolidationRange != null ? n(s.consolidationRange, 1) + '%' : 'N/A');
        }

        // Earnings Call section (replaces Agent Analysis in the shared report).
        let earnings = '';
        if (ta) {
          const toneC = ta.tone === 'bullish' ? '#16a34a' : ta.tone === 'bearish' ? '#dc2626' : '#ca8a04';
          const guidC = ta.guidanceDirection === 'raised' ? '#16a34a' : ta.guidanceDirection === 'lowered' ? '#dc2626' : '#64748b';
          const chips = (arr, bg, fg, pre) => (arr || []).map(x => `<span style="display:inline-block;padding:2px 8px;border-radius:6px;background:${bg};color:${fg};font-size:12px;margin:0 4px 4px 0">${pre}${esc(x)}</span>`).join('');
          const hi = chips(ta.highlights, '#dcfce7', '#166534', '+ ');
          const rk = chips(ta.riskFlags, '#fee2e2', '#991b1b', '⚠ ');
          earnings = `<div class="sec"><h3>Earnings Call — Q${esc(ta.quarter)} ${esc(ta.year)}</h3>
            <div style="display:flex;gap:16px;font-size:13px;margin-bottom:8px;flex-wrap:wrap">
              <span>Tone: <b style="color:${toneC}">${esc(ta.tone)}${ta.toneScore != null ? ' (' + ta.toneScore.toFixed(2) + ')' : ''}</b></span>
              <span>Guidance: <b style="color:${guidC}">${esc(ta.guidanceDirection)}</b></span>
            </div>
            <div class="analysis">${esc(ta.summary)}</div>
            ${hi ? `<div style="margin-top:8px">${hi}</div>` : ''}
            ${rk ? `<div style="margin-top:4px">${rk}</div>` : ''}
            ${ta.modelUsed ? `<div style="font-size:11px;color:#94a3b8;margin-top:8px">Model: ${esc(ta.modelUsed)}${ta.createdAt ? ' · ' + esc(new Date(ta.createdAt).toLocaleDateString()) : ''}</div>` : ''}
          </div>`;
        } else if (s.assetType !== 'etf') {
          earnings = `<div class="sec"><h3>Earnings Call</h3><div class="analysis" style="color:#94a3b8">No earnings call analysis available yet.</div></div>`;
        }

        const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(asset)} — Signal Forge</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f7;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:640px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .hd{padding:20px 24px;border-bottom:1px solid #eef2f7}
  .ticker{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eff6ff;color:#2563eb;margin-left:8px;vertical-align:middle}
  .sec{padding:16px 24px}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin:0 0 8px}
  .tiles{display:flex;flex-wrap:wrap;gap:8px}
  .analysis{background:#f8fafc;border:1px solid #eef2f7;border-radius:8px;padding:12px 14px;font-size:14px;color:#334155;white-space:pre-wrap;word-break:break-word}
  .ft{padding:14px 24px;border-top:1px solid #eef2f7;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  a{color:#2563eb;text-decoration:none}
  .bar{max-width:640px;margin:16px auto 0;padding:0 16px;display:flex;gap:8px}
  .bar button{flex:1;padding:11px;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:#2563eb;color:#fff}
  .bar button.alt{background:#e2e8f0;color:#0f172a}
  @media print{.bar{display:none}body{background:#fff}.wrap{margin:0}.card{border:0;box-shadow:none}}
</style></head><body>
<div class="bar">
  <button onclick="window.print()">Save as PDF / Print</button>
  <button class="alt" onclick="const b=new Blob([document.documentElement.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='${esc(asset)}-signal.html';a.click()">Download HTML</button>
</div>
<div class="wrap"><div class="card">
  <div class="hd">
    <div><span class="ticker">${esc(asset)}</span>${flagBadges}</div>
    <div style="color:#64748b;font-size:14px;margin-top:4px">${esc(s.sector || 'Unknown')}${s.industry && s.industry !== 'Unknown' ? ' · ' + esc(s.industry) : ''}</div>
  </div>
  <div class="sec"><div class="tiles">
    ${tile('Price', CUR + n(s.currentPrice), '#0f172a')}
    ${tile(buyLabel, buyVal != null ? CUR + n(buyVal) : '—', '#b45309')}
    ${tile('Stop', s.stopLoss != null ? CUR + n(s.stopLoss) : '—', '#dc2626')}
    ${tile('Confidence', s.confidence + '%', s.confidence >= 90 ? '#16a34a' : s.confidence >= 80 ? '#ca8a04' : '#ea580c')}
  </div></div>
  ${chartImg ? `<div class="sec"><h3>6 months · Daily</h3>${chartImg}</div>` : ''}
  ${levels ? `<div class="sec"><h3>Levels</h3>${levels}</div>` : ''}
  ${earnings}
  <div class="ft">
    <span>Signal Forge · ${s.createdAt ? esc(new Date(s.createdAt).toLocaleDateString()) : ''}</span>
    <a href="${this.getTradingViewUrl(asset)}" target="_blank" rel="noopener">View on TradingView ↗</a>
  </div>
</div></div>
</body></html>`;

        w.document.open();
        w.document.write(html);
        w.document.close();
      }

      async runScan() {
        this.scanning = true;
        this.render();
        try {
          const res = await fetch('/api/scan', { method: 'POST' });
          const data = await res.json();
          console.log('Scan started:', data);
          setTimeout(() => this.fetchSignals(), 2000);
        } catch (error) {
          console.error('Failed to start scan:', error);
        } finally {
          this.scanning = false;
          this.render();
        }
      }

      getSignalColor(signal) {
        // Fresh breakout at 99% = solid green
        if (signal.signalType === 'breakout' && signal.pineScriptGreen && signal.confidence === 99) {
          return { emoji: '🟢', label: 'fresh-breakout', bgClass: 'bg-green-700' };
        }
        // 99% green cone (any type)
        if (signal.confidence === 99) {
          return { emoji: '🟢', label: 'green', bgClass: 'bg-green-700' };
        }
        // 95-98%: high confidence
        if (signal.confidence >= 95) {
          return { emoji: '🟢', label: 'bright-green', bgClass: 'bg-green-600' };
        }
        // 90-94%: green fade
        if (signal.confidence >= 90) {
          return { emoji: '🟢', label: 'green-fade', bgClass: 'bg-green-500' };
        }
        // 85-89%: orange
        if (signal.confidence >= 85) {
          return { emoji: '🟠', label: 'orange', bgClass: 'bg-orange-600' };
        }
        // Extensions below 85%
        if (signal.signalType === 'extension') {
          return { emoji: '🟡', label: 'extension', bgClass: 'bg-yellow-600' };
        }
        // Below 85% = filtered out
        return { emoji: '⚪', label: 'neutral', bgClass: 'bg-gray-600' };
      }

      getTradingViewUrl(asset) {
        // TradingView needs an exchange prefix for Indian tickers; FMP's .NS/.BO
        // suffix doesn't resolve. Map .NS→NSE:, .BO→BSE:; US passes through.
        let sym = asset;
        if (/\.NS$/i.test(asset)) sym = 'NSE:' + asset.replace(/\.NS$/i, '');
        else if (/\.BO$/i.test(asset)) sym = 'BSE:' + asset.replace(/\.BO$/i, '');
        return `https://www.tradingview.com/chart/?symbol=${encodeURIComponent(sym)}`;
      }

      async copyTvList() {
        const list = this.shortlist.map(i => i.asset).join(',');
        try {
          await navigator.clipboard.writeText(list);
          this.toast(`Copied ${this.shortlist.length} tickers — paste into TradingView`, { kind: 'success' });
        } catch {
          this.toast('Copy failed', { kind: 'warn' });
        }
      }

      updateSearch(value) {
        clearTimeout(this._searchDebounceTimer);
        this._searchDebounceTimer = setTimeout(() => {
          this.filtering = value;
          this.render();
        }, 500);
      }

      // Source of truth for keyboard nav (space, ← →). When the shortlist view
      // is open, walking should stay within the shortlist; otherwise the main
      // filtered table. Returns full signal objects so openDrawer() gets all data.
      getNavList() {
        const byAsset = new Map(this.signals.map(s => [s.asset, s]));
        const fromAssets = (assets) =>
          assets.map(a => byAsset.get(a) || { asset: a, assetType: 'stock' }).filter(Boolean);
        // Space/arrow nav must walk the list the user is actually looking at —
        // not the Signals list — or "next" from a Beat & Raise row jumps to an
        // unrelated ticker. The chart page inherits the view it was opened
        // from. Filters mirror each panel's own render exactly.
        const navView = this.view === 'chart' ? (this._chartReturnView || 'dashboard') : this.view;
        if (this.showShortlist || navView === 'shortlist') {
          return fromAssets(this.shortlist.map(item => item.asset));
        }
        if (navView === 'beat-raise') {
          return fromAssets((this.beatRaise?.stocks || []).map(s => s.asset));
        }
        if (navView === 'unusual-volume') {
          return fromAssets((this.unusualVolume?.stocks || []).map(s => s.asset));
        }
        if (navView === 'backtest') {
          return fromAssets((this.backtest?.recent || []).map(r => r.asset));
        }
        if (navView === 'winners') {
          const { tier: filterTier, asset: assetFilter } = this.winnersFilter || {};
          const rows = (this.winners?.winners || [])
            .filter(r => !filterTier || filterTier === 'all' || r.tier === filterTier)
            .filter(r => !assetFilter || (r.asset || '').toLowerCase().includes(assetFilter.toLowerCase()));
          return fromAssets(rows.map(r => r.asset));
        }
        return this.getFilteredSignals();
      }

      getFilteredSignals() {
        // "Stopped" is a cross-type view: show every stopped-out name regardless
        // of signal type or the min-confidence slider.
        const stoppedView = this.signalTypeFilter === 'stopped';
        let filtered = stoppedView
          ? this.signals.filter(s => s.stoppedOut)
          : this.signals.filter(s => s.confidence >= this.minConfidence);

        // Asset type filter (stocks, etfs, all)
        if (this.assetTypeFilter !== 'all') {
          filtered = filtered.filter(s => s.assetType === this.assetTypeFilter);
        }

        // Signal type filter
        if (this.signalTypeFilter !== 'all' && !stoppedView) {
          filtered = filtered.filter(s => s.signalType === this.signalTypeFilter);
        }

        // Sector filter
        if (this.sectorFilter !== 'all') {
          filtered = filtered.filter(s => s.sector === this.sectorFilter);
        }

        // Quality filters — each active chip is a hard AND requirement
        const q = this.qualityFilters || {};
        if (q.vcp) filtered = filtered.filter(s => s.isVcp);
        if (q.blueSky) filtered = filtered.filter(s => s.isBlueSky);
        if (q.leaders) filtered = filtered.filter(s => s.rsRating != null && s.rsRating >= 70);

        if (this.filtering) {
          filtered = filtered.filter(s => s.asset.toLowerCase().includes(this.filtering.toLowerCase()));
        }

        // Sort — stopped-out names always sink below live signals. Multi-key:
        // walk sortKeys in priority order until one differentiates; missing
        // values (null RS, no earnings score) always sort last regardless of
        // direction, so "—" rows never lead the table.
        const sortVal = {
          confidence: (s) => s.confidence,
          asset: (s) => s.asset,
          rs: (s) => s.rsRating,
          earnings: (s) => s.earningsSortScore,
        };
        const keys = this.sortKeys?.length ? this.sortKeys : [{ key: 'confidence', dir: 'desc' }];
        filtered.sort((a, b) => {
          if (!!a.stoppedOut !== !!b.stoppedOut) return a.stoppedOut ? 1 : -1;
          for (const { key, dir } of keys) {
            const f = sortVal[key];
            if (!f) continue;
            const av = f(a);
            const bv = f(b);
            if (av == null && bv == null) continue;
            if (av == null) return 1;
            if (bv == null) return -1;
            const v = typeof av === 'string' ? av.localeCompare(bv) : av - bv; // ascending
            if (v === 0) continue;
            return dir === 'asc' ? v : -v;
          }
          return 0;
        });

        return filtered;
      }

      toggleSort(field, additive = false) {
        // Numeric columns start descending (best first); Asset starts A→Z.
        const defaults = { asset: 'asc', confidence: 'desc', rs: 'desc', earnings: 'desc' };
        const keys = [...(this.sortKeys || [])];
        const i = keys.findIndex(k => k.key === field);
        if (additive) {
          // shift-click: add as an extra sort level, or flip it in place
          if (i >= 0) keys[i] = { key: field, dir: keys[i].dir === 'asc' ? 'desc' : 'asc' };
          else keys.push({ key: field, dir: defaults[field] || 'desc' });
        } else if (i === 0) {
          keys[0] = { key: field, dir: keys[0].dir === 'asc' ? 'desc' : 'asc' };
        } else {
          // plain click: promote to primary; previous keys stay as tie-breakers
          if (i > 0) keys.splice(i, 1);
          keys.unshift({ key: field, dir: defaults[field] || 'desc' });
        }
        this.sortKeys = keys.slice(0, 3); // deeper than 3 levels is noise
        this.savePrefs();
        this.render();
      }

      // Header arrow for a sort key; shows priority rank when multi-sorting.
      sortIndicator(key) {
        const i = (this.sortKeys || []).findIndex(k => k.key === key);
        if (i < 0) return '';
        const arrow = this.sortKeys[i].dir === 'asc' ? '↑' : '↓';
        const rank = this.sortKeys.length > 1 ? `<sup>${i + 1}</sup>` : '';
        return `<span class="text-gray-500">${arrow}${rank}</span>`;
      }

      setFilter(kind, value) {
        this[kind] = value;
        this.savePrefs();
        if (kind === 'assetTypeFilter') this.fetchSignals();
        else this.render();

      showSectorPeers(sector) {

        this.filtering = '';
        this.assetTypeFilter = 'stock';

        const sectors = new Set();
        this.signals.forEach(s => {

        return Array.from(sectors).sort();

      renderMarketStatus() {
        // Region-aware: US = NYSE 9:30-16:00 ET, IN = NSE 9:15-15:30 IST.
        const isIN = REGION === 'in';
        const tz = isIN ? 'Asia/Kolkata' : 'America/New_York';
        const sfx = isIN ? 'IST' : 'ET';
        const now = new Date();
        const fmt = new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
        const parts = Object.fromEntries(fmt.formatToParts(now).map(p => [p.type, p.value]));
        const wd = parts.weekday;
        const h = parseInt(parts.hour, 10);
        const m = parseInt(parts.minute, 10);
        const mins = h * 60 + m;
        const isWeekday = ['Mon','Tue','Wed','Thu','Fri'].includes(wd);
        const open = isIN ? 9 * 60 + 15 : 9 * 60 + 30;
        const close = isIN ? 15 * 60 + 30 : 16 * 60;
        const openLabel = isIN ? `9:15 AM ${sfx}` : `10:00 AM ${sfx}`;
        const cronStart = isIN ? open : 10 * 60;  // US first scan 10 AM ET; IN from open
        const cronEnd = close - 15;               // last intraday scan ~15m before close

        let dot, label, nextScan;
        if (isWeekday && mins >= open && mins < close) {
          dot = 'bg-green-500';
          label = 'Market open';
          if (mins < cronStart) nextScan = `Next scan: ${openLabel}`;
          else if (mins < cronEnd) {
            const nextHour = h + 1;
            nextScan = `Next scan: ${nextHour}:00 ${sfx}`;
          } else nextScan = 'Last intraday scan complete';
        } else {
          dot = 'bg-gray-500';
          label = isWeekday && mins < open ? 'Pre-market' : 'Market closed';
          nextScan = isWeekday && mins < open ? `Next scan: ${openLabel} today` : `Next scan: Mon ${openLabel}`;
        }
        return `
          <div class="flex items-center gap-2 justify-end">
            <span class="inline-block w-2 h-2 rounded-full ${dot}"></span>
            <span class="text-gray-300 font-medium">${label}</span>
          </div>
          <div class="text-gray-500 mt-0.5">${nextScan} · live refresh ${new Date().toLocaleTimeString()}</div>
        `;
      }

      formatRelative(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        const diffMs = Date.now() - d.getTime();
        const min = Math.floor(diffMs / 60000);
        if (min < 1) return 'just now';
        if (min < 60) return min + 'm ago';
        const hr = Math.floor(min / 60);
        if (hr < 24) return hr + 'h ago';
        const day = Math.floor(hr / 24);
        if (day < 7) return day + 'd ago';
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      formatAlertDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      // Calendar date of the actual breakout: scan date minus N trading bars.
      // ponytail: business-day subtraction ignores market holidays, so it can be
      // off by one across a holiday. Fine for the 1-5 bar extension window.
      breakoutDateFromDays(scanIso, daysSinceBreakout) {
        if (!scanIso || daysSinceBreakout === null || daysSinceBreakout === undefined) return '';
        const d = new Date(scanIso);
        let bars = Math.ceil(daysSinceBreakout);
        while (bars > 0) {
          d.setDate(d.getDate() - 1);
          const wd = d.getDay();
          if (wd !== 0 && wd !== 6) bars--;
        }
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      render() {
        const active = document.activeElement;
        const activeId = active?.id || null;
        let selStart = null, selEnd = null;
        if (activeId && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
          try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (e) {}
        }

        // innerHTML re-renders destroy the scroll containers (or collapse their
        // content), zeroing scroll positions. Snapshot every [data-keep-scroll]
        // element by key and restore after the panel re-renders.
        const scrollKeep = {};
        document.querySelectorAll('[data-keep-scroll]').forEach(el => {
          scrollKeep[el.dataset.keepScroll] = { left: el.scrollLeft, top: el.scrollTop };
        });

        // Leaving the chart view via any other navigation: release the chart.
        if (this.view !== 'chart' && this._pageKline) {
          this._disposePageChart();
          this._chartKey = null;
        }

        this.renderNavBar();
        if (this.view === 'chart') {
          this.renderChartPanel();
        } else if (this.view === 'backtest') {
          this.renderBacktestPanel();
        } else if (this.view === 'shortlist') {
          this.renderShortlistPanel();
        } else if (this.view === 'winners') {
          this.renderWinnersPanel();
        } else if (this.view === 'beat-raise') {
          this.renderBeatRaisePanel();
        } else if (this.view === 'unusual-volume') {
          this.renderUnusualVolumePanel();
        } else if (this.view === 'sectors') {
          this.renderSectorsPanel();
        } else {
          this.renderMainDashboard();
        }

        // Restore scroll only within the SAME view (refresh ticks, filter
        // changes). Carrying positions across a tab switch made the new panel
        // land mid-scroll — a fresh view starts at the top.
        const viewChanged = this._lastRenderedView !== this.view;
        this._lastRenderedView = this.view;
        document.querySelectorAll('[data-keep-scroll]').forEach(el => {
          if (viewChanged) { el.scrollLeft = 0; el.scrollTop = 0; return; }
          const s = scrollKeep[el.dataset.keepScroll];
          if (s) { el.scrollLeft = s.left; el.scrollTop = s.top; }
        });

        if (activeId) {
          const el = document.getElementById(activeId);
          if (el) {
            el.focus();
            if (selStart !== null && typeof el.setSelectionRange === 'function') {
              try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
            }
          }
        }
      }

                      if (t === 'extension') return `<button onclick="${jump('extension')}" class="${cls} bg-yellow-500/15 ring-yellow-500/30 text-yellow-400" title="Also flagged as Type 3 extension — click to open Signals filtered to ${r.asset}">Extension <span class="text-[9px] opacity-80">↗</span></button>`;
                      if (t === 'setup') return `<button onclick="${jump('setup')}" class="${cls} bg-blue-500/15 ring-blue-500/30 text-blue-400" title="Also flagged as Type 2 setup — click to open Signals filtered to ${r.asset}">Setup <span class="text-[9px] opacity-80">↗</span></button>`;
                      return '<span class="text-gray-600">—</span>';
                    };
                    return `
                    <tr class="${idx % 2 === 0 ? 'bg-gray-800/60' : 'bg-gray-800/30'} border-b border-gray-700/50 hover:bg-gray-800/40 transition cursor-pointer" onclick="dashboard.openAsset('${(r.asset||'').replace(/'/g, "\\'")}')">
                      <td class="card-header px-3 py-2.5 whitespace-nowrap">
                        <div class="font-mono font-semibold text-white flex items-center gap-1.5">
                        <span>${r.asset}</span>${this.crossRefPills(r.asset, 'winners')}
                        <a href="${this.getTradingViewUrl(r.asset)}" target="_blank" rel="noopener noreferrer" class="text-sm text-blue-400 hover:text-blue-300 transition" title="Open on TradingView" onclick="event.stopPropagation();">↗</a>
                        ${r.politicianBuy ? `<a href="${r.politicianBuy.link || '#'}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" class="text-[9px] font-bold px-1 py-0.5 rounded uppercase tracking-wide ring-1 bg-purple-500/15 text-purple-300 ring-purple-500/30 hover:bg-purple-500/25 transition" title="Politician purchase — ${r.politicianBuy.name} (${r.politicianBuy.transactionDate || '?'}) · ${r.politicianBuy.amount || ''}">🏛</a>` : ''}
                        </div>
                      </td>
                      <td data-label="Tier" class="px-3 py-2.5 whitespace-nowrap text-center">
                        <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold ring-1 ${tierBg(r.tier)} ${tierColor(r.tier)}">${r.tier}</span>
                      </td>
                      <td data-label="Price" class="px-3 py-2.5 whitespace-nowrap text-right font-mono text-white tabular-nums">${CUR}${fmt(r.currentPrice, 2)}</td>
                      <td data-label="EPS Δ" class="px-3 py-2.5 whitespace-nowrap text-right font-mono text-green-400 tabular-nums">${fmt(r.epsGrowthPct, 0, true)}</td>
                      <td data-label="Rev Δ" class="px-3 py-2.5 whitespace-nowrap text-right font-mono text-green-400 tabular-nums">${fmt(r.revenueGrowthPct, 0, true)}</td>
                      ${isMoving
                        ? `<td data-label="+${win} Return" class="px-3 py-2.5 whitespace-nowrap text-right font-mono tabular-nums text-green-400">+${fmt(r.returnPct, 1, true)}</td>`
                        : `<td data-label="Dist 52w" class="px-3 py-2.5 whitespace-nowrap text-right font-mono tabular-nums ${r.distFrom52wHighPct <= 5 ? 'text-green-400' : 'text-gray-300'}">-${fmt(r.distFrom52wHighPct, 1, true)}</td>`}
                      <td data-label="MAs" class="px-3 py-2.5 whitespace-nowrap text-right ${r.maStacked ? 'text-green-400' : 'text-gray-500'}">${r.maStacked ? '✓' : '—'}</td>
                      <td data-label="Signal" class="px-3 py-2.5 whitespace-nowrap text-right">${signalBadge(r.signalType)}</td>
                      <td data-label="Sector" class="px-3 py-2.5 whitespace-nowrap text-right text-[11px] text-gray-400 truncate">${r.sector || '—'}</td>
                    </tr>
                  `; }).join('')}
                  </tbody>
                  </table>
                </div>
              `}
            </div>
          </div>
        `;
      }

      renderSectorsPanel() {
        const d = this.sectorStrength;
        const sectors = d?.sectors || [];
        const pct = (n) => n == null || Number.isNaN(n)
          ? '<span class="text-gray-600">—</span>'
          : `<span class="font-mono tabular-nums ${n >= 0 ? 'text-green-400' : 'text-red-400'}">${n >= 0 ? '+' : ''}${n.toFixed(1)}%</span>`;

        document.getElementById('app').innerHTML = `
          <div class="flex-1 overflow-auto p-8 bg-gray-900" data-keep-scroll="sectors-y">
            <div class="max-w-7xl mx-auto">
              <div class="mb-6 flex items-end justify-between flex-wrap gap-3">
                <div>
                  <h1 class="text-2xl font-bold tracking-tight">Sector Strength</h1>
                  <p class="text-gray-500 text-sm">Every scanned stock's trailing returns, rolled up by sector — strongest first. Leaders = stocks in the market's top quintile.</p>
                </div>
                <button onclick="dashboard.fetchSectorStrength()" class="text-[11px] uppercase tracking-wider font-semibold px-2.5 py-1 rounded bg-gray-800 hover:bg-gray-700 text-gray-300 ring-1 ring-gray-700/60 transition">Refresh</button>
              </div>
              ${this.sectorStrengthLoading || !d ? `
                <div class="text-center py-16 text-gray-500 text-sm">Rolling up sector strength from the scanned universe…</div>
              ` : sectors.length === 0 ? `
                <div class="bg-gray-800/60 ring-1 ring-gray-700/60 rounded-lg text-center py-16 px-6">
                  <div class="text-4xl mb-3 opacity-40">◎</div>
                  <h3 class="text-lg font-semibold text-gray-200 mb-1">No sector data yet</h3>
                  <p class="text-sm text-gray-500">${d.note || 'No sectors with enough stocks in the fresh universe.'}</p>
                </div>
              ` : `
                <div class="mb-3 text-[11px] text-gray-500 font-mono">${d.universe} stocks in the fresh universe${d.asOf ? ' · as of ' + new Date(d.asOf).toLocaleTimeString() : ''}</div>
                <div class="bg-gray-800 rounded-lg overflow-x-auto ring-1 ring-gray-700/60" data-keep-scroll="sectors-x">
                  <table class="w-full signals-responsive" style="min-width:900px;">
                    <thead class="sticky-head">
                      <tr class="border-b border-gray-600">
                        <th style="min-width:60px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Rank</th>
                        <th style="min-width:180px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Sector</th>
                        <th style="min-width:70px;" class="px-3 py-2.5 text-right text-[11px] font-semibold uppercase tracking-wider text-gray-300">Stocks</th>
                        <th style="min-width:80px;" class="px-3 py-2.5 text-right text-[11px] font-semibold uppercase tracking-wider text-gray-300"><span data-tip="Median trailing 1-week return of the sector's stocks.">1W</span></th>
                        <th style="min-width:80px;" class="px-3 py-2.5 text-right text-[11px] font-semibold uppercase tracking-wider text-gray-300"><span data-tip="Median trailing 1-month return of the sector's stocks.">1M</span></th>
                        <th style="min-width:80px;" class="px-3 py-2.5 text-right text-[11px] font-semibold uppercase tracking-wider text-gray-300"><span data-tip="Median trailing 3-month return of the sector's stocks.">3M</span></th>
                        <th style="min-width:110px;" class="px-3 py-2.5 text-right text-[11px] font-semibold uppercase tracking-wider text-gray-300"><span data-tip="Stocks in this sector ranking in the whole market's top quintile by weighted trailing return — where leadership is concentrated.">Leaders</span></th>
                        <th style="min-width:170px;" class="px-3 py-2.5 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-300">Top names</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${sectors.map((s, idx) => `
                        <tr class="${idx % 2 === 0 ? 'bg-gray-800/60' : 'bg-gray-800/30'} border-b border-gray-700/50">
                          <td class="card-header px-3 py-2.5 whitespace-nowrap font-mono tabular-nums ${s.rank === 1 ? 'text-green-400 font-bold' : 'text-gray-400'}">#${s.rank}</td>
                          <td data-label="Sector" class="px-3 py-2.5 whitespace-nowrap font-semibold text-white">${s.sector}</td>
                          <td data-label="Stocks" class="px-3 py-2.5 whitespace-nowrap text-right font-mono tabular-nums text-gray-400">${s.stocks}</td>
                          <td data-label="1W" class="px-3 py-2.5 whitespace-nowrap text-right">${pct(s.median1wPct)}</td>
                          <td data-label="1M" class="px-3 py-2.5 whitespace-nowrap text-right">${pct(s.median1mPct)}</td>
                          <td data-label="3M" class="px-3 py-2.5 whitespace-nowrap text-right">${pct(s.median3mPct)}</td>
                          <td data-label="Leaders" class="px-3 py-2.5 whitespace-nowrap text-right font-mono tabular-nums ${s.leadersPct >= 25 ? 'text-green-400' : 'text-gray-300'}">${s.leaders ?? '—'}${s.leadersPct != null ? ' · ' + s.leadersPct + '%' : ''}</td>
                          <td data-label="Top names" class="px-3 py-2.5 whitespace-nowrap">
                            ${(s.topAssets || []).map(t => `<button onclick="dashboard.openAsset('${String(t).replace(/'/g, "\\'")}'); event.stopPropagation();" class="font-mono text-[11px] px-1.5 py-0.5 mr-1 rounded bg-gray-700/60 text-blue-300 ring-1 ring-gray-600/40 hover:bg-gray-700 transition">${t}</button>`).join('')}
