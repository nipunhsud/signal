<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Quant — Breakouts confirmed by earnings tone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/vendor/klinecharts.min.js"></script>
  <style>
    body.resizing {
      user-select: none;
      cursor: col-resize !important;
    }
    #app.drawer-open .max-w-7xl {
      max-width: 100% !important;
    }
    #app.drawer-open .p-8 {
      padding-right: 2rem !important;
    }
    .signal-row {
      transition: background-color 0.15s ease;
      position: relative;
    }
    .signal-row:hover {
      background-color: rgba(59, 130, 246, 0.08) !important;
    }
    .signal-row:hover .row-asset {
      color: #93c5fd;
    }
    thead.sticky-head th {
      position: sticky;
      top: 0;
      z-index: 5;
      background-color: rgb(55 65 81); /* gray-700 */
    }
    /* Reserve the vertical-scrollbar gutter so short panels (no scrollbar) and
       long ones (scrollbar) keep identical content width — otherwise centered
       content shifts sideways on every tab change. */
    #app, #app .overflow-auto { scrollbar-gutter: stable; }
    /* Desktop: pin the Asset column so horizontal scroll keeps the ticker in view.
       Cells need a solid background (rows use translucent tints) or scrolled
       content bleeds through underneath. */
    @media (min-width: 769px) {
      table.signals-responsive th:first-child,
      table.signals-responsive td:first-child {
        position: sticky;
        left: 0;
        z-index: 3;
        background-color: rgb(31 41 55); /* gray-800 solid */
      }
      table.signals-responsive thead.sticky-head th:first-child {
        z-index: 6; /* above both scrolling rows and the sticky header row */
        background-color: rgb(55 65 81);
      }
      .signal-row:hover td:first-child {
        background-color: rgb(38 49 68); /* matches the row hover tint over gray-800 */
      }
      table.signals-responsive th:first-child::after,
      table.signals-responsive td:first-child::after {
        content: '';
        position: absolute;
        top: 0;
        right: -10px;
        bottom: 0;
        width: 10px;
        background: linear-gradient(to right, rgba(0,0,0,0.3), transparent);
        pointer-events: none;
      }
    }
    /* Mobile: reflow the signals table into stacked cards so nothing hides behind
       horizontal scroll. Desktop (>768px) keeps the full table unchanged. */
    @media (max-width: 768px) {
      table.signals-responsive { min-width: 0 !important; }
      table.signals-responsive thead { display: none; }
      table.signals-responsive,
      table.signals-responsive tbody,
      table.signals-responsive tr,
      table.signals-responsive td { display: block; width: 100%; }
      table.signals-responsive tr { margin: 0 0 12px; border: 1px solid #374151; border-radius: 10px; overflow: hidden; }
      table.signals-responsive td {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding: 7px 12px !important; white-space: normal !important;
        border-bottom: 1px solid rgba(55,65,81,0.5);
      }
      table.signals-responsive td:last-child { border-bottom: none; }
      table.signals-responsive td[data-label]::before {
        content: attr(data-label);
        color: #9ca3af; font-size: 10px; text-transform: uppercase;
        letter-spacing: 0.06em; font-weight: 600; flex: 0 0 auto;
      }
      /* Asset cell = card header: full-width, emphasized, no label */
      table.signals-responsive td.card-header { background: rgba(31,41,55,0.6); border-bottom: 1px solid #374151; }
    }
    @keyframes pulse-alert {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.6); }
      50% { box-shadow: 0 0 0 6px rgba(248, 113, 113, 0); }
    }
    .alert-pulse {
      animation: pulse-alert 1.8s ease-in-out infinite;
    }
    .conf-bar {
      height: 3px;
      border-radius: 2px;
      margin-top: 3px;
      background: linear-gradient(90deg, currentColor 0%, currentColor var(--pct, 0%), rgba(255,255,255,0.08) var(--pct, 0%));
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
    }
    /* Toast stack */
    #toast-stack {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      min-width: 220px;
      max-width: 360px;
      padding: 10px 14px;
      background: rgba(31, 41, 55, 0.98);
      backdrop-filter: blur(4px);
      color: #e5e7eb;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(8px);
      animation: toast-in 0.18s ease forwards;
    }
    .toast.leaving {
      animation: toast-out 0.18s ease forwards;
    }
    @keyframes toast-in {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toast-out {
      to { opacity: 0; transform: translateY(8px); }
    }
    .toast-icon {
      width: 18px; height: 18px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px;
    }
    .toast-success .toast-icon { background: rgba(34,197,94,0.2); color: #4ade80; }
    .toast-info    .toast-icon { background: rgba(59,130,246,0.2); color: #60a5fa; }
    .toast-warn    .toast-icon { background: rgba(234,179,8,0.2);  color: #facc15; }
    .toast-undo {
      margin-left: auto;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #93c5fd;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(147,197,253,0.3);
      background: transparent;
    }
    .toast-undo:hover { background: rgba(147,197,253,0.1); }

    /* Freshness pulsing dot */
    @keyframes fresh-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .fresh-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 999px;
      animation: fresh-pulse 2s ease-in-out infinite;
    }

    /* Skeleton loading */
    @keyframes skeleton-shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, rgba(55,65,81,0.4) 0%, rgba(75,85,99,0.6) 50%, rgba(55,65,81,0.4) 100%);
      background-size: 800px 100%;
      animation: skeleton-shimmer 1.4s infinite linear;
      border-radius: 4px;
    }

    /* Confidence-tier row wash */
    .signal-row.tier-elite td:first-child { box-shadow: inset 2px 0 0 rgba(34,197,94,0.6); }
    .signal-row.tier-elite { background-color: rgba(34,197,94,0.04) !important; }
    .signal-row.tier-strong td:first-child { box-shadow: inset 2px 0 0 rgba(234,179,8,0.5); }

    /* Glossary tooltip — element is styled here; the floating panel is portaled to body via JS
       (avoids clipping by table overflow / sticky headers). */
    [data-tip] { cursor: help; border-bottom: 1px dashed rgba(148,163,184,0.35); }
    #sf-tooltip {
      position: fixed;
      background: rgba(17,24,39,0.98);
      color: #e5e7eb;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.01em;
      max-width: 260px;
      border: 1px solid rgba(75,85,99,0.6);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }
    #sf-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* Command Palette */
    #sf-palette-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px);
      z-index: 150;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15vh;
    }
    #sf-palette-backdrop.open { display: flex; }
    #sf-palette {
      width: 92%;
      max-width: 560px;
      background: rgba(17,24,39,0.98);
      border: 1px solid rgba(75,85,99,0.6);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #sf-palette-input {
      background: transparent;
      border: none;
      outline: none;
      color: #f3f4f6;
      font-size: 15px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(75,85,99,0.4);
    }
    #sf-palette-input::placeholder { color: #6b7280; }
    #sf-palette-results {
      max-height: 60vh;
      overflow-y: auto;
      padding: 6px;
    }
    .sf-palette-group {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      padding: 8px 12px 4px;
      font-weight: 600;
    }
    .sf-palette-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      color: #d1d5db;
      cursor: pointer;
      font-size: 13px;
    }
    .sf-palette-item.active,
    .sf-palette-item:hover {
      background: rgba(59, 130, 246, 0.15);
      color: #eff6ff;
    }
    .sf-palette-item .sf-palette-kind {
      margin-left: auto;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
    }
    .sf-palette-item .sf-palette-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
    }
    .sf-palette-hint {
      padding: 8px 12px;
      font-size: 10px;
      color: #6b7280;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid rgba(75,85,99,0.4);
      background: rgba(0,0,0,0.2);
    }
    .sf-kbd {
      background: rgba(75,85,99,0.4);
      color: #d1d5db;
      padding: 1px 6px;
      border-radius: 3px;
      font-family: ui-monospace, monospace;
      font-size: 10px;
    }
    .signal-row.removing {
      opacity: 0.5;
      animation: slideOut 0.3s ease forwards;
    }
    @keyframes slideOut {
      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }
    .delete-btn {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .signal-row:hover .delete-btn {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-gray-900 text-white m-0 p-0 flex flex-col h-screen w-screen">
  <!-- Persistent top navigation. Server-rendered shell; JS updates the active tab
       state based on Dashboard.view. Cmd+K still opens the palette from anywhere. -->
  <nav id="top-nav" class="flex-shrink-0 h-12 bg-gray-950/95 backdrop-blur border-b border-gray-800 flex items-center gap-6 px-6 z-30">
    <a href="#" onclick="dashboard.setView('dashboard'); return false;" class="flex items-center gap-2 group">
      <span class="w-6 h-6 rounded-md bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-[11px] font-bold text-white group-hover:scale-105 transition">DQ</span>
      <span class="font-semibold tracking-tight text-gray-100">Data Quant</span>
    </a>
    <div id="region-toggle" class="flex items-center gap-0.5 text-[11px] bg-gray-900 rounded-md p-0.5 ring-1 ring-gray-800">
      <a href="/dashboard" data-region="us" class="px-2 py-0.5 rounded transition">🇺🇸 US</a>
      <a href="/in/dashboard" data-region="in" class="px-2 py-0.5 rounded transition">🇮🇳 India</a>
    </div>
    <script>
      (function () {
        var inView = location.pathname.startsWith('/in');
        document.querySelectorAll('#region-toggle a').forEach(function (a) {
          var active = (a.dataset.region === 'in') === inView;
          a.className += active ? ' bg-gray-800 text-gray-100 font-semibold' : ' text-gray-500 hover:text-gray-300';
        });
      })();
    </script>
    <div id="top-nav-tabs" class="flex items-center gap-1"></div>
    <div class="ml-auto flex items-center gap-4">
      <div id="top-nav-status" class="text-[11px] text-gray-500"></div>
      <button onclick="dashboard.openPalette()" class="text-[11px] text-gray-500 hover:text-gray-300 transition inline-flex items-center gap-1.5" title="Command palette (Cmd+K)">
        <span class="sf-kbd" style="font-size:9px;">⌘K</span>
        <span>Jump</span>
      </button>
    </div>
  </nav>
  <div id="container" class="flex flex-1 min-h-0 bg-gray-900">
    <div id="app" class="flex-1 overflow-auto" data-keep-scroll="app"></div>
    <div id="drawer" class="relative bg-gray-800 border-l border-gray-700 shadow-lg" style="width: 0px; overflow: hidden; transition: width 0.2s ease;"></div>
  </div>
  <div id="toast-stack" aria-live="polite" role="status"></div>
  <div id="sf-tooltip" role="tooltip"></div>
  <div id="sf-palette-backdrop" role="dialog" aria-modal="true" aria-label="Command palette">
    <div id="sf-palette">
      <input id="sf-palette-input" type="text" placeholder="Jump to symbol, run action…" autocomplete="off" spellcheck="false" />
      <div id="sf-palette-results"></div>
      <div class="sf-palette-hint">
        <span><span class="sf-kbd">↑</span> <span class="sf-kbd">↓</span> navigate · <span class="sf-kbd">↵</span> select · <span class="sf-kbd">esc</span> close</span>
        <span>Cmd+K</span>
      </div>
    </div>
  </div>
  <script>
    // Body-level tooltip portal for [data-tip] elements. Delegated so
    // dynamic re-renders (Dashboard.render()) don't lose handlers.
    (function() {
      const tip = document.getElementById('sf-tooltip');
      let currentTarget = null;
      function positionTip(target) {
        const r = target.getBoundingClientRect();
        // measure tooltip to center it horizontally over the target
        const tr = tip.getBoundingClientRect();
        let left = r.left + r.width / 2 - tr.width / 2;
        let top = r.top - tr.height - 6;
        // clamp to viewport
        const pad = 6;
        if (left < pad) left = pad;
        if (left + tr.width > window.innerWidth - pad) left = window.innerWidth - tr.width - pad;
        if (top < pad) top = r.bottom + 6; // flip below if it would go off top
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
      }
      document.addEventListener('mouseover', (e) => {
        const t = e.target.closest('[data-tip]');
        if (!t || t === currentTarget) return;
        currentTarget = t;
        tip.textContent = t.getAttribute('data-tip') || '';
        tip.classList.add('visible');
        // Position twice: first to establish size, then to center accurately.
        positionTip(t);
        requestAnimationFrame(() => positionTip(t));
      });
      document.addEventListener('mouseout', (e) => {
        const t = e.target.closest('[data-tip]');
        if (!t) return;
        // Only hide if we're leaving to something outside the tipped element
        if (t.contains(e.relatedTarget)) return;
        currentTarget = null;
        tip.classList.remove('visible');
      });
      // Also hide on scroll — otherwise a stale tip lingers over the wrong element
      window.addEventListener('scroll', () => {
        currentTarget = null;
        tip.classList.remove('visible');
      }, true);
    })();
  </script>

  <script>
    // Region is decided by the URL: /in/* → Indian (NSE) view (₹, IST hours),
    // everything else → US ($). Scopes every region-aware API call and currency.
    const REGION = location.pathname.startsWith('/in') ? 'in' : 'us';
    const CUR = REGION === 'in' ? '₹' : '$';
    const REGION_Q = 'region=' + REGION;

    class Dashboard {
      constructor() {
        // Persisted preferences — pulled from localStorage with fallbacks
        const prefs = this.loadPrefs();
        this.signals = [];
        this.lists = [];                                        // [{id, name, order, count}]
        this.activeListId = localStorage.getItem('activeListId') || null;
        this.shortlist = [];                                    // items of the active list only
        this.loading = true;
        this.scanning = false;
        this.filtering = '';
        this.minConfidence = prefs.minConfidence ?? 85;
        this.lookbackDays = prefs.lookbackDays ?? 3; // breakout lookback window (days)
        // Multi-sort: ordered {key, dir} list — first entry is the primary sort,
        // the rest break ties. Click replaces the primary (previous keys demote
        // to tie-breakers); shift-click adds/flips a secondary. Migrates the
        // legacy single sortBy/sortDirection pref.
        this.sortKeys = Array.isArray(prefs.sortKeys) && prefs.sortKeys.length
          ? prefs.sortKeys.filter(k => k && k.key)
          : [{ key: prefs.sortBy ?? 'confidence', dir: prefs.sortDirection ?? 'desc' }];
        this.selectedAsset = null;
        this.currentAssetIndex = 0;
        this._chartToken = 0;
        // KLineCharts instances: drawer thumbnail + full chart page. Elements are
        // tracked so klinecharts.dispose(el) can run before innerHTML wipes them.
        this._drawerKline = null; this._drawerKlineEl = null;
        this._pageKline = null; this._pageKlineEl = null;
        this._pageChartToken = 0;
        this.chartAsset = null;
        this._chartKey = null;          // asset|range|tf|ma50|ma200 — rebuild guard
        this._chartReturnView = 'dashboard';
        let cr = '6m', ctf = 'd';
        try {
          cr = localStorage.getItem('dq-chart-range') || '6m';
          ctf = localStorage.getItem('dq-chart-tf') || 'd';
        } catch (e) {}
        this.chartRange = ['3m', '6m', '1y', '2y'].includes(cr) ? cr : '6m';
        this.chartTf = ['d', 'w'].includes(ctf) ? ctf : 'd';
        this.chartMA50 = true;
        this.chartMA200 = true;
        this._basesCache = null;    // { asset, data } — /api/bases result (null data = unavailable)
        this._showAllBases = false; // Base X-ray card-list expander
        // Admin (Clerk private metadata admin:"true") — gates the "Tweet" button.
        this.isAdmin = false;
        fetch('/api/admin/status').then(r => r.json()).then(d => { this.isAdmin = !!d.isAdmin; this.fmpDisabled = !!d.fmpDisabled; }).catch(() => {});
        this.drawerWidth = localStorage.getItem('drawerWidth') ? parseInt(localStorage.getItem('drawerWidth')) : 384;
        this._isResizing = false;
        this.signalTypeFilter = prefs.signalTypeFilter ?? 'breakout';
        // Quality filters (AND semantics): VCP shape, blue-sky base, RS leaders
        this.qualityFilters = prefs.qualityFilters ?? { vcp: false, blueSky: false, leaders: false };
        this.sectorFilter = prefs.sectorFilter ?? 'all';
        this.assetTypeFilter = prefs.assetTypeFilter ?? 'all';
        this._searchDebounceTimer = null;
        this.showShortlist = false;
        this.lastFetchAt = null;      // freshness dot input
        this._removedHistory = [];    // for undo toast
        this._sparklines = {};        // symbol -> number[]
        this._sparkFetching = false;
        // View routing — single source of truth. Legacy showBacktest/showShortlist
        // getters below stay so existing checks (e.g. skipping renders during
        // signal fetches) continue to work.
        this.view = 'dashboard';      // 'dashboard' | 'backtest' | 'shortlist' | 'winners'
        this.backtest = null;
        this.backtestLoading = false;
        this.backtestParams = { type: 'Type1', lookback: 30, horizon: 30 };
        this.winners = null;
        this.winnersLoading = false;
        this.beatRaise = null;
        this.beatRaiseLoading = false;
        this.trackingSignals = [];   // stale extensions (>5d past breakout) — collapsed section
        this._showTracking = false;
        this.sectorStrength = null;  // /api/sector-strength payload
        this.sectorStrengthLoading = false;
        this.unusualVolume = null;
        this.unusualVolumeLoading = false;
        this.unusualVolumeDate = null; // null = latest scan day
        this.winnersFilter = { tier: 'all', screen: 'setup', window: '1m', asset: '' }; // screen: 'setup' | 'moving'; window: '1w' | '1m' | '3m'; asset: substring filter
        this.init();
      }

      // Back-compat shims for existing code that reads showBacktest/showShortlist.
      get showBacktest() { return this.view === 'backtest'; }
      set showBacktest(v) { if (v) this.view = 'backtest'; else if (this.view === 'backtest') this.view = 'home'; }
      get showShortlist() { return this.view === 'shortlist'; }
      set showShortlist(v) { if (v) this.view = 'shortlist'; else if (this.view === 'shortlist') this.view = 'dashboard'; }

      setView(name) {
        const valid = ['dashboard', 'backtest', 'shortlist', 'winners', 'beat-raise', 'unusual-volume', 'sectors'];
        // Silently redirect legacy 'home' to dashboard so old bookmarks/palette entries still work.
        if (name === 'home') name = 'dashboard';
        if (!valid.includes(name)) return;
        this.view = name;
        this.closeDrawer();
        if (name === 'backtest' && !this.backtest && !this.backtestLoading) {
          this.fetchBacktest();
        } else if (name === 'winners' && !this.winners && !this.winnersLoading) {
          this.fetchWinners();
        } else if (name === 'beat-raise' && !this.beatRaise && !this.beatRaiseLoading) {
          this.fetchBeatRaise();
        } else if (name === 'unusual-volume' && !this.unusualVolume && !this.unusualVolumeLoading) {
          this.fetchUnusualVolume();
        } else if (name === 'sectors' && !this.sectorStrength && !this.sectorStrengthLoading) {
          this.fetchSectorStrength();
        } else {
          this.render();
        }
      }

      async fetchSectorStrength() {
        this.sectorStrengthLoading = true;
        this.render();
        try {
          const res = await fetch(`/api/sector-strength?${REGION_Q}`);
          if (!res.ok) throw new Error('sector strength fetch failed');
          this.sectorStrength = await res.json();
        } catch (err) {
          console.error('Sector strength fetch failed:', err);
          this.toast('Sector strength fetch failed', { kind: 'warn' });
          this.sectorStrength = null;
        } finally {
          this.sectorStrengthLoading = false;
          this.render();
        }
      }

      async fetchWinners() {
        this.winnersLoading = true;
        this.render();
        try {
          const { screen, window } = this.winnersFilter;
          const url = screen === 'moving'
            ? `/api/winners?type=moving&window=${window}&${REGION_Q}`
            : `/api/winners?type=setup&${REGION_Q}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('winners fetch failed');
          this.winners = await res.json();
        } catch (err) {
          console.error('Winners fetch failed:', err);
          this.toast('Winners fetch failed', { kind: 'warn' });
          this.winners = null;
        } finally {
          this.winnersLoading = false;
          this.render();
        }
      }

      async fetchBeatRaise() {
        this.beatRaiseLoading = true;
        this.render();
        try {
          const res = await fetch(`/api/beat-raise?${REGION_Q}`);
          if (!res.ok) throw new Error('beat-raise fetch failed');
          this.beatRaise = await res.json();
        } catch (err) {
          console.error('Beat & Raise fetch failed:', err);
          this.toast('Beat & Raise fetch failed', { kind: 'warn' });
          this.beatRaise = null;
        } finally {
          this.beatRaiseLoading = false;
          this.render();
        }
      }

      shiftUnusualVolumeDay(delta) {
        const base = this.unusualVolume?.date || this.unusualVolumeDate;
        if (!base) return;
        const d = new Date(`${base}T00:00:00`);
        d.setDate(d.getDate() + delta);
        const p = (n) => String(n).padStart(2, '0');
        this.fetchUnusualVolume(`${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`);
      }

      async fetchUnusualVolume(date) {
        if (date !== undefined) this.unusualVolumeDate = date; // '' or null resets to latest
        this.unusualVolumeLoading = true;
        this.render();
        try {
          const url = this.unusualVolumeDate ? `/api/unusual-volume?date=${this.unusualVolumeDate}&${REGION_Q}` : `/api/unusual-volume?${REGION_Q}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('unusual-volume fetch failed');
          this.unusualVolume = await res.json();
          this.unusualVolumeDate = this.unusualVolume.date; // adopt resolved day (latest when unset)
        } catch (err) {
          console.error('Unusual volume fetch failed:', err);
          this.toast('Unusual volume fetch failed', { kind: 'warn' });
          this.unusualVolume = null;
        } finally {
          this.unusualVolumeLoading = false;
          this.render();
        }
      }

      setWinnersTier(tier) {
        this.winnersFilter.tier = tier;
        this.render();
      }

      // Cross-view jumps. Pre-filter destination so the linked asset is the only row.
      jumpToSignal(asset, signalType) {
        this.setFilter('signalTypeFilter', signalType || 'all');
        this.filtering = asset || '';
        this.setView('dashboard');
        this.render();
      }
      jumpToWinner(asset) {
        this.winnersFilter.tier = 'all';
        this.winnersFilter.asset = asset || '';
        this.setView('winners');
      }

      // --- Cross-reference across the four list tabs ----------------------
      // All four datasets live in memory client-side, so "which lists is this
      // ticker in" is pure computation, no fetch. Returns matching list defs
      // (tab order) for a ticker. Membership is only as fresh as each list's
      // last fetch — prefetched at init(), refreshed via each tab's Refresh.
      listsFor(asset) {
        const a = (asset || '').toUpperCase();
        if (!a) return [];
        const defs = [
          { key: 'dashboard',      short: 'S', label: 'Signals',      cls: 'bg-sky-500/15 text-sky-300 ring-sky-500/30',
            has: (this.signals || []).some(s => (s.asset||'').toUpperCase() === a && s.confidence >= this.minConfidence) },
          { key: 'winners',        short: 'W', label: 'Winners',      cls: 'bg-green-500/15 text-green-400 ring-green-500/30',
            has: (this.winners?.winners || []).some(r => (r.asset||'').toUpperCase() === a) },
          { key: 'beat-raise',     short: 'B', label: 'Beat & Raise', cls: 'bg-purple-500/15 text-purple-300 ring-purple-500/30',
            has: (this.beatRaise?.stocks || []).some(s => (s.asset||'').toUpperCase() === a) },
          { key: 'unusual-volume', short: 'V', label: 'Unusual Vol',  cls: 'bg-orange-500/15 text-orange-300 ring-orange-500/30',
            has: (this.unusualVolume?.stocks || []).some(s => (s.asset||'').toUpperCase() === a) },
        ];
        return defs.filter(d => d.has);
      }

      // Compact letter chips for the OTHER lists a ticker appears in.
      // Non-interactive — the row click opens the drawer. `exclude` = own tab.
      crossRefPills(asset, ...exclude) {
        const lists = this.listsFor(asset).filter(l => !exclude.includes(l.key));
        if (!lists.length) return '';
        return `<span class="inline-flex gap-0.5 align-middle ml-1">` + lists.map(l =>
          `<span title="Also in ${l.label}" class="text-[9px] font-bold w-4 h-4 leading-none inline-flex items-center justify-center rounded ring-1 ${l.cls}">${l.short}</span>`
        ).join('') + `</span>`;
      }

      // Open the unified drawer for a ticker from any tab. Merges every list's
      // row for that ticker, signals winning on conflicts (it has the full
      // chart/levels data); other lists fill in price/sector when it's absent.
      openAsset(asset) {
        const a = (asset || '').toUpperCase();
        const pools = [this.signals || [], this.winners?.winners || [], this.beatRaise?.stocks || [], this.unusualVolume?.stocks || []];
        let best = null;
        for (const pool of pools) {
          const hit = pool.find(s => (s.asset||'').toUpperCase() === a);
          if (hit) best = { ...hit, ...best };
        }
        this.openDrawer(best || { asset });
      }

      // Navigate to a specific list tab focused on a ticker (drawer strip links).
      gotoList(key, asset) {
        if (key === 'winners') return this.jumpToWinner(asset);
        if (key === 'dashboard') return this.jumpToSignal(asset, 'all');
        this.setView(key); // beat-raise / unusual-volume have no per-asset filter
      }

      setWinnersScreen(screen) {
        if (this.winnersFilter.screen === screen) return;
        this.winnersFilter.screen = screen;
        this.winners = null;
        this.fetchWinners();
      }

      setWinnersWindow(window) {
        if (this.winnersFilter.window === window) return;
        this.winnersFilter.window = window;
        if (this.winnersFilter.screen === 'moving') {
          this.winners = null;
          this.fetchWinners();
        } else {
          this.render();
        }
      }

      async fetchBacktest() {
        this.backtestLoading = true;
        this.render();
        try {
          const p = this.backtestParams;
          const url = `/api/backtest?type=${p.type}&lookback=${p.lookback}&horizon=${p.horizon}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('backtest fetch failed');
          this.backtest = await res.json();
        } catch (err) {
          console.error('Backtest fetch failed:', err);
          this.toast('Backtest fetch failed', { kind: 'warn' });
          this.backtest = null;
        } finally {
          this.backtestLoading = false;
          this.render();
        }
      }

      openBacktest() {
        this.view = 'backtest';
        if (!this.backtest) this.fetchBacktest();
        else this.render();
      }

      closeBacktest() {
        this.view = 'dashboard';
        this.render();
      }

      setBacktestParam(key, value) {
        this.backtestParams[key] = value;
        this.fetchBacktest();
      }

      async fetchSparklines() {
        if (this._sparkFetching) return;
        const symbols = this.signals.map(s => s.asset).filter(Boolean);
        const needed = symbols.filter(s => !this._sparklines[s]);
        if (!needed.length) return;
        this._sparkFetching = true;
        try {
          const res = await fetch('/api/sparklines', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ symbols: needed }),
          });
          if (res.ok) {
            const data = await res.json();
            Object.assign(this._sparklines, data);
            if (!this.showBacktest) this.render();
          }
        } catch (e) { /* silent */ }
        finally { this._sparkFetching = false; }
      }

      renderSparkline(symbol) {
        const values = this._sparklines[symbol];
        if (!values || values.length < 2) {
          // subtle placeholder while fetching
          return '<span class="text-gray-700 text-xs font-mono">···</span>';
        }
        const w = 68, h = 22, pad = 1.5;
        const min = Math.min(...values), max = Math.max(...values);
        const range = max - min || 1;
        const step = (w - pad * 2) / (values.length - 1);
        const points = values.map((v, i) =>
          `${(pad + i * step).toFixed(1)},${(pad + (h - pad * 2) - ((v - min) / range) * (h - pad * 2)).toFixed(1)}`
        ).join(' ');
        const rising = values[values.length - 1] >= values[0];
        const stroke = rising ? '#4ade80' : '#f87171';
        const areaFill = rising ? 'rgba(74,222,128,0.12)' : 'rgba(248,113,113,0.12)';
        const areaPoints = `${pad},${(h - pad).toFixed(1)} ${points} ${(w - pad).toFixed(1)},${(h - pad).toFixed(1)}`;
        return `<svg width="${w}" height="${h}" style="display:block" aria-hidden="true">
          <polyline points="${areaPoints}" fill="${areaFill}" stroke="none"/>
          <polyline points="${points}" fill="none" stroke="${stroke}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>`;
      }

      loadPrefs() {
        try {
          const raw = localStorage.getItem('sf_prefs_v1');
          return raw ? JSON.parse(raw) : {};
        } catch { return {}; }
      }

      savePrefs() {
        try {
          localStorage.setItem('sf_prefs_v1', JSON.stringify({
            sortKeys: this.sortKeys,
            // legacy mirror so an old cached build still sorts sensibly
            sortBy: this.sortKeys?.[0]?.key,
            sortDirection: this.sortKeys?.[0]?.dir,
            signalTypeFilter: this.signalTypeFilter,
            assetTypeFilter: this.assetTypeFilter,
            sectorFilter: this.sectorFilter,
            minConfidence: this.minConfidence,
            lookbackDays: this.lookbackDays,
            qualityFilters: this.qualityFilters,
          }));
        } catch {}
      }

      toast(message, opts = {}) {
        const stack = document.getElementById('toast-stack');
        if (!stack) return;
        const kind = opts.kind || 'info'; // 'success' | 'info' | 'warn'
        const icon = kind === 'success' ? '✓' : kind === 'warn' ? '!' : 'i';
        const el = document.createElement('div');
        el.className = `toast toast-${kind}`;
        const undoHtml = opts.undo
          ? `<button class="toast-undo" onclick="this.parentElement.classList.add('leaving'); (${opts.undo.toString()})(); setTimeout(() => this.parentElement.remove(), 180);">Undo</button>`
          : '';
        el.innerHTML = `<span class="toast-icon">${icon}</span><span>${message}</span>${undoHtml}`;
        stack.appendChild(el);
        const life = opts.duration || (opts.undo ? 4500 : 2200);
        setTimeout(() => {
          el.classList.add('leaving');
          setTimeout(() => el.remove(), 200);
        }, life);
      }

      // ==== Command palette (Cmd+K) ====
      openPalette() {
        const backdrop = document.getElementById('sf-palette-backdrop');
        const input = document.getElementById('sf-palette-input');
        if (!backdrop || !input) return;
        this._paletteIndex = 0;
        this._paletteQuery = '';
        backdrop.classList.add('open');
        input.value = '';
        this.renderPalette();
        setTimeout(() => input.focus(), 0);
      }

      closePalette() {
        const backdrop = document.getElementById('sf-palette-backdrop');
        if (backdrop) backdrop.classList.remove('open');
      }

      getPaletteItems() {
        // Assets (sorted by confidence desc for practical relevance)
        const assets = [...this.signals]
          .sort((a, b) => b.confidence - a.confidence)
          .map(s => ({
            kind: 'asset',
            id: 'asset:' + s.asset,
            label: s.asset,
            desc: `${s.signalType} · ${s.confidence}% · ${s.sector || '—'}`,
            signal: s,
            search: `${s.asset} ${s.sector || ''} ${s.industry || ''}`.toLowerCase(),
            run: () => { this.openDrawer(s); this.closePalette(); },
          }));
        // Filter actions
        const actions = [
          { id: 'sig:breakout',  label: 'Filter: Actionable breakouts', desc: 'Fresh breakouts from a clean base', kind: 'filter', run: () => { this.setFilter('signalTypeFilter', 'breakout'); this.closePalette(); this.toast('Filter → Actionable', { kind: 'info' }); } },
          { id: 'sig:setup',     label: 'Filter: Setups',     desc: 'Show pre-breakout Type 2 setups', kind: 'filter', run: () => { this.setFilter('signalTypeFilter', 'setup'); this.closePalette(); this.toast('Filter → Setups', { kind: 'info' }); } },
          { id: 'sig:extension', label: 'Filter: Extensions',           desc: 'Continuation of a recent breakout', kind: 'filter', run: () => { this.setFilter('signalTypeFilter', 'extension'); this.closePalette(); this.toast('Filter → Extension', { kind: 'info' }); } },
          { id: 'ast:all',       label: 'Show: All assets',   desc: 'Stocks + ETFs', kind: 'filter', run: () => { this.setFilter('assetTypeFilter', 'all'); this.closePalette(); } },
          { id: 'ast:stock',     label: 'Show: Stocks only',  desc: '', kind: 'filter', run: () => { this.setFilter('assetTypeFilter', 'stock'); this.closePalette(); } },
          { id: 'ast:etf',       label: 'Show: ETFs only',    desc: '', kind: 'filter', run: () => { this.setFilter('assetTypeFilter', 'etf'); this.closePalette(); } },
          { id: 'reset',         label: 'Reset all filters',  desc: 'Back to defaults', kind: 'action', run: () => { this.resetFilters(); this.closePalette(); } },
          { id: 'dashboard',     label: 'Open Dashboard',     desc: 'Live signals table', kind: 'action', run: () => { this.setView('dashboard'); this.closePalette(); } },
          { id: 'shortlist',     label: 'Open Shortlist',     desc: '', kind: 'action', run: () => { this.setView('shortlist'); this.closePalette(); } },
          { id: 'backtest',      label: 'Open Backtest',      desc: 'Historical performance of past signals', kind: 'action', run: () => { this.setView('backtest'); this.closePalette(); } },
          { id: 'scan',          label: 'Trigger scan now',   desc: 'Runs a fresh scan in the background', kind: 'action', run: async () => {
            this.closePalette();
            this.toast('Scan started…', { kind: 'info' });
            try { await fetch('/api/scan', { method: 'POST' }); this.toast('Scan running in background', { kind: 'success' }); }
            catch { this.toast('Scan failed to start', { kind: 'warn' }); }
          }},
        ].map(a => ({ ...a, search: (a.label + ' ' + (a.desc || '')).toLowerCase() }));
        return { assets, actions };
      }

      renderPalette() {
        const el = document.getElementById('sf-palette-results');
        if (!el) return;
        const q = (this._paletteQuery || '').trim().toLowerCase();
        const { assets, actions } = this.getPaletteItems();
        const match = it => !q || it.search.includes(q);
        // fuzzy-ish score: exact prefix > substring; assets scored on ticker only
        const scored = (items, tickerField) => items
          .filter(match)
          .map(it => {
            const t = (tickerField ? it.label.toLowerCase() : it.search);
            const score = !q ? 0
              : t.startsWith(q) ? 3
              : t.split(/\s+/).some(w => w.startsWith(q)) ? 2
              : 1;
            return { it, score };
          })
          .sort((a, b) => b.score - a.score)
          .map(x => x.it);
        const matchedAssets = scored(assets, true).slice(0, q ? 12 : 6);
        const matchedActions = scored(actions, false);
        const items = [];
        if (matchedActions.length) items.push({ group: 'Actions' }, ...matchedActions);
        if (matchedAssets.length) items.push({ group: 'Assets' }, ...matchedAssets);
        this._paletteFlat = items.filter(x => !x.group); // only selectable items
        if (this._paletteIndex >= this._paletteFlat.length) this._paletteIndex = 0;
        el.innerHTML = items.length === 0
          ? '<div class="sf-palette-group">No results</div>'
          : items.map(it => {
            if (it.group) return `<div class="sf-palette-group">${it.group}</div>`;
            const flatIdx = this._paletteFlat.indexOf(it);
            const active = flatIdx === this._paletteIndex ? 'active' : '';
            const badge = it.kind === 'asset'
              ? `<span class="sf-palette-badge" style="background:rgba(59,130,246,0.15);color:#93c5fd">${it.signal.confidence}%</span>`
              : '';
            return `
              <div class="sf-palette-item ${active}" data-idx="${flatIdx}" onclick="dashboard._paletteFlat[${flatIdx}].run()">
                ${badge}
                <div>
                  <div style="color:#f3f4f6;font-weight:500">${it.label}</div>
                  ${it.desc ? `<div style="font-size:11px;color:#9ca3af">${it.desc}</div>` : ''}
                </div>
                <span class="sf-palette-kind">${it.kind}</span>
              </div>
            `;
          }).join('');
        // Scroll active into view
        const activeEl = el.querySelector('.sf-palette-item.active');
        if (activeEl && activeEl.scrollIntoView) activeEl.scrollIntoView({ block: 'nearest' });
      }

      // Top nav — active-tab state + right-side status. Injected on every render.
      renderNavBar() {
        const tabsEl = document.getElementById('top-nav-tabs');
        const statusEl = document.getElementById('top-nav-status');
        if (!tabsEl || !statusEl) return;
        const tabs = [
          { key: 'dashboard', label: 'Signals' },
          { key: 'winners',   label: 'Winners' },
          { key: 'beat-raise', label: 'Beat & Raise' },
          { key: 'unusual-volume', label: 'Unusual Volume' },
          { key: 'sectors',   label: 'Sectors' },
          { key: 'backtest',  label: 'Backtest' },
          { key: 'shortlist', label: 'Shortlist' },
        ];
        tabsEl.innerHTML = tabs.map(t => {
          const active = this.view === t.key;
          return `
            <button onclick="dashboard.setView('${t.key}')"
              class="px-3 py-1 rounded-md text-xs font-medium transition ${active ? 'bg-gray-800 text-white ring-1 ring-gray-700' : 'text-gray-400 hover:text-white'}">
              ${t.label}
            </button>
          `;
        }).join('');
        // Compact freshness dot in status area
        const mostRecent = this.signals.reduce((max, s) => {
          const t = new Date(s.createdAt).getTime();
          return t > max ? t : max;
        }, 0);
        if (mostRecent) {
          const ageMin = (Date.now() - mostRecent) / 60000;
          const color = ageMin < 20 ? '#4ade80' : ageMin < 40 ? '#facc15' : '#f87171';
          const label = ageMin < 1 ? 'just now'
            : ageMin < 60 ? `${Math.round(ageMin)}m`
            : `${Math.round(ageMin / 60)}h`;
          statusEl.innerHTML = `<span class="inline-flex items-center gap-1.5"><span class="fresh-dot" style="background:${color}"></span>Last scan <span class="text-gray-300">${label}</span> ago</span>`;
        } else {
          statusEl.innerHTML = '';
        }
      }

      freshnessDot() {
        if (!this.lastFetchAt) return '';
        const mostRecent = this.signals.reduce((max, s) => {
          const t = new Date(s.createdAt).getTime();
          return t > max ? t : max;
        }, 0);
        if (!mostRecent) return '';
        const ageMin = (Date.now() - mostRecent) / 60000;
        const color = ageMin < 20 ? '#4ade80' : ageMin < 40 ? '#facc15' : '#f87171';
        const label = ageMin < 1 ? 'just now'
          : ageMin < 60 ? `${Math.round(ageMin)}m ago`
          : `${Math.round(ageMin / 60)}h ago`;
        const title = `Most recent signal · ${new Date(mostRecent).toLocaleTimeString()}`;
        return `
          <span class="inline-flex items-center gap-1.5 text-[11px] text-gray-400" title="${title}">
            <span class="fresh-dot" style="background:${color}"></span>
            <span>Last scan <span class="text-gray-300 font-medium">${label}</span></span>
          </span>
        `;
      }

      async init() {
        const signalsReady = this.fetchSignals();
        // Deep link from X posts (dataquant.ai/$hpe): open that ticker's drawer
        // once signals load.
        // Both deep-link shapes: /$NVDA and the cashtag-free /s/NVDA used in tweets
        const deepLink = decodeURIComponent(location.pathname).match(/\/(?:\$|s\/)([A-Za-z.\-]+)/);
        if (deepLink) signalsReady.then(() => this.openAsset(deepLink[1]));
        this.fetchShortlistLists();
        // Prefetch the other lists so cross-reference chips are accurate on
        // any tab without visiting each first. ponytail: one-shot; each list
        // refreshes via its own Refresh button, not on a timer.
        this.fetchWinners();
        this.fetchBeatRaise();
        this.fetchUnusualVolume();
        setInterval(() => this.fetchSignals(), 5000);
        setInterval(() => { if (!this.showBacktest) this.render(); }, 60_000); // keep freshness dot label current

        // Close palette when clicking outside the panel
        const backdrop = document.getElementById('sf-palette-backdrop');
        if (backdrop) {
          backdrop.addEventListener('click', (e) => {
            if (e.target === backdrop) this.closePalette();
          });
        }

        // Command palette input: intercept nav keys before the global handler
        const paletteInput = document.getElementById('sf-palette-input');
        if (paletteInput) {
          paletteInput.addEventListener('input', (e) => {
            this._paletteQuery = e.target.value;
            this._paletteIndex = 0;
            this.renderPalette();
          });
          paletteInput.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') {
              e.preventDefault();
              if (this._paletteFlat?.length) {
                this._paletteIndex = (this._paletteIndex + 1) % this._paletteFlat.length;
                this.renderPalette();
              }
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              if (this._paletteFlat?.length) {
                this._paletteIndex = (this._paletteIndex - 1 + this._paletteFlat.length) % this._paletteFlat.length;
                this.renderPalette();
              }
            } else if (e.key === 'Enter') {
              e.preventDefault();
              const item = this._paletteFlat?.[this._paletteIndex];
              if (item) item.run();
            } else if (e.key === 'Escape') {
              e.preventDefault();
              this.closePalette();
            }
          });
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
          // Cmd+K / Ctrl+K: open command palette from anywhere
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            this.openPalette();
            return;
          }

          // ESC works from search input too — lets you back out quickly
          if (e.code === 'Escape') {
            const backdrop = document.getElementById('sf-palette-backdrop');
            if (backdrop?.classList.contains('open')) {
              this.closePalette();
              return;
            }
            const tagEsc = e.target?.tagName;
            if (tagEsc === 'INPUT' && e.target.id === 'search-input') {
              e.target.blur();
              return;
            }
            if (this.view === 'chart') {
              this.backFromChart();
              return;
            }
            this.closeDrawer();
            return;
          }

          const tag = e.target?.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target?.isContentEditable) return;

          // "/" focuses search — same idiom as gh, gmail, slack
          if (e.key === '/') {
            e.preventDefault();
            const s = document.getElementById('search-input');
            if (s) { s.focus(); s.select(); }
            return;
          }

          // 1/2/3/4 toggle the signal type filter quickly
          const signalKeyMap = { '1': 'breakout', '2': 'setup', '3': 'extension', '4': 'stopped' };
          if (signalKeyMap[e.key]) {
            this.setFilter('signalTypeFilter', signalKeyMap[e.key]);
            return;
          }

          // "c": jump to the full chart of whatever is in focus — the open
          // drawer's asset, or (already on the chart page) a no-op.
          if (e.key === 'c' && this.selectedAsset && this.view !== 'chart') {
            this.openChartView(this.selectedAsset.asset);
            return;
          }

          // Nav list depends on which view is active: shortlist vs main table.
          // Without this, pressing space in the shortlist would jump into the dashboard's filtered signals.
          const navList = this.getNavList();
          if (!navList.length) return;

          // Chart page: space/arrows flip to the next/prev asset's chart in the
          // same list order as the drawer. Index re-syncs from chartAsset so
          // navigation stays correct however the chart was opened.
          if (this.view === 'chart') {
            const step =
              e.code === 'Space' || e.code === 'ArrowRight' ? 1
              : e.code === 'ArrowLeft' ? -1
              : 0;
            if (!step) return;
            e.preventDefault();
            const idx = navList.findIndex(s => s.asset === this.chartAsset);
            const cur = idx >= 0 ? idx : this.currentAssetIndex;
            this.currentAssetIndex = (cur + step + navList.length) % navList.length;
            this.openChartView(navList[this.currentAssetIndex].asset);
            return;
          }

          // Re-sync from the drawer that's actually open: openAsset (row
          // clicks) never updates currentAssetIndex, so stepping from the
          // stale value jumped to an unrelated ticker on the first keypress.
          const openAssetName = this.selectedAsset?.asset;
          if (openAssetName) {
            const oi = navList.findIndex(s => s.asset === openAssetName);
            if (oi >= 0) this.currentAssetIndex = oi;
          }
          if (this.currentAssetIndex >= navList.length) this.currentAssetIndex = 0;

          // openAsset (not openDrawer) so tickers that only exist in the
          // Winners/B&R/UV pools still get their full merged drawer data.
          if (e.code === 'Space') {
            e.preventDefault();
            this.currentAssetIndex = (this.currentAssetIndex + 1) % navList.length;
            this.openAsset(navList[this.currentAssetIndex].asset);
          } else if (e.code === 'ArrowLeft') {
            this.currentAssetIndex = (this.currentAssetIndex - 1 + navList.length) % navList.length;
            this.openAsset(navList[this.currentAssetIndex].asset);
          } else if (e.code === 'ArrowRight') {
            this.currentAssetIndex = (this.currentAssetIndex + 1) % navList.length;
            this.openAsset(navList[this.currentAssetIndex].asset);
          }
        });

        // Drawer resize handling
        document.addEventListener('mousedown', (e) => {
          if (e.target.id === 'drawer-resize-handle') {
            this._isResizing = true;
            document.body.classList.add('resizing');
            e.preventDefault();
          }
        });

        document.addEventListener('mousemove', (e) => {
          if (!this._isResizing) return;
          const newWidth = Math.max(300, Math.min(900, window.innerWidth - e.clientX));
          this.drawerWidth = newWidth;
          localStorage.setItem('drawerWidth', newWidth);
          const drawer = document.getElementById('drawer');
          if (drawer) drawer.style.width = newWidth + 'px';
        });

        document.addEventListener('mouseup', () => {
          if (this._isResizing) {
            this._isResizing = false;
            document.body.classList.remove('resizing');
          }
        });

        this.render();
      }

      // Market regime gauge — 15-min server cache, so refetch sparingly.
      async fetchMarketHealth() {
        if (this._marketHealthAt && Date.now() - this._marketHealthAt < 10 * 60 * 1000) return;
        this._marketHealthAt = Date.now();
        try {
          const res = await fetch(`/api/market-health?${REGION_Q}`);
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.regime) {
            const changed = !this.marketHealth || this.marketHealth.score !== data.score;
            this.marketHealth = data;
            if (changed && !this.showBacktest) this.render();
          }
        } catch (e) { /* gauge is advisory — never break the dashboard */ }
      }

      marketHealthPill() {
        const mh = this.marketHealth;
        if (!mh) return '';
        const c = mh.components || {};
        const style = mh.regime === 'risk-on'
          ? 'bg-green-500/15 text-green-400 ring-green-500/30'
          : mh.regime === 'caution'
            ? 'bg-amber-500/15 text-amber-300 ring-amber-500/30'
            : 'bg-red-500/15 text-red-400 ring-red-500/30';
        const label = mh.regime === 'risk-on' ? 'Risk-on' : mh.regime === 'caution' ? 'Caution' : 'Risk-off';

        // Per-benchmark trend, in words
        const trendLine = (name, g) => {
          const bits = [];
          bits.push(g.aboveMA50 ? 'above its 50-day' : 'below its 50-day');
          bits.push(g.aboveMA200 ? 'above its 200-day' : 'below its 200-day');
          bits.push(g.ma50Rising ? 'trend rising' : 'trend flat/falling');
          const ok = g.aboveMA50 && g.aboveMA200 && g.ma50Rising;
          return `<div class="flex justify-between gap-3"><span class="text-gray-400 font-mono">${name}</span><span class="${ok ? 'text-green-400' : 'text-amber-300'} text-right">${bits.join(', ')}</span></div>`;
        };
        const trendRows = c.trend?.perBenchmark
          ? Object.entries(c.trend.perBenchmark).map(([b, g]) => trendLine(b, g)).join('')
          : '';
        const dd = c.distribution?.days ?? 0;
        const ddPer = c.distribution?.perBenchmark
          ? Object.entries(c.distribution.perBenchmark).map(([b, d]) => `${b} ${d}`).join(' · ')
          : '';
        const breadthPct = c.breadth?.pctPositive1m;

        const row = (title, score, max, body) => `
          <div class="border-t border-gray-700/50 pt-2.5 mt-2.5">
            <div class="flex justify-between items-baseline mb-1">
              <span class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">${title}</span>
              <span class="font-mono text-xs ${score >= max * 0.7 ? 'text-green-400' : score >= max * 0.35 ? 'text-amber-300' : 'text-red-400'}">${score}/${max}</span>
            </div>
            <div class="text-[12px] text-gray-300 leading-relaxed">${body}</div>
          </div>`;

        const panel = !this._showMarketHealth ? '' : `
          <div class="absolute left-0 top-full mt-2 z-40 w-[26rem] max-w-[92vw] bg-gray-800 ring-1 ring-gray-600/80 rounded-lg shadow-xl p-4 text-left cursor-default" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start">
              <div>
                <div class="font-bold text-white">Market: ${label} · ${mh.score}<span class="text-gray-500 font-normal">/100</span></div>
                <div class="text-[12px] text-gray-300 mt-0.5">${mh.advice}</div>
              </div>
              <button onclick="dashboard.toggleMarketHealth(); event.stopPropagation();" class="text-gray-500 hover:text-white transition ml-2">✕</button>
            </div>
            ${row('Trend', c.trend?.score ?? 0, 50, `${trendRows || 'Benchmark trend vs the 50 and 200-day averages.'}`)}
            ${row('Distribution days', c.distribution?.score ?? 0, 25, `
              <span class="${dd >= 4 ? 'text-red-400 font-semibold' : ''}">${dd} in the last 25 sessions</span>${ddPer ? ` <span class="text-gray-500">(${ddPer})</span>` : ''}.
              Days the index fell on <em>rising</em> volume — institutions selling into strength. 4+ is a warning even while price holds up.`)}
            ${row('Breadth', c.breadth?.score ?? 0, 25, breadthPct != null
              ? `${breadthPct}% of the ${(c.breadth?.universe || 0).toLocaleString()} stocks we scan are positive over the last month${c.breadth?.pctPositive1w != null ? `, ${c.breadth.pctPositive1w}% over the last week` : ''} — the average stock's tape, not the index's.${c.breadth?.direction === 'deteriorating' ? ' <span class="text-red-400 font-semibold">Short-term weaker than the month — breadth is deteriorating.</span>' : c.breadth?.direction === 'improving' ? ' <span class="text-green-400 font-semibold">Short-term stronger than the month — breadth is improving.</span>' : ''}`
              : 'Populating — appears after the next scan cycles.')}
            <div class="border-t border-gray-700/50 mt-2.5 pt-2 text-[11px] text-gray-500">
              ≥70 risk-on · 45–69 caution · &lt;45 risk-off · benchmark ${mh.benchmark} · as of ${mh.asOf}
            </div>
          </div>`;

        return `<span class="relative inline-block">
          <button onclick="dashboard.toggleMarketHealth()" class="badge ${style} ring-1 font-semibold cursor-pointer hover:brightness-125 transition" title="${mh.advice} Click for the breakdown."><span class="badge-dot"></span>Market: ${label} · ${mh.score} <span class="opacity-60 ml-0.5">${this._showMarketHealth ? '▴' : '▾'}</span></button>
          ${panel}
        </span>`;
      }

      toggleMarketHealth() {
        this._showMarketHealth = !this._showMarketHealth;
        this.render();
      }

      // Chart-page ticker typeahead: any symbol, flagged by the agent or not.
      // Custom dropdown (native datalist is unstylable): filters known assets
      // as you type, ↑↓/Enter/Esc handled locally so the global shortcuts
      // (space-nav, esc-back) never fire mid-typing.
      _chartSearchIndex() {
        if (this._csIndex && this._csIndexAt === this.lastFetchAt) return this._csIndex;
        const m = new Map();
        for (const s of [...(this.signals || []), ...(this.trackingSignals || [])]) {
          if (!m.has(s.asset)) m.set(s.asset, { sector: s.sector, type: s.signalType });
        }
        for (const i of this.shortlist || []) {
          if (!m.has(i.asset)) m.set(i.asset, { sector: null, type: 'shortlist' });
        }
        this._csIndex = [...m.entries()].map(([asset, x]) => ({ asset, ...x })).sort((a, b) => a.asset.localeCompare(b.asset));
        this._csIndexAt = this.lastFetchAt;
        return this._csIndex;
      }

      chartSearchInput() {
        const q = (document.getElementById('chart-ticker-search')?.value || '').trim().toUpperCase();
        if (!q) { this.closeChartSearch(); return; }
        const idx = this._chartSearchIndex();
        const starts = idx.filter((x) => x.asset.startsWith(q));
        const contains = idx.filter((x) => !x.asset.startsWith(q) && x.asset.includes(q));
        const hits = [...starts, ...contains].slice(0, 7);
        const exact = hits.some((h) => h.asset === q);
        this._csState = { q, hits, active: 0, showRaw: !exact && /^[A-Z][A-Z0-9.\-^]{0,11}$/.test(q) };
        this._renderChartSearchDd();
      }

      _renderChartSearchDd() {
        const dd = document.getElementById('chart-search-dd');
        const st = this._csState;
        if (!dd || !st || (!st.hits.length && !st.showRaw)) { this.closeChartSearch(); return; }
        const badge = (t) => t === 'breakout' ? '<span class="text-[9px] font-bold text-green-400">BREAKOUT</span>'
          : t === 'setup' ? '<span class="text-[9px] font-bold text-blue-400">SETUP</span>'
          : t === 'extension' ? '<span class="text-[9px] font-bold text-yellow-400">EXT</span>'
          : t === 'shortlist' ? '<span class="text-[9px] font-bold text-amber-300">★</span>' : '';
        const rows = st.hits.map((h, i) => `
          <button onmousedown="event.preventDefault(); dashboard.selectChartSearch('${h.asset.replace(/'/g, "\\'")}')"
            class="w-full text-left px-3 py-2 flex items-center justify-between gap-2 ${i === st.active ? 'bg-blue-500/15' : 'hover:bg-gray-700/50'} transition">
            <span class="font-mono font-semibold text-sm text-white">${h.asset}</span>
            <span class="flex items-center gap-2 min-w-0">${h.sector && h.sector !== 'Unclassified' ? `<span class="text-[10px] text-gray-500 truncate">${h.sector}</span>` : ''}${badge(h.type)}</span>
          </button>`).join('');
        const raw = st.showRaw ? `
          <button onmousedown="event.preventDefault(); dashboard.selectChartSearch('${st.q}')"
            class="w-full text-left px-3 py-2 border-t border-gray-700/60 ${st.active === st.hits.length ? 'bg-blue-500/15' : 'hover:bg-gray-700/50'} transition">
            <span class="text-xs text-gray-400">Open </span><span class="font-mono font-semibold text-sm text-blue-300">${st.q}</span><span class="text-xs text-gray-500"> — chart any ticker →</span>
          </button>` : '';
        dd.innerHTML = rows + raw;
        dd.classList.remove('hidden');
      }

      chartSearchKey(e) {
        const st = this._csState;
        if (e.key === 'Escape') { e.stopPropagation(); this.closeChartSearch(); e.target.blur(); return; }
        if (!st) { if (e.key === 'Enter') e.preventDefault(); return; }
        const total = st.hits.length + (st.showRaw ? 1 : 0);
        if (e.key === 'ArrowDown') { e.preventDefault(); st.active = (st.active + 1) % total; this._renderChartSearchDd(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); st.active = (st.active - 1 + total) % total; this._renderChartSearchDd(); }
        else if (e.key === 'Enter') {
          e.preventDefault();
          const sym = st.active < st.hits.length ? st.hits[st.active].asset : st.q;
          this.selectChartSearch(sym);
        }
      }

      selectChartSearch(sym) {
        this.closeChartSearch();
        const el = document.getElementById('chart-ticker-search');
        if (el) el.value = '';
        this.openChartView(sym.toUpperCase());
      }

      closeChartSearch() {
        this._csState = null;
        document.getElementById('chart-search-dd')?.classList.add('hidden');
      }

      // Admin: pause/resume all FMP fetching (agents flip to Yahoo-only data on
      // their next scan cycle). Same Clerk-metadata gate as the Tweet button.
      async toggleFmp() {
        const next = !this.fmpDisabled;
        const msg = next
          ? 'Pause ALL FMP fetching?\n\nScanners switch to Yahoo-only data on their next cycle (~15 min). Fundamentals (sector, EPS, earnings tone) pause until re-enabled.'
          : 'Resume FMP fetching?\n\nScanners return to FMP data on their next cycle.';
        if (!confirm(msg)) return;
        try {
          const r = await fetch('/api/admin/fmp-toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ disabled: next }),
          });
          if (!r.ok) throw new Error((await r.json()).error || 'HTTP ' + r.status);
          this.fmpDisabled = (await r.json()).fmpDisabled;
          this.toast(this.fmpDisabled ? 'FMP paused — Yahoo-only mode from the next scan cycle' : 'FMP resumed', { kind: this.fmpDisabled ? 'warn' : 'success' });
          this.render();
        } catch (e) {
          this.toast('Toggle failed: ' + e.message, { kind: 'warn' });
        }
      }

      // Admin-only rulebook: the active signal rules and the evidence behind
      // them. Deliberately NOT public — exact thresholds are part of the edge.
      rulebookPill() {
        if (!this.isAdmin) return '';
        return `<button onclick="dashboard.toggleRulebook()" class="badge bg-gray-700/40 text-gray-400 ring-1 ring-gray-600/40 cursor-pointer hover:text-gray-200 transition" title="Admin: active signal rules + the evidence behind them">📖 Rules</button>`;
      }

      toggleRulebook() {
        document.getElementById('rulebook-overlay')?.remove();
        if (this._rulebookOpen) { this._rulebookOpen = false; return; }
        this._rulebookOpen = true;
        const ov = document.createElement('div');
        ov.id = 'rulebook-overlay';
        ov.className = 'fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4';
        ov.addEventListener('click', (ev) => { if (ev.target === ov) { ov.remove(); this._rulebookOpen = false; } });
        const rule = (title, body) => `
          <div class="border-t border-gray-700/50 pt-3 mt-3">
            <div class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold mb-1">${title}</div>
            <div class="text-[13px] text-gray-300 leading-relaxed">${body}</div>
          </div>`;
        ov.innerHTML = `
          <div class="bg-gray-800 ring-1 ring-gray-600/80 rounded-lg shadow-xl w-full max-w-2xl p-5 max-h-[85vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start">
              <div>
                <div class="font-bold text-white">Active signal rules — admin only</div>
                <div class="text-[12px] text-gray-500 mt-0.5">Calibrated from the 2,074-base outcome study (Aug 2026, 304 stocks, 2y of dailies, effective 20-bar returns with the -8% stop). Baseline: 44.3% win, median -2.4%. Thresholds are edge — keep private.</div>
              </div>
              <button onclick="dashboard.toggleRulebook()" class="text-gray-500 hover:text-white transition ml-3">✕</button>
            </div>
            ${rule('VCP badge (recalibrated)', 'Type1 + base coil 0.70–0.90 + breakout volume ≥ 2.0x average. The old ATR/dry-up definition selected a 35%-win cohort; this combo measured <span class="text-green-400 font-semibold">49.8% win, +7.9% mean</span> (n=311). Extreme tightening (&lt;0.7 coil) and volume dry-up both underperform — dropped.')}
            ${rule('Blue Sky (strongest factor)', 'Pivot within 2% of the 52w high: <span class="text-green-400 font-semibold">53.0% win / 28% stopped</span> vs 35.0% / 55% for buried bases. Now worth +4 confidence on Type1. Context beats shape: a shallow base only works late in an advance or at blue sky (56.5% win) — shallow-but-buried wins 26%.')}
            ${rule('Base age', '≥16 weeks (~80 bars): best bucket in the study, <span class="text-green-400 font-semibold">58.8% win / 26% stopped</span> (n=313). +4 confidence. Older bases run less at their peak but fail far less often.')}
            ${rule('Depth (contextual)', 'U-shaped and context-dependent. 10–20% is the worst pocket (<span class="text-orange-400 font-semibold">39.3% win, -5 confidence</span>). Shallow &lt;10% only works in context: at blue sky it wins 56.5%, but <span class="text-orange-400 font-semibold">shallow-and-buried wins 26.0%</span> — now -6 confidence when shallow without blue sky. 20–35% is boom-or-bust. (Sequence position — shallow as a 3rd+ base, 53.9% — needs base-objects in the scanner; future work.)')}
            ${rule('Alert volume tiers', '1.2x avg = shown on dashboard · <span class="text-green-400 font-semibold">≥2x = emailed</span> (where mean outcomes jump) · ≥4x = 🔥 premium flag (best bucket, mean +5.9). The old 1.2x email floor barely cleared noise.')}
            ${rule('Staircase — the "road" (bonus, not gate)', 'Progressive thirds contraction (r1 ≥ r2 ≥ r3, ≥10% net shrink). Alone it predicts nothing (45.1% vs 44.2%), but inside the VCP gate it stratifies <span class="text-green-400 font-semibold">59.6% win / +11.9 mean</span> vs 50.7% without (n=52 — small, so +3 confidence bonus rather than a hard gate until live data grows the sample).')}
            ${rule('Failed pokes (counter-intuitive)', '1–2 pokes = <span class="text-green-400">defended pivot, 46.7% win</span>. Zero pokes = untested, 40.3% win and more stops. 3+ = heavy supply. Display flipped accordingly.')}
            <div class="border-t border-gray-700/50 mt-3 pt-2 text-[11px] text-gray-500">Survivorship caveat: sample = current signal universe (over-represents recent winners); treat as relative comparisons. Full bucket table: research scratchpad CSV.</div>

      fmpTogglePill() {
        if (!this.isAdmin) return '';
        return this.fmpDisabled
          ? `<button onclick="dashboard.toggleFmp()" class="badge bg-red-500/15 text-red-400 ring-1 ring-red-500/30 cursor-pointer font-semibold hover:brightness-125 transition" title="Admin: FMP fetching is PAUSED — all data via Yahoo, fundamentals skipped. Click to resume."><span class="badge-dot"></span>FMP paused · Yahoo mode</button>`
          : `<button onclick="dashboard.toggleFmp()" class="badge bg-gray-700/40 text-gray-500 ring-1 ring-gray-600/40 cursor-pointer hover:text-gray-300 transition" title="Admin: FMP data source active. Click to pause all FMP fetching (bandwidth emergency) — scanners switch to Yahoo-only.">FMP: on</button>`;
      }

      async fetchSignals() {
        try {
          const url = `/api/signals?type=${this.assetTypeFilter}&days=${this.lookbackDays}&${REGION_Q}`;
          const res = await fetch(url);
          const data = await res.json();

          if (data.highConfidence && data.mediumConfidence) {
            this.signals = [...data.highConfidence, ...data.mediumConfidence];
          } else {
            this.signals = Array.isArray(data) ? data : [];
          }
          this.trackingSignals = Array.isArray(data.tracking) ? data.tracking : [];
          this.breadth = data.stats?.breadth || null;

          this.lastFetchAt = Date.now();
          this.loading = false;
          // Only re-render the main dashboard — the backtest panel is independent of
          // signals and re-rendering would flicker the recent-evaluations list every 5s.
          if (!this.showBacktest) this.render();
          this.fetchSparklines();
          this.fetchMarketHealth();
        } catch (error) {
          console.error('Failed to fetch signals:', error);
        }
      }

      // Load the user's lists, settle on an active one, then pull its items.
      async fetchShortlistLists() {
        try {
          const res = await fetch('/api/shortlist-lists');
          if (!res.ok) throw new Error('lists fetch failed');
          this.lists = await res.json();
          // Keep the remembered active list if it still exists, else the first.
          if (!this.lists.some(l => l.id === this.activeListId)) {
            this.activeListId = this.lists[0]?.id || null;
          }
          if (this.activeListId) localStorage.setItem('activeListId', this.activeListId);
          await this.fetchShortlist();
        } catch (error) {
          console.error('Failed to fetch lists:', error);
        }
      }

      async fetchShortlist() {
        if (!this.activeListId) { this.shortlist = []; if (!this.showBacktest) this.render(); return; }
        try {
          const res = await fetch(`/api/shortlist?listId=${encodeURIComponent(this.activeListId)}`);
          this.shortlist = res.ok ? await res.json() : [];
          if (!this.showBacktest) this.render();
        } catch (error) {
          console.error('Failed to fetch shortlist:', error);
        }
      }

      selectList(id) {
        this.activeListId = id;
        localStorage.setItem('activeListId', id);
        this.fetchShortlist();
      }

      async createList() {
        const name = (prompt('New list name (e.g. India)') || '').trim();
        if (!name) return;
        try {
          const res = await fetch('/api/shortlist-lists', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
          });
          if (!res.ok) throw new Error((await res.json()).error || 'create failed');
          const list = await res.json();
          this.activeListId = list.id;
          localStorage.setItem('activeListId', list.id);
          await this.fetchShortlistLists();
          this.toast(`Created list "${name}"`, { kind: 'success' });
        } catch (error) {
          this.toast(error.message, { kind: 'warn' });
        }
      }

      // Manually add ticker(s) to the active list from the shortlist screen.
      // Accepts comma/space-separated symbols so a whole list can be pasted.
      async addTicker() {
        if (!this.activeListId) { this.toast('Create a list first', { kind: 'warn' }); return; }
        const raw = (prompt('Add ticker(s) — comma or space separated') || '').trim();
        if (!raw) return;
        const tickers = [...new Set(raw.toUpperCase().split(/[\s,]+/).filter(Boolean))];
        try {
          for (const asset of tickers) {
            await fetch('/api/shortlist', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ listId: this.activeListId, asset }),
            });
          }
          await this.fetchShortlistLists();
          this.toast(`Added ${tickers.length} ticker${tickers.length !== 1 ? 's' : ''}`, { kind: 'success' });
        } catch (error) {
          this.toast('Add failed', { kind: 'warn' });
        }
      }

      async renameList(id) {
        const current = this.lists.find(l => l.id === id);
        const name = (prompt('Rename list', current?.name || '') || '').trim();
        if (!name || name === current?.name) return;
        try {
          const res = await fetch(`/api/shortlist-lists/${id}`, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
          });
          if (!res.ok) throw new Error((await res.json()).error || 'rename failed');
          await this.fetchShortlistLists();
        } catch (error) {
          this.toast(error.message, { kind: 'warn' });
        }
      }

      async deleteList(id) {
        const list = this.lists.find(l => l.id === id);
        if (!confirm(`Delete list "${list?.name}" and its ${list?.count || 0} ticker(s)?`)) return;
        try {
          const res = await fetch(`/api/shortlist-lists/${id}`, { method: 'DELETE' });
          if (!res.ok) throw new Error('delete failed');
          if (this.activeListId === id) this.activeListId = null;
          await this.fetchShortlistLists();
          this.toast('List deleted', { kind: 'info' });
        } catch (error) {
          this.toast(error.message, { kind: 'warn' });
        }
      }

      async toggleShortlist(asset, e) {
        e.stopPropagation();
        if (!this.activeListId) { this.toast('Create a list first (Shortlist tab)', { kind: 'warn' }); return; }
        const isInList = this.shortlist.some(item => item.asset === asset);
        const listName = this.lists.find(l => l.id === this.activeListId)?.name || 'list';
        try {
          if (isInList) {
            await fetch(`/api/shortlist/${encodeURIComponent(this.activeListId)}/${encodeURIComponent(asset)}`, { method: 'DELETE' });
            this.toast(`${asset} removed from ${listName}`, { kind: 'info' });
          } else {
            await fetch('/api/shortlist', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ listId: this.activeListId, asset }),
            });
            this.toast(`${asset} added to ${listName}`, { kind: 'success' });
          }
          await this.fetchShortlistLists();
        } catch (error) {
          console.error('Failed to update shortlist:', error);

      async removeAsset(asset, e) {
        if (e) e.stopPropagation();
        const row = e?.target?.closest('tr');
        try {
          if (row) row.classList.add('removing');
          await fetch('/api/removed-assets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ asset }),
          });
          await new Promise(resolve => setTimeout(resolve, 300)); // Wait for animation
          this.closeDrawer();
          await this.fetchSignals();
          this.toast(`${asset} hidden`, {
            kind: 'info',
            undo: async () => {
              try {
                await fetch(`/api/removed-assets/${encodeURIComponent(asset)}`, { method: 'DELETE' });
                await this.fetchSignals();
              } catch (err) {
                console.error('Undo hide failed', err);
              }
            },
          });
        } catch (error) {
          console.error('Failed to remove asset:', error);
          if (row) row.classList.remove('removing');
          this.toast(`Failed to hide ${asset}`, { kind: 'warn' });
        }
      }

      renderTickerPulse(d) {

        if (!d || (!d.sentiment && (!d.news || !d.news.length))) {

          const fmt = (n) => (Number(n) || 0).toLocaleString();
          html += `

              <div class="flex justify-between items-center mb-1.5">

                <span class="font-mono tabular-nums">${s.bullishPct}% <span class="text-gray-500 text-[11px]">bullish</span></span>
              </div>
              <div class="h-1.5 rounded-full bg-gray-700 overflow-hidden"><div class="${barColor} h-full" style="width:${s.bullishPct}%"></div></div>
              <div class="text-[11px] text-gray-500 mt-1.5">${fmt(s.posts)} posts · ${fmt(s.impressions)} impressions</div>
            </div>`;
        }
        if (d.news && d.news.length) {
          html += '<div class="space-y-1.5">' + d.news.map(n => `
            <a href="${esc(n.url)}" target="_blank" rel="noopener" class="block bg-gray-800/40 hover:bg-gray-800/70 ring-1 ring-gray-700/50 rounded px-3 py-2 transition">
              <div class="text-[12px] text-gray-200 leading-snug">${esc(n.title)}</div>

      renderTranscript(ta) {
        const el = document.getElementById('transcript-content');
        if (!el) return;
        if (!ta) {
          el.innerHTML = '<span class="text-gray-500">No earnings call analysis yet. Triggered automatically for signals at 90%+ confidence, or click Analyze.</span>';
          return;

        const toneColor = ta.tone === 'bullish' ? 'text-green-400' : ta.tone === 'bearish' ? 'text-red-400' : 'text-yellow-400';
        const guidanceColor = ta.guidanceDirection === 'raised' ? 'text-green-400' : ta.guidanceDirection === 'lowered' ? 'text-red-400' : 'text-gray-300';
        const risks = (ta.riskFlags || []).map(r => `<span class="inline-block px-2 py-0.5 rounded bg-red-900 text-red-200 text-xs mr-1 mb-1">⚠ ${r}</span>`).join('');
        const highlights = (ta.highlights || []).map(h => `<span class="inline-block px-2 py-0.5 rounded bg-green-900 text-green-200 text-xs mr-1 mb-1">+ ${h}</span>`).join('');
        el.innerHTML = `
          <div class="flex flex-wrap justify-between items-center mb-2 gap-2">
            <div class="flex items-center gap-2">
              <div class="text-xs text-gray-400">Q${ta.quarter} ${ta.year}</div>
              ${dashboard.isAdmin ? `<button onclick="dashboard.tweetEarnings('${ta.asset}', event)" title="Tweet this earnings breakdown to X" class="text-xs px-2 py-0.5 rounded bg-sky-600 hover:bg-sky-500 text-white font-medium">🐦 Tweet</button>` : ''}
            </div>
            <div class="flex gap-3 text-xs">
              <span>Tone: <span class="${toneColor} font-semibold">${ta.tone} (${ta.toneScore.toFixed(2)})</span></span>
              <span>Guidance: <span class="${guidanceColor} font-semibold">${ta.guidanceDirection}</span></span>

          </div>
          <div class="mb-3 whitespace-pre-wrap break-words text-gray-200">${ta.summary}</div>
          ${highlights ? `<div class="mb-1">${highlights}</div>` : ''}

          <div class="text-xs text-gray-500 mt-2">Model: ${ta.modelUsed} · ${new Date(ta.createdAt).toLocaleDateString()}</div>
        `;
