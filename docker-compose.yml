services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: signal-forge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nipunsud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: signal_forge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nipunsud}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migration runner - ensures schema exists before agents run
  migrations:
    build:
      context: .
      dockerfile: apps/breakout-agent/Dockerfile
      target: base
    container_name: signal-forge-migrations
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nipunsud}:${DB_PASSWORD:-postgres}@postgres:5432/signal_forge
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_ASSISTANCE=${AI_ASSISTANCE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm exec prisma migrate deploy

  # Dashboard server
  dashboard:
    build:
      context: .
      dockerfile: apps/breakout-agent/Dockerfile
      target: dashboard
    container_name: signal-forge-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nipunsud}:${DB_PASSWORD:-postgres}@postgres:5432/signal_forge
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_ASSISTANCE=${AI_ASSISTANCE:-false}
      - FMP_DISABLED=${FMP_DISABLED:-false}
      - FMP_API_KEY=${FMP_API_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      - STRIPE_PRICE_ID_YEARLY=${STRIPE_PRICE_ID_YEARLY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # X posting for the admin "Tweet earnings" button (admin gated via Clerk
      # private metadata, so no admin env needed — just the X credentials).
      - X_POST_ENABLED=${X_POST_ENABLED:-false}
      - X_API_KEY=${X_API_KEY:-}
      - X_API_SECRET=${X_API_SECRET:-}
      - X_ACCESS_TOKEN=${X_ACCESS_TOKEN:-}
      - X_ACCESS_SECRET=${X_ACCESS_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: node server.js

  # Breakout Agent - Tier 1
  agent-tier-1:
    build:
      context: .
      dockerfile: apps/breakout-agent/Dockerfile
      target: agent
    env_file: .env.tiers/.env.tier-1
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nipunsud}:${DB_PASSWORD:-postgres}@postgres:5432/signal_forge
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_ASSISTANCE=${AI_ASSISTANCE:-false}
      - FMP_DISABLED=${FMP_DISABLED:-false}
      - CACHE_DIR=/cache
      - X_POST_ENABLED=${X_POST_ENABLED:-false}
      - X_API_KEY=${X_API_KEY:-}
      - X_API_SECRET=${X_API_SECRET:-}
      - X_ACCESS_TOKEN=${X_ACCESS_TOKEN:-}
      - X_ACCESS_SECRET=${X_ACCESS_SECRET:-}
      # Only this (shard-0) tier posts to X. All cron/cap knobs are optional —
      # the code has sensible defaults; set any in root .env to override.
      - X_TEASER_CRON=${X_TEASER_CRON:-}
      - X_TEASER_MAX=${X_TEASER_MAX:-}
      - X_AUDIT_CRON=${X_AUDIT_CRON:-}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://dashboard:3000}
    depends_on:
      migrations:
        condition: service_completed_successfully
    command: npm start
    volumes:
      - eod-cache:/cache
    restart: unless-stopped

  # Breakout Agent - Tier 2
  agent-tier-2:
    build:
      context: .
      dockerfile: apps/breakout-agent/Dockerfile
      target: agent
    env_file: .env.tiers/.env.tier-2
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nipunsud}:${DB_PASSWORD:-postgres}@postgres:5432/signal_forge
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_ASSISTANCE=${AI_ASSISTANCE:-false}
      - FMP_DISABLED=${FMP_DISABLED:-false}
      - CACHE_DIR=/cache
      - X_POST_ENABLED=${X_POST_ENABLED:-false}
      - X_API_KEY=${X_API_KEY:-}
      - X_API_SECRET=${X_API_SECRET:-}
      - X_ACCESS_TOKEN=${X_ACCESS_TOKEN:-}
      - X_ACCESS_SECRET=${X_ACCESS_SECRET:-}
    depends_on:
      migrations:
        condition: service_completed_successfully
    command: npm start
    volumes:
      - eod-cache:/cache
    restart: unless-stopped

  # Breakout Agent - Tier 3
  agent-tier-3:
    build:
      context: .
      dockerfile: apps/breakout-agent/Dockerfile
      target: agent
    env_file: .env.tiers/.env.tier-3
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nipunsud}:${DB_PASSWORD:-postgres}@postgres:5432/signal_forge
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_ASSISTANCE=${AI_ASSISTANCE:-false}
      - FMP_DISABLED=${FMP_DISABLED:-false}
      - CACHE_DIR=/cache
      - X_POST_ENABLED=${X_POST_ENABLED:-false}
      - X_API_KEY=${X_API_KEY:-}
      - X_API_SECRET=${X_API_SECRET:-}
      - X_ACCESS_TOKEN=${X_ACCESS_TOKEN:-}
      - X_ACCESS_SECRET=${X_ACCESS_SECRET:-}
    depends_on:
      migrations:
        condition: service_completed_successfully
    command: npm start
    volumes:
      - eod-cache:/cache
    restart: unless-stopped

  # Breakout Agent - Tier 4
  agent-tier-4:
    build:
      context: .
      dockerfile: apps/breakout-agent/Dockerfile
      target: agent
    env_file: .env.tiers/.env.tier-4
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nipunsud}:${DB_PASSWORD:-postgres}@postgres:5432/signal_forge
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_ASSISTANCE=${AI_ASSISTANCE:-false}
      - FMP_DISABLED=${FMP_DISABLED:-false}
      - CACHE_DIR=/cache
      - X_POST_ENABLED=${X_POST_ENABLED:-false}
      - X_API_KEY=${X_API_KEY:-}
      - X_API_SECRET=${X_API_SECRET:-}
      - X_ACCESS_TOKEN=${X_ACCESS_TOKEN:-}
      - X_ACCESS_SECRET=${X_ACCESS_SECRET:-}
    depends_on:
      migrations:
        condition: service_completed_successfully
    command: npm start
    volumes:
      - eod-cache:/cache
    restart: unless-stopped

  # Breakout Agent - Tier 5
  agent-tier-5:
    build:
      context: .
      dockerfile: apps/breakout-agent/Dockerfile
      target: agent
    env_file: .env.tiers/.env.tier-5
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nipunsud}:${DB_PASSWORD:-postgres}@postgres:5432/signal_forge
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_ASSISTANCE=${AI_ASSISTANCE:-false}
      - FMP_DISABLED=${FMP_DISABLED:-false}
      - CACHE_DIR=/cache
      - X_POST_ENABLED=${X_POST_ENABLED:-false}
      - X_API_KEY=${X_API_KEY:-}
      - X_API_SECRET=${X_API_SECRET:-}
      - X_ACCESS_TOKEN=${X_ACCESS_TOKEN:-}
      - X_ACCESS_SECRET=${X_ACCESS_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: npm start
    volumes:
      - eod-cache:/cache
    restart: unless-stopped

  # India (NSE) Breakout Agent — Shard 1 of 2. REGION=IN + TZ=Asia/Kolkata come
  # from the env_file; scans the NSE universe on IST market hours. No X posting.
  agent-in-1:
    build:
      context: .
      dockerfile: apps/breakout-agent/Dockerfile
      target: agent
    env_file: .env.tiers/.env.tier-in-1
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nipunsud}:${DB_PASSWORD:-postgres}@postgres:5432/signal_forge
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_ASSISTANCE=${AI_ASSISTANCE:-false}
      - FMP_DISABLED=${FMP_DISABLED:-false}
      - CACHE_DIR=/cache
    depends_on:
      migrations:
        condition: service_completed_successfully
    command: npm start
    volumes:
      - eod-cache:/cache
    restart: unless-stopped

  # India (NSE) Breakout Agent — Shard 2 of 2.
  agent-in-2:
    build:
      context: .
      dockerfile: apps/breakout-agent/Dockerfile
      target: agent
    env_file: .env.tiers/.env.tier-in-2
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nipunsud}:${DB_PASSWORD:-postgres}@postgres:5432/signal_forge
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_ASSISTANCE=${AI_ASSISTANCE:-false}
      - FMP_DISABLED=${FMP_DISABLED:-false}
      - CACHE_DIR=/cache
    depends_on:
      migrations:
        condition: service_completed_successfully
    command: npm start
    volumes:
      - eod-cache:/cache
    restart: unless-stopped

  # Reverse proxy + automatic HTTPS (Let's Encrypt) for dataquant.ai.
  # Proxies the domain to the dashboard container over the internal network.
  caddy:
    image: caddy:2-alpine
    container_name: signal-forge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certs live here — persist so they survive rebuilds
      - caddy_config:/config
    depends_on:
      - dashboard

volumes:
  eod-cache:
  postgres_data:
    driver: local
  caddy_data:
  caddy_config:

